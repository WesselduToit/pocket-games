<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#e7decf">
<meta name="mobile-web-app-capable" content="yes">
<title>Dust bunnies</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e7decf'/%3E%3Ccircle cx='16' cy='18' r='11' fill='%239e9b98'/%3E%3Ccircle cx='12' cy='17' r='2' fill='%23333130'/%3E%3Ccircle cx='20' cy='17' r='2' fill='%23333130'/%3E%3C/svg%3E">
<style>
:root{--paper:#f6f0e5;--floor:#e7decf;--ink:#38362f;--muted:#746f61;--line:#d0c5b2;--green:#385e4c;--green-dark:#244433;--gold:#edbc61;--white:#fffaf1;--body:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#c6bcab;color:var(--ink);font-family:var(--body);overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,select,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}
#app{position:fixed;inset:0;max-width:500px;margin:auto;background:var(--paper);overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none;padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--floor)}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.iconbtn{min-width:44px;min-height:42px;padding:0 9px;border:1px solid var(--line);border-radius:10px;background:var(--white);font-size:12px;font-weight:700;flex:none}
h1{font-family:Georgia,serif;font-weight:700;font-size:40px;line-height:1.07;letter-spacing:-.045em}
h2{font-family:Georgia,serif;font-size:24px;line-height:1.1}
h3{font-size:16px;line-height:1.2}
p{font-size:14px;line-height:1.5;color:var(--muted)}
small,.small{font-size:12px;color:var(--muted);line-height:1.4}
.btn{min-height:44px;padding:10px 15px;border-radius:12px;border:1px solid var(--line);background:var(--white);font-weight:750;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--green);color:var(--white);border-color:var(--green-dark);box-shadow:0 3px 0 var(--green-dark)}
.btn.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--green-dark)}
.btn.big{width:100%;min-height:53px;font-size:19px}
.btn.danger{background:#984a3d;color:white;border-color:#793a30}
.textbtn{min-height:42px;font-size:13px;color:var(--muted);text-decoration:underline}
.home-content,.result-content{display:flex;flex-direction:column;gap:11px;padding:16px 24px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));overflow-y:auto;min-height:0;text-align:center}
.home-content{flex:1;justify-content:center}
.tagline{line-height:1.45}
.bunny-art{position:relative;width:92px;height:75px;margin:2px auto 4px;border-radius:47% 52% 44% 48%;background:#b4b0a7;box-shadow:-10px 5px 0 -5px #c3bfb6,9px 2px 0 -3px #c3bfb6,-2px -5px 0 -1px #c3bfb6;transform:rotate(-6deg)}
.bunny-art:before,.bunny-art:after{content:"";position:absolute;width:20px;height:34px;background:#b4b0a7;top:-17px;border-radius:70% 70% 40% 40%}
.bunny-art:before{left:16px;transform:rotate(-15deg)}.bunny-art:after{right:15px;transform:rotate(15deg)}
.bunny-art i{position:absolute;top:29px;left:28px;width:6px;height:7px;background:#38362f;border-radius:50%;z-index:1}.bunny-art i+i{left:58px}
.bunny-art b{position:absolute;left:44px;top:43px;width:7px;height:4px;border-radius:50%;background:#e7decf}
#titleStar{color:#a87820;font-family:var(--body);font-size:27px;margin-left:4px;vertical-align:middle}
.dust-total{padding:5px 0 2px}.dust-total small{display:block}.dust-total strong{display:block;font-size:37px;line-height:1.2;letter-spacing:-.03em;color:var(--green)}
.room-label{font-size:12px;text-align:left;font-weight:700;margin-bottom:-6px}
select{display:block;width:100%;min-height:43px;max-width:100%;border:1px solid var(--line);border-radius:9px;background:var(--white);padding:8px 30px 8px 11px;font-size:14px}
.room-note{font-size:12px;margin-top:-7px}
.round-hud{display:flex;gap:7px;align-items:center;justify-content:space-between;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--paper);border-bottom:1px solid var(--line);flex:none}
.round-hud>div{min-width:0;flex:1;text-align:center}.round-hud small{display:block;font-size:10px;white-space:nowrap}.round-hud strong{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.25}.round-hud .iconbtn{min-width:43px;padding:0 7px}
.room-stage{position:relative;flex:1;min-height:0;background:#bfb4a2;overflow:hidden}
#roundCanvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.streak-label{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);pointer-events:none;white-space:nowrap;background:#fffaf1dd;padding:5px 13px;border-radius:20px;color:var(--green);font-size:12px;font-weight:700}
.result-content{flex:1;justify-content:center;gap:18px}.result-mark{font-size:48px;color:#b78b42;line-height:1}.stat-pair{display:flex;justify-content:center;gap:26px;padding:7px 0}.stat-pair small,.stat-pair b{display:block}.stat-pair b{font-size:21px}
#treeScroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:70px;background:var(--paper);-webkit-overflow-scrolling:touch}
#treeCanvas{display:block;width:100%;touch-action:pan-y}
.node-details{padding:9px 13px 10px;flex:none;border-top:1px solid var(--line);background:var(--white)}
.node-details select{min-height:40px;font-size:12px;padding-top:6px;padding-bottom:6px;background:var(--paper);margin-bottom:7px}
.node-heading{display:flex;justify-content:space-between;gap:8px;align-items:center}.node-heading>b{white-space:nowrap;font-size:12px;color:var(--muted)}
.node-details p{font-size:12px;line-height:1.35;min-height:32px;margin:4px 0 6px}
.node-buy{display:flex;align-items:center;justify-content:space-between;gap:8px}.node-buy .btn{min-width:100px;min-height:40px;padding:6px 12px}.node-buy small{max-width:65%;font-size:11px}
.tree-footer{flex:none;padding:7px 13px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:var(--floor)}
.tree-footer .btn.big{min-height:47px;font-size:18px}
.modal{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#292821a6;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 45px #0004;padding:17px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.sheet-head .iconbtn{min-height:40px}
#modalBody{display:flex;flex-direction:column;gap:13px}#modalBody p{font-size:13px}#modalBody ul{margin-left:20px;color:var(--muted);font-size:14px;line-height:1.6}#modalBody li{padding-left:1px;margin:3px 0}
.settings-row{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:10px}.settings-row .btn{min-width:90px}
textarea{resize:vertical;width:100%;min-height:85px;border:1px solid var(--line);border-radius:9px;background:var(--white);padding:10px;font-size:12px;user-select:text;-webkit-user-select:text;word-break:break-all}
.field-label{font-size:12px;font-weight:700}.fine-print{border-top:1px solid var(--line);padding-top:10px}.ending-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 0}.ending-stats div:last-child{grid-column:1/-1}.ending-stats small,.ending-stats b{display:block}.ending-stats b{font-size:21px}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 30px);width:max-content;border-radius:12px;background:var(--ink);color:var(--white);padding:11px 16px;font-size:13px;text-align:center;box-shadow:0 3px 14px #0003}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-height:640px){.home-content{padding:12px 24px;gap:8px}.bunny-art{width:74px;height:59px;margin-top:16px;margin-bottom:2px}.bunny-art i{top:23px;left:20px}.bunny-art i+i{left:48px}.bunny-art b{left:35px;top:35px}.bunny-art:before,.bunny-art:after{width:17px;height:29px;top:-17px}.bunny-art:before{left:12px}.bunny-art:after{right:10px}h1{font-size:35px}.tagline{font-size:12px}.dust-total strong{font-size:31px}.dust-total{padding:0}.home-content .btn.big{min-height:48px}.home-content>.btn:not(.big){min-height:40px}.room-note{margin-top:-5px}.result-content{gap:13px}.result-mark{font-size:39px}.node-details{padding-top:6px;padding-bottom:6px}.node-details p{min-height:29px;margin:3px 0 4px}.tree-footer{padding-top:6px;padding-bottom:9px}.tree-footer .btn.big{min-height:43px}.node-details select{min-height:40px;margin-bottom:5px}}

</style>
</head>
<body>
<div id="app">
  <section id="titleScreen" class="screen">
    <header class="topbar"><span class="eyebrow">A little less dust</span><button class="iconbtn" data-act="settings" aria-label="Settings">Settings</button></header>
    <main class="home-content">
      <div class="bunny-art" aria-hidden="true"><i></i><i></i><b></b></div>
      <h1>Dust bunnies<span id="titleStar"></span></h1>
      <p class="tagline">A clean sweep. A bigger broom.<br>A house full of possibilities.</p>
      <div class="dust-total"><small>Dust to spend</small><strong id="titleDust">0</strong></div>
      <label class="room-label" for="roomChoice">Choose a room</label>
      <select id="roomChoice" aria-label="Choose a room"></select>
      <p id="roomNote" class="room-note"></p>
      <button class="btn primary big" data-act="sweep" id="titleSweep">Sweep</button>
      <button class="btn" data-act="tree">Skill tree</button>
      <p id="titleStats" class="small"></p>
    </main>
  </section>

  <section id="roundScreen" class="screen hidden" aria-label="Sweep the room">
    <header class="round-hud">
      <div><small>Time</small><strong id="roundTime">30</strong></div>
      <div><small>This round</small><strong id="roundDust">0</strong></div>
      <div><small>Total dust</small><strong id="roundTotal">0</strong></div>
      <button class="iconbtn" data-act="pause" aria-label="Pause round">Pause</button>
    </header>
    <div class="room-stage"><canvas id="roundCanvas" aria-label="Drag your finger to sweep dust"></canvas><p id="streakLabel" class="streak-label">Drag to sweep</p></div>
  </section>

  <section id="resultsScreen" class="screen hidden">
    <header class="topbar"><span class="eyebrow">One room, a little cleaner</span><button class="iconbtn" data-act="home">Home</button></header>
    <main class="result-content">
      <div class="result-mark" aria-hidden="true">✦</div>
      <h1>Nice sweep</h1><p id="resultRoom"></p>
      <div class="dust-total"><small>Dust this round</small><strong id="resultDust">0</strong></div>
      <div class="stat-pair"><div><small>Best round</small><b id="resultBest">0</b></div><div><small>Dust to spend</small><b id="resultBank">0</b></div></div>
      <button class="btn primary big" data-act="sweep">Sweep again</button>
      <button class="btn" data-act="tree">Skill tree</button>
      <button class="textbtn" data-act="settings">Settings</button>
    </main>
  </section>

  <section id="treeScreen" class="screen hidden">
    <header class="topbar"><div><h2>Skill tree</h2><p><b id="treeDust">0</b> dust to spend</p></div><button class="iconbtn" data-act="home">Home</button></header>
    <div id="treeScroll"><canvas id="treeCanvas" aria-label="Five branches of upgrades. Choose a node below for details."></canvas></div>
    <div id="nodeDetails" class="node-details">
      <label class="sr-only" for="nodeChoice">Choose an upgrade</label><select id="nodeChoice" aria-label="Choose an upgrade"></select>
      <div class="node-heading"><h3 id="nodeName"></h3><b id="nodeLevel"></b></div><p id="nodeEffect"></p>
      <div class="node-buy"><small id="nodeCost"></small><button class="btn primary" data-act="buy" id="nodeBuy">Buy</button></div>
    </div>
    <footer class="tree-footer"><button class="btn primary big" data-act="sweep" id="treeSweep">Sweep</button></footer>
  </section>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet"><div class="sheet-head"><h2 id="modalTitle"></h2><button class="iconbtn" data-act="close" id="modalClose" aria-label="Close">Close</button></div><div id="modalBody"></div></div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
var DB_TUNE = {
  width:100, height:160,
  spawnRate:6, maxSpecks:120, startSpecks:40, bunnyEvery:25,
  broomR:7, roundLength:30, roomValue:2,
  streakWindow:0.6, streakStep:10, streakBonus:0.1, streakCap:2,
  bunnyValue:10, goldenValue:50, bunnySpeed:2.5, burstSpecks:6,
  robotSpeed:10, robotR:4, catSpeed:18, catHerdR:24, catHerdSpeed:7,
  pullSpeed:14, popCount:48, popLife:0.65, helperThink:0.3, sweepTrailLife:0.18,
  goldenChances:[0,1/40,1/20,1/10]
};

var DB_BRANCHES = ['Broom','Dust','Streaks','Helpers','Rooms'];
var DB_ROOMS = [
  {id:'hallway',name:'Hallway',color:'#d9c4a3',decor:['👟','🪴'],value:1,spawn:1},
  {id:'kitchen',name:'Kitchen',color:'#c9dbca',decor:['🍳','🥕'],value:2,spawn:1.2},
  {id:'attic',name:'Attic',color:'#c6ad91',decor:['📦','🧸'],value:4,spawn:1.44},
  {id:'library',name:'Library',color:'#c5b7cc',decor:['📚','🕯️'],value:8,spawn:1.728},
  {id:'ballroom',name:'Ballroom',color:'#dfc8b4',decor:['🎻','🌷'],value:16,spawn:2.0736},
  {id:'observatory',name:'Observatory',color:'#b8c5d9',decor:['🔭','🌙'],value:32,spawn:2.48832}
];

// TUNE: base and growth are the only adjustable parts of each node.
var DB_NODES = [
  {id:'broom',name:'Wider broom',emoji:'🧹',effect:'+15% broom radius per level.',branch:0,parent:null,max:5,base:60,growth:7},
  {id:'time',name:'Longer rounds',emoji:'⏳',effect:'+5 seconds per level.',branch:0,parent:'broom',max:4,base:140,growth:15},
  {id:'pull',name:'Wide bristles',emoji:'🪶',effect:'Pull dust from 4 units farther away per level.',branch:0,parent:'time',max:3,base:190,growth:30},
  {id:'double',name:'Double sweep',emoji:'✨',effect:'Each speck is worth twice as much.',branch:0,parent:'pull',max:1,base:3400000,growth:1},
  {id:'spawn',name:'More dust',emoji:'🌫️',effect:'+20% dust spawning per level.',branch:1,parent:null,max:5,base:70,growth:12},
  {id:'start',name:'Dusty start',emoji:'🏠',effect:'+20 starting specks per level.',branch:1,parent:'spawn',max:3,base:45,growth:80},
  {id:'value',name:'Heavier dust',emoji:'💎',effect:'Dust value ×1.5 per level.',branch:1,parent:'start',max:5,base:160,growth:18.6},
  {id:'burst',name:'Bunny burst',emoji:'💥',effect:'Swept bunnies leave 6 extra specks.',branch:1,parent:'value',max:1,base:26000,growth:1},
  {id:'golden',name:'Golden bunny',emoji:'🌟',effect:'Golden bunnies: 1 in 40, then 20, then 10; worth 50 specks.',branch:1,parent:'burst',max:3,base:950,growth:120},
  {id:'window',name:'Longer window',emoji:'⌛',effect:'+0.2 seconds to keep a streak per level.',branch:2,parent:null,max:3,base:100,growth:100},
  {id:'cap',name:'Higher cap',emoji:'🔥',effect:'+0.5 to the streak multiplier cap per level.',branch:2,parent:'window',max:4,base:220,growth:35},
  {id:'saver',name:'Streak saver',emoji:'🪢',effect:'A broken streak is halved instead of lost.',branch:2,parent:'cap',max:1,base:650000,growth:1},
  {id:'robot',name:'Robot sweeper',emoji:'🤖',effect:'A little robot seeks out dense dust.',branch:3,parent:null,max:1,base:800,growth:1},
  {id:'robots',name:'More robots',emoji:'🛠️',effect:'+1 robot per level.',branch:3,parent:'robot',max:3,base:2200,growth:86},
  {id:'speed',name:'Faster robots',emoji:'⚡',effect:'+20% robot speed per level.',branch:3,parent:'robots',max:3,base:350,growth:100},
  {id:'cat',name:'Cat',emoji:'🐈',effect:'A cat herds bunnies toward your broom.',branch:3,parent:'speed',max:1,base:1800000,growth:1},
  {id:'hallway',name:'Hallway',emoji:'🚪',effect:'Your first room. Make yourself at home.',branch:4,parent:null,max:1,base:0,growth:1,room:0},
  {id:'kitchen',name:'Kitchen',emoji:'🍳',effect:'A new floor: ×2 dust value and +20% spawn.',branch:4,parent:'hallway',max:1,base:1000,growth:1,room:1},
  {id:'attic',name:'Attic',emoji:'📦',effect:'A new floor: ×2 dust value and +20% spawn.',branch:4,parent:'kitchen',max:1,base:24000,growth:1,room:2},
  {id:'library',name:'Library',emoji:'📚',effect:'A new floor: ×2 dust value and +20% spawn.',branch:4,parent:'attic',max:1,base:500000,growth:1,room:3},
  {id:'ballroom',name:'Ballroom',emoji:'🎻',effect:'A new floor: ×2 dust value and +20% spawn.',branch:4,parent:'library',max:1,base:6500000,growth:1,room:4},
  {id:'observatory',name:'Observatory',emoji:'🔭',effect:'A new floor: ×2 dust value and +20% spawn.',branch:4,parent:'ballroom',max:1,base:26000000,growth:1,room:5},
  {id:'spotless',name:'Spotless house',emoji:'⭐',effect:'The whole house sparkles. Celebrate, then keep playing.',branch:4,parent:'observatory',max:1,base:60000000,growth:1}
];

function dbNode(id) {
  for(var i=0;i<DB_NODES.length;i++) if(DB_NODES[i].id===id) return DB_NODES[i];
  return null;
}
function dbNodeLevel(save,id) { return save.levels[id]||0; }
function dbNodeCost(save,id) {
  var node=dbNode(id);
  return node?Math.ceil(node.base*Math.pow(node.growth,dbNodeLevel(save,id))):Infinity;
}
function dbCanBuy(save,id) {
  var node=dbNode(id);
  return !!node && dbNodeLevel(save,id)<node.max && (!node.parent||dbNodeLevel(save,node.parent)>0) && save.dust>=dbNodeCost(save,id);
}
function dbBuy(save,id) {
  if(!dbCanBuy(save,id)) return false;
  var node=dbNode(id);
  save.dust-=dbNodeCost(save,id);
  save.levels[id]=dbNodeLevel(save,id)+1;
  if(node.room!==undefined) save.room=Math.max(save.room,node.room);
  if(id==='spotless') save.completed=true;
  return true;
}
function dbNewSave() {
  return {version:1,savedAt:0,dust:0,totalDust:0,bestRound:0,rounds:0,playTime:0,completed:false,room:0,levels:{hallway:1},sound:true};
}
function dbNumber(value,fallback,max) {
  return typeof value==='number'&&isFinite(value)&&value>=0?Math.min(value,max===undefined?Number.MAX_SAFE_INTEGER:max):fallback;
}
function migrate(raw) {
  if(!raw||typeof raw!=='object'||Array.isArray(raw)) throw new Error('This is not a Dust Bunnies save.');
  if(raw.version!==undefined && (raw.version!==0&&raw.version!==1)) throw new Error('This save version is not supported.');
  var save=dbNewSave(), fields=['savedAt','dust','totalDust','bestRound','rounds','playTime'];
  for(var i=0;i<fields.length;i++) save[fields[i]]=dbNumber(raw[fields[i]],save[fields[i]]);
  save.rounds=Math.floor(save.rounds);
  save.sound=raw.sound!==false;
  var levels=raw.levels||raw.upgrades||{};
  for(i=0;i<DB_NODES.length;i++) {
    var node=DB_NODES[i];
    save.levels[node.id]=Math.floor(dbNumber(levels[node.id],0,node.max));
  }
  save.levels.hallway=1;
  // The old room field also migrates saves made before room nodes existed.
  var room=Math.floor(dbNumber(raw.room,0,DB_ROOMS.length-1));
  for(i=0;i<DB_ROOMS.length;i++) if(save.levels[DB_ROOMS[i].id]) room=Math.max(room,i);
  save.room=room;
  for(i=0;i<=room;i++) save.levels[DB_ROOMS[i].id]=1;
  save.completed=raw.completed===true||save.levels.spotless===1;
  if(save.completed) {
    save.levels.spotless=1;
    save.room=DB_ROOMS.length-1;
    for(i=0;i<DB_ROOMS.length;i++) save.levels[DB_ROOMS[i].id]=1;
  }
  save.totalDust=Math.max(save.totalDust,save.dust,save.bestRound);
  return save;
}
function encodeBackup(save) { return 'DB1.'+btoa(JSON.stringify(migrate(save))); }
function decodeBackup(code) {
  if(typeof code!=='string'||!code.trim()) return null;
  code=code.trim();
  if(code.slice(0,4)==='DB1.') code=code.slice(4);
  try { return migrate(JSON.parse(atob(code))); }
  catch(e) { return null; }
}
function dbStats(save,roomIndex) {
  var l=save.levels, room=DB_ROOMS[roomIndex];
  return {
    broomR:DB_TUNE.broomR*Math.pow(1.15,l.broom||0),
    pullR:4*(l.pull||0),

  if(width!==dbViewWidth||height!==dbViewHeight){ dbView=dbRoomViewport(width,height); dbViewWidth=width; dbViewHeight=height; }
  const v=dbView,room=DB_ROOMS[round.room]||DB_ROOMS[0];
  g.clearRect(0,0,width,height); g.fillStyle='#243b3d'; g.fillRect(0,0,width,height);
  g.save(); g.translate(v.x,v.y); g.scale(v.scale,v.scale);
  g.beginPath(); g.rect(0,0,100,160); g.clip();
  g.fillStyle=room.color; g.fillRect(0,0,100,160); dbRoomDecor(g,round.room);
  for(let i=0;i<round.specks.length;i++){
    const speck=round.specks[i]; if(!speck.active) continue;
    if(speck.bunny) dbDrawBunny(g,speck.x,speck.y,speck.golden,round.elapsed);
    else {
      dbCircle(g,speck.x+.2,speck.y+.4,.69,'rgba(61,48,40,.12)');
      dbCircle(g,speck.x,speck.y,.65,round.room===5?'#65718c':'#827568');
      if(i%3===0) dbCircle(g,speck.x-.35,speck.y-.3,.3,round.room===5?'#8d9db6':'#ac9b87');
    }
  }
  for(let i=0;i<round.robots.length;i++) dbDrawRobot(g,round.robots[i].x,round.robots[i].y,round.elapsed);
  if(round.cat) dbDrawCat(g,round.cat.x,round.cat.y,round.elapsed);
  const broom=round.broom;
  g.save(); g.lineCap='round';
  const trail=broom.trail||[];
  for(let i=0;i<trail.length;i++){
    const sweep=trail[i]; g.globalAlpha=Math.max(0,1-sweep.age/DB_TUNE.sweepTrailLife);
    dbLine(g,sweep.x1,sweep.y1,sweep.x2,sweep.y2,'rgba(255,249,224,.1)',round.stats.broomR*2);
    dbLine(g,sweep.x1,sweep.y1,sweep.x2,sweep.y2,'rgba(255,251,233,.18)',round.stats.broomR);
  }
  g.restore();
  if(broom.down){
    if(round.stats.pullR>0){
      g.strokeStyle='rgba(242,251,224,.35)'; g.lineWidth=.3; g.setLineDash(DB_DASH_REACH);
      g.beginPath(); g.arc(broom.x,broom.y,round.stats.broomR+round.stats.pullR,0,DB_TAU); g.stroke(); g.setLineDash(DB_DASH_NONE);
    }
    dbCircle(g,broom.x,broom.y,round.stats.broomR,'rgba(255,246,208,.16)');
    g.strokeStyle='rgba(255,251,233,.65)'; g.lineWidth=.4; g.beginPath(); g.arc(broom.x,broom.y,round.stats.broomR,0,DB_TAU); g.stroke();
    if(emojiOK('🧹')){
      g.font='11px '+DB_EFONT; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#fff'; g.fillText('🧹',broom.x,broom.y);
    } else dbBrush(g,broom.x,broom.y,1);
  }
  for(let i=0;i<round.pops.length;i++){
    const pop=round.pops[i]; if(!pop.active) continue;
    const progress=Math.min(1,pop.age/.65),ease=progress*progress,x=pop.x+(65-pop.x)*ease,y=pop.y+(-4-pop.y)*ease;
    g.globalAlpha=1-progress*.9;
    dbCircle(g,x,y,.7*(1-progress*.6),'#fff0ad');
    if(pop.value>=8&&progress<.42){
      g.font='bold 3.3px '+DB_FONT; g.fillStyle=round.room===5?'#4b5679':'#6d5539'; g.textAlign='center'; g.fillText('+'+Math.round(pop.value),x,y-2);
    }
  }
  g.globalAlpha=1;
  if(round.streak>=10){
    g.fillStyle='rgba(32,55,53,.82)'; g.fillRect(29,149,42,7);
    g.font='600 3.5px '+DB_FONT; g.fillStyle='#fff1c3'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('streak x'+round.multiplier.toFixed(1),50,152.5);
  } else if(!broom.down&&round.elapsed<2){
    g.fillStyle='rgba(32,55,53,.84)'; g.fillRect(15,144,70,9);
    g.font='500 3.5px '+DB_FONT; g.fillStyle='#fff6e6'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('Touch and sweep the dust',50,148.5);
  }
  g.restore();
}

const DB_TREE_COLORS=['#d6ab6c','#bfa9cf','#e6ac83','#87b6ad','#92afcc'];
let dbTreeWidth=-1,dbTreeCount=-1,dbTreeLayout=[],dbTreeRows=0;
function dbEnsureTree(width){
  if(dbTreeWidth===width&&dbTreeCount===DB_NODES.length) return;
  dbTreeWidth=width; dbTreeCount=DB_NODES.length; dbTreeLayout=[];
  const rows=[0,0,0,0,0],column=(width-20)/5;
  for(let i=0;i<DB_NODES.length;i++){
    const node=DB_NODES[i],branch=Math.max(0,Math.min(4,node.branch));
    dbTreeLayout.push({id:node.id,x:10+column*(branch+.5),y:82+rows[branch]*99,node:node}); rows[branch]++;
  }
  dbTreeRows=Math.max.apply(null,rows);
}
function dbTreeHeight(width){ dbEnsureTree(width); return 51+dbTreeRows*99; }
function dbTreeHit(x,y,width){
  dbEnsureTree(width);
  for(let i=0;i<dbTreeLayout.length;i++){
    const p=dbTreeLayout[i]; if(Math.abs(x-p.x)<=24&&Math.abs(y-p.y)<=25) return p.id;
  }
  return null;
}
function dbTreeFallback(g,x,y,branch){
  if(branch===0) dbBrush(g,x,y,1.7);
  else if(branch===1){ g.save(); g.translate(x,y); g.scale(2.5,2.5); dbDrawBunny(g,0,0,false,0); g.restore(); }
  else if(branch===2){
    g.fillStyle='#f7e6a7'; g.beginPath();
    for(let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2,r=i%2?4:9; if(i===0) g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r); else g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); }
    g.closePath(); g.fill();
  } else if(branch===3){ g.save(); g.translate(x,y); g.scale(2.5,2.5); dbDrawRobot(g,0,0,0); g.restore(); }
  else {
    g.fillStyle='#f4dfb9'; g.fillRect(x-7,y-2,14,12); g.beginPath(); g.moveTo(x-10,y-2); g.lineTo(x,y-11); g.lineTo(x+10,y-2); g.closePath(); g.fill();
    g.fillStyle='#7b8e8b'; g.fillRect(x-2,y+3,4,7);
  }
}
function dbTreeName(g,text,x,y,maxWidth){
  const words=text.split(' '); let line='',row=0;
  for(let i=0;i<words.length;i++){
    const next=line?line+' '+words[i]:words[i];
    if(line&&g.measureText(next).width>maxWidth){ g.fillText(line,x,y+row*12); row++; line=words[i]; }
    else line=next;
    if(row===2) break;
  }
  if(row<2) g.fillText(line,x,y+row*12);
}
function dbDrawTree(g,save,width,height,selectedId){
  dbEnsureTree(width); g.clearRect(0,0,width,height); g.fillStyle='#f5eddf'; g.fillRect(0,0,width,height);
  const column=(width-20)/5;
  g.textAlign='center'; g.textBaseline='middle';
  for(let branch=0;branch<5;branch++){
    const x=10+column*(branch+.5);
    g.fillStyle=DB_TREE_COLORS[branch]; g.fillRect(x-column*.38,11,column*.76,3);
    g.font='600 '+Math.min(11,column*.19)+'px '+DB_FONT; g.fillStyle='#49635e';
    g.fillText(DB_BRANCHES[branch],x,32);
  }
  for(let i=0;i<dbTreeLayout.length;i++){
    const p=dbTreeLayout[i]; if(!p.node.parent) continue;
    let parent=null;
    for(let j=0;j<dbTreeLayout.length;j++) if(dbTreeLayout[j].id===p.node.parent){ parent=dbTreeLayout[j]; break; }
    if(!parent) continue;
    const owned=dbNodeLevel(save,parent.id)>0;
    g.strokeStyle=owned?'#9cb6a2':'#d2cabb'; g.lineWidth=owned?3:2; g.setLineDash(owned?[]:[3,5]);
    g.beginPath(); g.moveTo(parent.x,parent.y+22); g.lineTo(p.x,p.y-23); g.stroke();
  }
  g.setLineDash([]);
  for(let i=0;i<dbTreeLayout.length;i++){
    const p=dbTreeLayout[i],node=p.node,level=dbNodeLevel(save,node.id),maxed=level>=node.max,canBuy=dbCanBuy(save,node.id),selected=node.id===selectedId;
    if(selected){ dbCircle(g,p.x,p.y,27,'#e9bc73'); dbCircle(g,p.x,p.y,24.8,'#f5eddf'); }
    dbCircle(g,p.x,p.y+2,21,'rgba(58,65,52,.09)');
    dbCircle(g,p.x,p.y,21,maxed?'#a8c2ad':level?'#cfdfc8':canBuy?'#fae2b4':'#e3ded3');
    g.strokeStyle=maxed?'#65866b':canBuy?'#c49550':'#c2c9b9'; g.lineWidth=1.3; g.beginPath(); g.arc(p.x,p.y,21,0,DB_TAU); g.stroke();
    g.globalAlpha=level||canBuy?1:.55;
    if(node.emoji&&emojiOK(node.emoji)){
      g.font='22px '+DB_EFONT; g.fillStyle='#2c4844'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(node.emoji,p.x,p.y+.5);
    } else dbTreeFallback(g,p.x,p.y,node.branch);
    g.globalAlpha=1;
    g.font='500 '+Math.min(10,column*.175)+'px '+DB_FONT; g.fillStyle='#314f49'; g.textAlign='center'; g.textBaseline='middle';
    dbTreeName(g,node.name,p.x,p.y+33,column-5);
    g.fillStyle=maxed?'#55785b':'#7d8073'; g.font='600 9px '+DB_FONT; g.fillText(level+'/'+node.max,p.x,p.y+61);
  }
}

const DB_SAVE_KEY='dust-bunnies.save.v1';
const DB_FMT_UNITS=['K','M','B','T','Q'];
let dbSave=null, dbRound=null, dbScreen='title', dbRoom=0, dbSelected='', dbPaused=false, dbLastTime=0, dbLastTone=0,
    dbStorage=null, dbLocalOK=true, dbSaveTimer=null, dbToastTimer=null, dbModalKind='', dbResetArmed=false, dbLastFocus=null;
const dbFinger={x:50,y:80,down:false};
const dbEl=id=>document.getElementById(id);
function dbFmt(n){ n=Math.max(0,Math.floor(n||0)); if(n<1000)return String(n);let i=-1;while(n>=1000&&i<DB_FMT_UNITS.length-1){n/=1000;i++;}return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+DB_FMT_UNITS[i]; }
function dbPlayTime(s){const m=Math.floor((s||0)/60);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m';}
function dbText(id,value){const e=dbEl(id),s=String(value);if(e.textContent!==s)e.textContent=s;}

/* Saves use two local stores. A blocked store never stops a round. */
function dbParseSave(str){try{const o=JSON.parse(str);return o&&typeof o==='object'&&!Array.isArray(o)?migrate(o):null;}catch(e){return null;}}
function dbWriteSave(){
  clearTimeout(dbSaveTimer);dbSaveTimer=null;if(!dbSave)return;
  dbSave.savedAt=Math.max(Date.now(),(dbSave.savedAt||0)+1);
  const str=JSON.stringify(dbSave);
  try{localStorage.setItem(DB_SAVE_KEY,str);dbLocalOK=true;}catch(e){dbLocalOK=false;}
  if(dbStorage){try{dbStorage.transaction('kv','readwrite').objectStore('kv').put(str,'save');}catch(e){}}
}
function dbStoreSave(now){if(!dbSave)return;if(now)dbWriteSave();else if(!dbSaveTimer)dbSaveTimer=setTimeout(dbWriteSave,400);}
function dbOpenStore(){return new Promise(resolve=>{
  let done=false;const finish=()=>{if(!done){done=true;resolve();}};
  try{const r=indexedDB.open('dust-bunnies',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv');};
    r.onsuccess=()=>{if(done){r.result.close();return;}dbStorage=r.result;finish();};r.onerror=finish;r.onblocked=finish;
  }catch(e){finish();}setTimeout(finish,1500);
});}
function dbReadStore(){return new Promise(resolve=>{
  if(!dbStorage)return resolve(null);let done=false;const finish=v=>{if(!done){done=true;resolve(v);}};
  try{const r=dbStorage.transaction('kv').objectStore('kv').get('save');r.onsuccess=()=>finish(r.result||null);r.onerror=()=>finish(null);}catch(e){finish(null);}setTimeout(()=>finish(null),1500);
});}
async function dbLoadSave(){
  let a=null,b=null;try{a=dbParseSave(localStorage.getItem(DB_SAVE_KEY));}catch(e){dbLocalOK=false;}
  await dbOpenStore();b=dbParseSave(await dbReadStore());
  const chosen=a&&b?((b.savedAt||0)>(a.savedAt||0)?b:a):(a||b);
  return chosen?migrate(chosen):dbNewSave();
}

/* Small synthesized notes start only after a touch or key press. */
let dbAudioContext=null;
function dbAudio(){if(!dbSave||!dbSave.sound)return null;try{if(!dbAudioContext){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;dbAudioContext=new A();}if(dbAudioContext.state==='suspended')dbAudioContext.resume();return dbAudioContext;}catch(e){return null;}}
function dbTone(f,delay){const a=dbAudio();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.25,t+.08);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.009);g.gain.exponentialRampToValueAtTime(.0001,t+.11);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.13);}catch(e){}}
function dbJingle(){dbTone(440,0);dbTone(550,.1);dbTone(660,.2);}
function dbToast(text){clearTimeout(dbToastTimer);dbText('toast',text);dbEl('toast').classList.remove('hidden');dbToastTimer=setTimeout(()=>dbEl('toast').classList.add('hidden'),2800);}

function dbShowScreen(name){
  dbScreen=name;
  for(const s of ['title','round','results','tree'])dbEl(s+'Screen').classList.toggle('hidden',s!==name);
  if(name==='title')dbRefreshHome();if(name==='tree')dbRefreshTree();if(name==='results')dbRefreshResults();

}

  dbText('titleSweep',dbSave.rounds?'Sweep again':'Sweep');dbText('titleStats',dbSave.rounds?dbSave.rounds+' rounds · Best '+dbFmt(dbSave.bestRound):'Thirty seconds to make a start.');
  const choice=dbEl('roomChoice');choice.textContent='';
  for(let i=0;i<DB_ROOMS.length;i++){const room=DB_ROOMS[i],o=document.createElement('option');o.value=i;o.textContent=room.name+(i>dbSave.room?' · Locked':'');o.disabled=i>dbSave.room;choice.appendChild(o);}

}
function dbRoomNote(){const room=DB_ROOMS[dbRoom];dbText('roomNote',dbRoom?'Dust value ×'+dbFmt(room.value)+' · More dust to sweep':'Your broom starts here. Unlock rooms in the skill tree.');}
function dbRefreshResults(){dbText('resultRoom',DB_ROOMS[dbRoom].name);dbText('resultDust',dbFmt(dbRound?dbRound.earned:0));dbText('resultBest',dbFmt(dbSave.bestRound));dbText('resultBank',dbFmt(dbSave.dust));}
function dbRefreshTree(){
  if(!dbSelected)dbSelected=DB_NODES[0].id;
  dbText('treeDust',dbFmt(dbSave.dust));dbText('treeSweep',dbSave.rounds?'Sweep again':'Sweep');
  const select=dbEl('nodeChoice');select.textContent='';
  for(const node of DB_NODES){const o=document.createElement('option');o.value=node.id;o.textContent=node.name+' · '+dbNodeLevel(dbSave,node.id)+'/'+node.max;select.appendChild(o);}select.value=dbSelected;
  dbNodeDetails();dbDrawSkillTree();
}
function dbNodeDetails(){
  const node=DB_NODES.find(n=>n.id===dbSelected)||DB_NODES[0],level=dbNodeLevel(dbSave,node.id),maxed=level>=node.max;
  dbText('nodeName',node.name);dbText('nodeLevel',level+' / '+node.max);dbText('nodeEffect',node.effect);
  const locked=node.parent&&!dbNodeLevel(dbSave,node.parent),parent=locked?DB_NODES.find(n=>n.id===node.parent):null;
  dbText('nodeCost',maxed?'Fully upgraded':(parent?'Needs '+parent.name+' · ':'')+dbFmt(dbNodeCost(dbSave,node.id))+' dust');
  dbEl('nodeBuy').disabled=!dbCanBuy(dbSave,node.id);dbText('nodeBuy',maxed?'Owned':'Buy');dbEl('nodeChoice').value=node.id;
}
function dbBuySelected(){
  const completed=dbSave.completed,oldRoom=dbSave.room;if(!dbBuy(dbSave,dbSelected))return;
  if(dbSave.room>oldRoom)dbRoom=dbSave.room;dbStoreSave(true);dbTone(620);dbRefreshTree();
  if(!completed&&dbSave.completed)dbShowEnding();
}

function dbCanvasSize(canvas,width,height){const ratio=Math.min(window.devicePixelRatio||1,3),w=Math.max(1,Math.round(width*ratio)),h=Math.max(1,Math.round(height*ratio));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}const ctx=canvas.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);return ctx;}
function dbDrawSkillTree(){if(dbScreen!=='tree'||!dbSave)return;const canvas=dbEl('treeCanvas'),w=canvas.parentElement.clientWidth,h=dbTreeHeight(w);canvas.style.height=h+'px';const ctx=dbCanvasSize(canvas,w,h);dbDrawTree(ctx,dbSave,w,h,dbSelected);}
function dbDrawRoom(){if(!dbRound)return;const canvas=dbEl('roundCanvas'),w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;dbDrawRound(dbCanvasSize(canvas,w,h),dbRound,w,h);}
function dbResize(){if(dbScreen==='tree')dbDrawSkillTree();if(dbScreen==='round')dbDrawRoom();}
function dbUpdateHud(){
  dbText('roundTime',Math.max(0,Math.ceil(dbRound.timeLeft))+'s');dbText('roundDust',dbFmt(dbRound.earned));dbText('roundTotal',dbFmt(dbSave.dust+dbRound.earned));
  dbText('streakLabel',dbRound.streak?'Streak ×'+dbRound.multiplier.toFixed(1):'Drag to sweep');
}
function dbStartRound(){
  dbCloseModal(false);dbRoom=Math.min(dbRoom,dbSave.room);dbRound=dbNewRound(dbSave,dbRoom,Math.floor(Math.random()*4294967296));dbPaused=false;dbFinger.down=false;dbLastTime=0;dbLastTone=0;dbShowScreen('round');dbUpdateHud();
}
function dbRoundDone(){dbFinger.down=false;dbFinishRound(dbSave,dbRound);dbStoreSave(true);dbJingle();dbShowScreen('results');}
function dbFrame(now){
  if(dbScreen==='round'&&dbRound&&!dbPaused&&!document.hidden){
    const dt=dbLastTime?Math.min((now-dbLastTime)/1000,.05):0;dbLastTime=now;const earned=dbRound.earned;dbStep(dbRound,dt,dbFinger);
    if(dbRound.earned>earned&&now-dbLastTone>90){dbTone(400+Math.min(dbRound.streak,50)*7);dbLastTone=now;}
    dbUpdateHud();dbDrawRoom();if(dbRound.ended)dbRoundDone();
  }else dbLastTime=0;
  requestAnimationFrame(dbFrame);
}
function dbPointer(e){const canvas=dbEl('roundCanvas'),r=canvas.getBoundingClientRect(),v=dbRoomViewport(r.width,r.height);dbFinger.x=Math.max(0,Math.min(100,(e.clientX-r.left-v.x)/v.scale));dbFinger.y=Math.max(0,Math.min(160,(e.clientY-r.top-v.y)/v.scale));dbBroomInput(dbRound,dbFinger);}

function dbReset(){
  if(!dbResetArmed){dbResetArmed=true;dbText('resetButton','Confirm: erase all progress');dbToast('Tap again to start over');return;}
  dbSave=dbNewSave();dbRoom=0;dbRound=null;dbSelected=DB_NODES[0].id;dbFinger.down=false;dbStoreSave(true);dbCloseModal(false);dbShowScreen('title');dbToast('A fresh start');
}
function dbAction(action){
  if(!dbSave)return;dbAudio();
  if(action==='sweep')dbStartRound();
  else if(action==='tree'){dbCloseModal(false);dbShowScreen('tree');}
  else if(action==='home'){dbCloseModal(false);dbShowScreen('title');}
  else if(action==='buy')dbBuySelected();
  else if(action==='settings')dbShowSettings();
  else if(action==='pause')dbShowPause();
  else if(action==='close')dbCloseModal();
  else if(action==='welcome'){try{localStorage.setItem('dust-bunnies.t','1');}catch(e){}dbCloseModal();}
  else if(action==='sound'){dbSave.sound=!dbSave.sound;dbStoreSave(true);dbText('soundToggle',dbSave.sound?'On':'Off');if(dbSave.sound)dbTone(550);}
  else if(action==='backup')dbCopyBackup();
  else if(action==='load')dbLoadBackup();
  else if(action==='reset')dbReset();
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)dbAction(b.dataset.act);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!dbEl('modal').classList.contains('hidden')&&dbModalKind!=='welcome'){dbCloseModal();e.preventDefault();}
  if(e.key==='Tab'&&!dbEl('modal').classList.contains('hidden')){const all=dbEl('modal').querySelectorAll('button:not(.hidden):not(:disabled),textarea,select'),first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}
});
dbEl('roomChoice').addEventListener('change',e=>{dbRoom=+e.target.value;dbRoomNote();});
dbEl('nodeChoice').addEventListener('change',e=>{dbSelected=e.target.value;dbNodeDetails();dbDrawSkillTree();});
let dbTreeDown=null;
dbEl('treeCanvas').addEventListener('pointerdown',e=>{dbTreeDown={x:e.clientX,y:e.clientY};});
dbEl('treeCanvas').addEventListener('pointerup',e=>{if(!dbTreeDown||Math.hypot(e.clientX-dbTreeDown.x,e.clientY-dbTreeDown.y)>10){dbTreeDown=null;return;}dbTreeDown=null;const r=e.currentTarget.getBoundingClientRect(),id=dbTreeHit(e.clientX-r.left,e.clientY-r.top,r.width);if(id){dbSelected=id;dbNodeDetails();dbDrawSkillTree();}});
dbEl('treeCanvas').addEventListener('pointercancel',()=>{dbTreeDown=null;});
dbEl('roundCanvas').addEventListener('pointerdown',e=>{if(dbPaused||!dbRound)return;dbAudio();e.preventDefault();dbBroomInput(dbRound,{down:false});dbFinger.down=true;dbPointer(e);e.currentTarget.setPointerCapture(e.pointerId);});
dbEl('roundCanvas').addEventListener('pointermove',e=>{if(!dbFinger.down)return;const moves=e.getCoalescedEvents?e.getCoalescedEvents():[];for(const move of moves)dbPointer(move);dbPointer(e);});
for(const event of ['pointerup','pointercancel','lostpointercapture'])dbEl('roundCanvas').addEventListener(event,e=>{if(event==='pointerup'&&dbFinger.down)dbPointer(e);dbFinger.down=false;if(dbRound)dbBroomInput(dbRound,dbFinger);});
window.addEventListener('resize',dbResize);
window.addEventListener('pagehide',()=>{dbFinger.down=false;dbStoreSave(true);});
document.addEventListener('visibilitychange',()=>{dbFinger.down=false;dbLastTime=0;if(document.hidden){dbPaused=true;dbStoreSave(true);if(dbAudioContext)dbAudioContext.suspend().catch(()=>{});}else if(dbScreen==='round'&&dbRound&&!dbRound.ended&&dbEl('modal').classList.contains('hidden'))dbShowPause();});
(async()=>{
  dbSave=await dbLoadSave();dbRoom=dbSave.room;dbSelected=DB_NODES[0].id;dbShowScreen('title');dbStoreSave(true);
  let seen=false;try{seen=localStorage.getItem('dust-bunnies.t')==='1';}catch(e){}if(!seen&&!dbSave.rounds)dbShowWelcome();
  requestAnimationFrame(dbFrame);
})();

</script>
</body>
</html>
