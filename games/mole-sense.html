.run-counts{display:flex;gap:10px;margin-left:auto;margin-right:10px}.game-heading .eyebrow{letter-spacing:.7px;font-size:8px}.garden-count b{display:block;font-family:Georgia,serif;font-size:18px;font-weight:500}.burrow-option{display:block;text-align:left;width:100%;margin-top:8px;padding:11px 13px;background:#e8eddb;border:1px solid #cad6b8}.burrow-option strong,.burrow-option span{display:block}.burrow-option strong{font-size:14px}.burrow-option span{font-size:11px;font-weight:400;line-height:1.45;color:#607054;margin-top:3px}

37;margin:10px 0 15px}.daily-result{padding:12px;background:#e8eddb;border-radius:10px;font-size:12px;line-height:1.8;overflow-wrap:anywhere;margin:14px 0}.guide-row{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:12px;color:var(--muted)}.guide-row canvas{width:36px;height:36px;flex-shrink:0}.guide-row strong{display:block;color:var(--ink);font-size:13px}.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;background:#263e30;color:#fffbea;border:1px solid #60784f;border-radius:12px;padding:12px 18px;font-size:12px;max-width:90vw;box-shadow:0 6px 30px #15251e40;text-align:center}

<body>
  <main id="app">
    <section id="home" class="home" aria-label="Mole Sense home">
      <header class="home-heading"><span class="eyebrow">A little underground adventure</span><h1>Mole Sense</h1><p>Trust the numbers. Follow your nose.</p></header>
      <canvas id="portrait" width="320" height="154" aria-label="Your mole in the garden"></canvas>
      <div id="home-stats" class="home-stats"></div>
      <div class="section-title"><h2>Choose your mole</h2><span id="chosen-name"></span></div>
      <div id="moles" class="moles" role="group" aria-label="Choose your mole"></div>
      <p id="mole-description" class="mole-description"></p>
      <div class="home-actions"><button id="resume" class="primary" hidden>Continue run</button><button id="new-run" class="primary">New run</button><button id="daily" class="secondary">Play today's daily</button></div>
      <footer><button id="home-help" class="text-button">How to play</button><button id="home-settings" class="text-button">Settings</button></footer>
    </section>
    <section id="game" class="game" hidden aria-label="Garden">
      <header class="game-heading"><div><span class="eyebrow" id="run-type">Garden trail</span><strong id="garden-title">Garden 1 / 5</strong></div><div class="run-counts"><div class="garden-count"><b id="eaten">0</b><span id="eaten-label">critters eaten</span></div><div class="garden-count"><b id="pantry">0</b><span>pantry</span></div></div><button id="pause" class="icon-button" aria-label="Pause game">Ⅱ</button></header>
      <div class="vitals"><div class="level"><canvas id="little-mole" width="38" height="38" aria-hidden="true"></canvas><span>Level <b id="level">1</b></span></div><div class="bars"><div class="bar-line"><span id="hp-label">Health</span><span id="hp-value"></span></div><div class="bar health"><i id="hp-bar"></i></div><div class="bar-line xp-line"><span id="xp-label">Experience</span><span id="xp-value"></span></div><div class="bar experience"><i id="xp-bar"></i></div></div></div>
      <div id="board-wrap" class="board-wrap"><canvas id="board" tabindex="0" role="grid" aria-label="Garden grid. Tap a tile to dig. Long press to mark.">Tap a covered tile to dig. Long press to mark.</canvas></div>
      <div id="garden-note" class="garden-note" aria-live="polite">Eat to fill your pantry. Find the tunnel when you need to leave.</div>
      <div class="game-actions"><button id="mark" class="secondary" aria-pressed="false">Mark: off</button><button id="legend" class="secondary" aria-label="Critter guide">Guide</button></div>
    </section>
  </main>
  <div id="overlay" class="overlay" hidden><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>var MS_DATA = {
  version: 2,
  // TUNE: pantry prices, the increase per heal bought, and the clear score.
  pantryHealCost: 8,
  pantryHealRise: 4,
  pantryMaxHpCost: 32,
  pantryRerollCost: 10,
  gardenScore: 25,
  // TUNE: the bite, level healing, thresholds and five garden populations.
  biteDamage: 3,
  levelHeal: 2,
  xpThresholds: [4, 16, 40, 60, 80],
  gardens: [
    {width:9,height:12,counts:[14,8,3,1,0],berries:4},
    {width:9,height:12,counts:[9,7,7,7,6],berries:4},
    {width:9,height:12,counts:[8,7,7,8,7],berries:4},
    {width:9,height:12,counts:[7,7,8,8,8],berries:4},
    {width:9,height:12,counts:[7,7,8,9,9],berries:4}
  ],
  berryHeal: 3,
  cleanHeal: 4,
  cleanXp: 3,
  baseHp: 14,
  markLabels: ['', '1', '2', '3', '4', '5', '?'],
  critters: [null,
    {name:'Grub',emoji:'\uD83D\uDC1B',color:'#a8bc68'},
    {name:'Beetle',emoji:'\uD83E\uDEB2',color:'#4b8679'},
    {name:'Frog',emoji:'\uD83D\uDC38',color:'#64a755'},
    {name:'Rat',emoji:'\uD83D\uDC00',color:'#a991ae'},
    {name:'Snake',emoji:'\uD83D\uDC0D',color:'#d29e48'}
  ]
};

var MS_MOLES = [
  {id:'common',name:'Common mole',color:'#866653',description:'A curious gardener. 14 hp.',hp:14,startLevel:1,xpScale:1,offers:3,startPerks:[],unlock:{wins:0,reached:0}},
  {id:'burly',name:'Burly',color:'#626e7c',description:'18 hp, but needs 30% more xp to level up.',hp:18,startLevel:1,xpScale:1.3,offers:3,startPerks:[],unlock:{wins:0,reached:2}},
  {id:'star',name:'Star-nose',color:'#bc7d70',description:'Starts with sniff: one grub is shown per garden.',hp:14,startLevel:1,xpScale:1,offers:3,startPerks:['sniff'],unlock:{wins:0,reached:3}},
  {id:'sleepy',name:'Sleepy',color:'#8e89b1',description:'Starts at level 2; picks from two perks.',hp:14,startLevel:2,xpScale:1,offers:2,startPerks:[],unlock:{wins:1,reached:0}},
  {id:'velvet',name:'Velvet',color:'#ad6b92',description:'A berry lover. Starts with second stomach.',hp:14,startLevel:1,xpScale:1,offers:3,startPerks:['second-stomach'],unlock:{wins:2,reached:0}}
];

var MS_PERKS = [
  {id:'thick-fur',name:'Thick fur',description:'Gain 4 max hp and heal 4 hp.'},
  {id:'sniff',name:'Sniff',description:'Each garden starts with one grub shown.'},
  {id:'lamp-root',name:'Lamp root',description:'Your first dig opens a 5 by 5 patch.'},
  {id:'second-stomach',name:'Second stomach',description:'Berries heal twice as much.'},
  {id:'tunnel-sense',name:'Tunnel sense',description:'See which row holds the exit tunnel.'},
  {id:'steady-paws',name:'Steady paws',description:'The first bite each garden does no damage.'},
  {id:'hearty-roots',name:'Hearty roots',description:'Gain 2 max hp. Berries heal 1 more hp.'},
  {id:'quick-study',name:'Quick study',description:'Need 20% less xp for each level.'},
  {id:'soft-soil',name:'Soft soil',description:'Two extra soil tiles open each garden.'},
  {id:'grub-feast',name:'Grub feast',description:'Every grub gives 1 extra xp.'},
  {id:'beetle-feast',name:'Beetle feast',description:'Every beetle gives 1 extra xp.'},
  {id:'field-kit',name:'Field kit',description:'Heal 6 hp now and gain 1 max hp.'},
  {id:'deep-breath',name:'Deep breath',description:'Heal 3 hp when entering a garden.'},
  {id:'dew-drop',name:'Dew drop',description:'Level-ups heal 1 extra hp.'},
  {id:'careful-bite',name:'Careful bite',description:'Every bite deals 1 less damage.'}
];

// Rules and save format: deliberately usable by plain Node as well as the UI.
function msMole(id) { return MS_MOLES.find(function(m) { return m.id === id; }) || MS_MOLES[0]; }
function msHas(run, id) { return run.perks.indexOf(id) !== -1; }
function msRandom(run) {
  var n = run.rngState += 0x6D2B79F5;
  n = Math.imul(n ^ n >>> 15, n | 1);
  n ^= n + Math.imul(n ^ n >>> 7, n | 61);
  run.rngState >>>= 0;
  return ((n ^ n >>> 14) >>> 0) / 4294967296;
}
function msShuffle(run, list) {
  for (var i = list.length - 1; i > 0; i--) {
    var j = Math.floor(msRandom(run) * (i + 1)), t = list[i]; list[i] = list[j]; list[j] = t;
  }
  return list;
}
function msNeighbours(g, index) {
  var list = [], x = index % g.width, y = Math.floor(index / g.width);
  for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
    if ((dx || dy) && x + dx >= 0 && x + dx < g.width && y + dy >= 0 && y + dy < g.height) list.push((y + dy) * g.width + x + dx);
  }
  return list;
}
function msClues(g) {
  g.tiles.forEach(function(t, i) {
    t.n = msNeighbours(g, i).reduce(function(sum, j) { var c = g.tiles[j]; return sum + (c.kind === 'critter' ? c.level : 0); }, 0);
  });
}
function msShowSniff(run) {
  if (!msHas(run, 'sniff')) return;
  var candidates = [];
  run.garden.tiles.forEach(function(t, i) { if (t.kind === 'critter' && t.level === 1) candidates.push(i); });
  if (candidates.length) run.garden.tiles[candidates[Math.floor(msRandom(run) * candidates.length)]].shown = true;
}
function msMakeGarden(run) {
  var spec = MS_DATA.gardens[run.gardenIndex], tiles = [], order = [], i, l;
  for (i = 0; i < spec.width * spec.height; i++) { tiles.push({kind:'soil',level:0,n:0,open:false,mark:0,shown:false}); order.push(i); }
  msShuffle(run, order);
  var g = {width:spec.width,height:spec.height,tiles:tiles,firstDig:false,eaten:0,cleared:0,totalCritters:0,exit:-1,exitRow:null,firstBite:false};
  for (l = 1; l <= 5; l++) for (i = 0; i < spec.counts[l - 1]; i++) {
    var t = tiles[order.pop()]; t.kind = 'critter'; t.level = l; g.totalCritters++;
  }
  for (i = 0; i < spec.berries; i++) tiles[order.pop()].kind = 'berry';
  g.exit = order.pop(); tiles[g.exit].kind = 'exit';
  run.garden = g;
  msClues(g); msShowSniff(run);
  if (msHas(run, 'tunnel-sense')) g.exitRow = Math.floor(g.exit / g.width);
  return g;
}
function msNewRun(moleId, seed, dailyDate) {
  var mole = msMole(moleId), s = Number(seed) >>> 0;
  var run = {version:MS_DATA.version,moleId:mole.id,seed:s,rngState:s,dailyDate:dailyDate || null,gardenIndex:0,level:mole.startLevel,xp:0,hp:mole.hp,maxHp:mole.hp,pantry:0,pantryEarned:0,healBuys:0,perkRerolls:0,perkPicks:0,perks:mole.startPerks.slice(),status:'playing',garden:null,totals:{critters:0,tiles:0,clean:0},completed:[],pendingPerks:[],lastEvent:null,resultRecorded:false};
  msMakeGarden(run); return run;
}
function msXpNeeded(run) {
  var base = MS_DATA.xpThresholds[Math.min(run.level - 1, MS_DATA.xpThresholds.length - 1)];
  return Math.max(1, Math.ceil(base * msMole(run.moleId).xpScale * (msHas(run, 'quick-study') ? 0.8 : 1)));
}
function msGainXp(run, amount) {
  var levels = 0; run.xp += amount;
  while (run.xp >= msXpNeeded(run)) {
    run.xp -= msXpNeeded(run); run.level++; levels++;
    run.hp = Math.min(run.maxHp, run.hp + MS_DATA.levelHeal + (msHas(run, 'dew-drop') ? 1 : 0));
  }
  return levels;
}
function msSafePatch(run, index) {
  var g = run.garden, side = msHas(run, 'lamp-root') ? 5 : 3;
  var x = Math.max(0, Math.min(g.width - side, index % g.width - Math.floor(side / 2)));
  var y = Math.max(0, Math.min(g.height - side, Math.floor(index / g.width) - Math.floor(side / 2)));
  var safe = [], outside = [], moving = [], i;
  for (var yy = y; yy < y + side; yy++) for (var xx = x; xx < x + side; xx++) safe.push(yy * g.width + xx);
  for (i = 0; i < g.tiles.length; i++) if (safe.indexOf(i) === -1 && g.tiles[i].kind === 'soil') outside.push(i);
  msShuffle(run, outside);
  safe.forEach(function(j) {
    var t = g.tiles[j];
    if (t.kind !== 'soil') { moving.push(t); g.tiles[j] = {kind:'soil',level:0,n:0,open:false,mark:t.mark,shown:false}; }
  });
  moving.forEach(function(t) {
    var dest = outside.pop(), mark = g.tiles[dest].mark; t.mark = mark; g.tiles[dest] = t;
    if (t.kind === 'exit') g.exit = dest;
  });
  if (msHas(run, 'tunnel-sense')) g.exitRow = Math.floor(g.exit / g.width);
  msClues(g); return safe;
}
function msOpenSoil(run, indices, opened) {
  var g = run.garden, queue = indices.slice();
  for (var q = 0; q < queue.length; q++) {
    var i = queue[q], t = g.tiles[i];
    if (t.open || t.kind === 'critter') continue;
    t.open = true; t.mark = 0; g.cleared++; opened.push(i);
    if (t.kind === 'berry') run.hp = Math.min(run.maxHp, run.hp + msBerryHeal(run));
    if (t.kind === 'soil' && !t.n) msNeighbours(g, i).forEach(function(j) { if (!g.tiles[j].open) queue.push(j); });
  }
}
function msBerryHeal(run) {
  return (MS_DATA.berryHeal + (msHas(run, 'hearty-roots') ? 1 : 0)) * (msHas(run, 'second-stomach') ? 2 : 1);
}
function msMark(run, index) {
  var t = run.garden && run.garden.tiles[index];
  if (run.status !== 'playing' || !t || t.open) return false;
  t.mark = (t.mark + 1) % 7; return true;
}
function msDig(run, index) {
  var g = run.garden, t = g && g.tiles[index];
  if (run.status !== 'playing' || !t) return null;
  if (t.open) { if (t.kind === 'exit') return msLeave(run); return null; }
  var event = {type:'soil',damage:0,eaten:0,levels:0,opened:[]};
  if (!g.firstDig) {
    var patch = msSafePatch(run, index); g.firstDig = true;

const SAVE_KEY='mole-sense.save.v1',TUTORIAL_KEY='mole-sense.t';

function msEsc(value){return String(value===undefined?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msPlural(count,word){return word+(count===1?'':'s');}

function parseSave(str){try{const o=typeof str==='string'?JSON.parse(str):str;return o&&typeof o==='object'&&!Array.isArray(o)?o:null;}catch(e){return null;}}
function idbOpen(){
  return new Promise(resolve=>{
    let done=false;const finish=()=>{if(!done){done=true;resolve();}};
    try{
      const request=indexedDB.open('mole-sense',1);
      request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('kv'))request.result.createObjectStore('kv');};
      request.onsuccess=()=>{if(done){request.result.close();return;}idb=request.result;finish();};
      request.onerror=finish;request.onblocked=finish;
    }catch(e){finish();}
    setTimeout(finish,1500);
  });
}
function idbGet(){
  return new Promise(resolve=>{
    if(!idb)return resolve(null);
    let done=false;const finish=value=>{if(!done){done=true;resolve(value);}};
    try{const request=idb.transaction('kv').objectStore('kv').get('save');request.onsuccess=()=>finish(request.result||null);request.onerror=()=>finish(null);}catch(e){finish(null);}
    setTimeout(()=>finish(null),1500);
  });
}
async function loadSave(){
  let a=null,b=null;
  try{a=parseSave(localStorage.getItem(SAVE_KEY));}catch(e){lsOK=false;}
  await idbOpen();b=parseSave(await idbGet());
  try{a=a?migrate(a):null;}catch(e){a=null;}
  try{b=b?migrate(b):null;}catch(e){b=null;}
  const picked=a&&b?((+b.updatedAt||0)>(+a.updatedAt||0)?b:a):(a||b);
  storageOK=lsOK||!!idb;return picked;
}
function writeSave(){
  if(!SV)return;
  clearTimeout(saveT);saveT=null;SV.updatedAt=Math.max(Date.now(),(+SV.updatedAt||0)+1);
  const str=JSON.stringify(SV);
  try{localStorage.setItem(SAVE_KEY,str);lsOK=true;}catch(e){lsOK=false;}
  if(idb){try{const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(str,'save');tx.onerror=()=>{if(!lsOK){storageOK=false;msToast('Saving is unavailable. Copy a backup in Settings.');}};}catch(e){}}
  storageOK=lsOK||!!idb;
}
function save(now){if(now){writeSave();return;}if(!saveT)saveT=setTimeout(writeSave,150);}
function exportCode(){return msEncodeBackup(SV);}
function importCode(code){

}
function msSound(kind){
  if(!SV||!SV.settings.sound)return;

    if(!msAudio){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;msAudio=new Audio();}
    if(msAudio.state==='suspended')msAudio.resume();

    const t=msAudio.currentTime,o=msAudio.createOscillator(),g=msAudio.createGain();
    const f=kind==='hurt'?145:kind==='level'?640:kind==='mark'?330:kind==='berry'?490:kind==='exit'?780:235;
    o.type=kind==='hurt'?'triangle':'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(kind==='hurt'?75:f*1.4,t+.1);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.14);
    o.connect(g);g.connect(msAudio.destination);o.start(t);o.stop(t+.16);
  }catch(e){}
}

}
function msGuide(){
  msSheetOpen('guide','<span class="eyebrow">Know your neighbours</span><h2 id="sheet-title">The garden guide</h2><p>Clues add up critter levels, including critters already eaten. A grub and a frog beside a tile add up to 4. Each critter adds its level to your pantry.</p>'+MS_CRITTER_NAMES.slice(1).map((name,i)=>'<div class="guide-row"><canvas data-critter="'+(i+1)+'" aria-hidden="true"></canvas><div><strong>'+name+' · level '+(i+1)+'</strong>Safe at mole level '+(i+1)+' or higher.</div></div>').join('')+'<p style="margin-top:16px">Blue berries heal you. Tap an open tunnel to leave for perks and your burrow. Eating every critter earns two perk picks.</p><button id="guide-close" class="primary wide">Back to digging</button>');
  $('sheet').querySelectorAll('[data-critter]').forEach(c=>{const g=msCanvasSize(c,36,36);msCritterArt(g,+c.dataset.critter,18,18,28);});msBind('guide-close',msGuideClose);
}
function msGuideClose(){msSheetClose();if(msPaused)msPause();}
async function msCopy(text,success){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);msToast(success);return true;}}catch(e){}
  const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.left='-9999px';document.body.appendChild(area);area.select();let copied=false;
  try{copied=document.execCommand('copy');}catch(e){}area.remove();
  if(copied){msToast(success);return true;}
  if($('backup-code')){$('backup-code').value=text;$('backup-code').focus();$('backup-code').select();msToast('Select and copy the code below.');}
  else{msSheetOpen('copy','<h2 id="sheet-title">Copy your result</h2><p>Select the text below and copy it.</p><textarea id="copy-text" readonly></textarea><button id="copy-close" class="primary wide">Done</button>');$('copy-text').value=text;$('copy-text').focus();$('copy-text').select();msBind('copy-close',()=>{msSheetClose();msStateSheet();});}
  return false;
}
function msSettings(){
  msSheetClose();msSheetOpen('settings','<span class="eyebrow">Make yourself at home</span><h2 id="sheet-title">Settings</h2><div class="setting-row"><span>Garden sounds</span><button id="sound-toggle" class="secondary" aria-pressed="'+SV.settings.sound+'">'+(SV.settings.sound?'On':'Off')+'</button></div><div class="rule"></div><p>Your progress stays on this device. Copy a backup to keep it somewhere safe.</p><button id="copy-backup" class="secondary wide">Copy backup code</button><label for="backup-code">Paste a backup code to restore</label><textarea id="backup-code" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Your Mole Sense backup code"></textarea><button id="load-backup" class="secondary wide">Load backup code</button><div class="rule"></div><button id="reset" class="danger wide">Start over</button><button id="settings-close" class="primary wide">Done</button>'+(storageOK?'':'<p style="margin-top:12px">Saving is unavailable. Please copy a backup before closing.</p>'));
  msBind('sound-toggle',()=>{SV.settings.sound=!SV.settings.sound;$('sound-toggle').textContent=SV.settings.sound?'On':'Off';$('sound-toggle').setAttribute('aria-pressed',String(SV.settings.sound));writeSave();if(SV.settings.sound)msSound('berry');});
  msBind('copy-backup',()=>{writeSave();msCopy(exportCode(),'Backup code copied.');});
  msBind('load-backup',()=>{
    const code=$('backup-code').value.trim();if(!code){msToast('Paste a backup code first.');return;}
    try{if(!msDecodeBackup(code))throw Error();}catch(e){msToast('That backup code could not be read.');return;}
    msSheetOpen('restore','<h2 id="sheet-title">Restore this backup?</h2><p>This replaces the progress on this device with your backup.</p><button id="confirm-restore" class="primary wide">Restore backup</button><button id="cancel-restore" class="secondary wide">Keep current progress</button>');
    msBind('confirm-restore',()=>{if(importCode(code)){msMarkMode=false;msHome();msToast('Backup restored.');}else{msSettings();msToast('That backup code could not be read.');}});msBind('cancel-restore',msSettings);
  });
  msBind('reset',()=>{
    msSheetOpen('reset','<h2 id="sheet-title">Start from fresh soil?</h2><p>This removes your run, records and unlocked moles from this device. Copy a backup first if you want to keep them.</p><button id="confirm-reset" class="danger wide">Erase my progress</button><button id="cancel-reset" class="primary wide">Keep my progress</button>');
    msBind('confirm-reset',()=>{SV=msNewSave();msMarkMode=false;writeSave();msHome();msToast('A fresh garden is ready.');});msBind('cancel-reset',msSettings);
  });msBind('settings-close',msReturn);
}
function msPointerIndex(event){
  const box=$('board').getBoundingClientRect(),r=SV.run;if(!r)return -1;
  const x=(event.clientX-box.left)*MS_VIEW.width/box.width,y=(event.clientY-box.top)*MS_VIEW.height/box.height;
  return x<0||y<0||x>=MS_VIEW.width||y>=MS_VIEW.height?-1:Math.floor(y/MS_VIEW.cell)*r.garden.width+Math.floor(x/MS_VIEW.cell);
}
function msCancelPress(){clearTimeout(msPressTimer);msPressTimer=null;msPress=null;}
function msControls(){
  msBind('new-run',()=>msStart(false));msBind('daily',()=>msStart(true));msBind('resume',()=>msGame());
  msBind('home-settings',msSettings);msBind('home-help',()=>msHelp(false));msBind('pause',msPause);msBind('legend',msGuide);
  msBind('mark',()=>{msMarkMode=!msMarkMode;msSound('mark');msRefresh();$('garden-note').textContent=msMarkMode?'Tap to cycle 1–5, ?, then clear. Turn Mark off to dig.':'Tap to dig. Long press to add a mark.';});
  document.addEventListener('pointerdown',()=>msSound('unlock'),{capture:true,passive:true});
  const canvas=$('board');
  canvas.addEventListener('contextmenu',event=>event.preventDefault());
  canvas.addEventListener('pointerdown',event=>{
    if(event.button!==0&&event.button!==2)return;event.preventDefault();msCancelPress();
    const index=msPointerIndex(event);if(index<0)return;canvas.setPointerCapture(event.pointerId);
    msPress={index,x:event.clientX,y:event.clientY,id:event.pointerId,held:false};
    if(event.button===2){msPress.held=true;msTileAction(index,true);return;}
    msPressTimer=setTimeout(()=>{if(msPress){msPress.held=true;msTileAction(msPress.index,true);}},420);
  });
  canvas.addEventListener('pointermove',event=>{if(msPress&&(Math.abs(event.clientX-msPress.x)>12||Math.abs(event.clientY-msPress.y)>12))msCancelPress();});
  canvas.addEventListener('pointerup',event=>{if(!msPress||event.pointerId!==msPress.id)return;const press=msPress;msCancelPress();if(!press.held&&msPointerIndex(event)===press.index)msTileAction(press.index,msMarkMode);});
  canvas.addEventListener('pointercancel',msCancelPress);canvas.addEventListener('lostpointercapture',msCancelPress);
  canvas.addEventListener('keydown',event=>{
    const r=SV.run;if(!r||msSheet)return;const max=r.garden.tiles.length-1,w=r.garden.width;
    let i=Math.max(0,MS_VIEW.focus);
    if(event.key==='ArrowLeft')i=Math.max(0,i-1);else if(event.key==='ArrowRight')i=Math.min(max,i+1);else if(event.key==='ArrowUp')i=Math.max(0,i-w);else if(event.key==='ArrowDown')i=Math.min(max,i+w);else if(event.key==='Enter'||event.key===' '){event.preventDefault();msTileAction(i,msMarkMode);return;}else if(event.key.toLowerCase()==='m'){event.preventDefault();msTileAction(i,true);return;}else return;
    event.preventDefault();MS_VIEW.focus=i;msRefresh();canvas.setAttribute('aria-label','Garden grid, row '+(Math.floor(i/w)+1)+', column '+(i%w+1)+'. Enter to dig, M to mark.');
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){if(msSheet==='pause'){msPaused=false;msSheetClose();}else if(msSheet==='guide')msGuideClose();else if(msSheet==='settings'||msSheet==='help')msReturn();else if(!msSheet&&msScreen==='game')msPause();}
    if(event.key==='Tab'&&msSheet){const nodes=$('sheet').querySelectorAll('button:not(:disabled),textarea'),first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden){msCancelPress();writeSave();if(msScreen==='game'&&SV.run&&SV.run.status==='playing'){msPaused=true;if(!msSheet)msPause();}if(msAudio&&msAudio.state==='running')msAudio.suspend().catch(()=>{});}});
  window.addEventListener('pagehide',()=>writeSave());
  window.addEventListener('resize',()=>{if(msScreen==='game')msRefresh();else msDrawPortrait($('portrait'),SV.selectedMole,false);});
}
async function boot(){
  SV=await loadSave()||msNewSave();msControls();msHome();
  let seen=false;try{seen=localStorage.getItem(TUTORIAL_KEY)==='1';}catch(e){}
  if(!seen)msHelp(true);
  if(!storageOK)msToast('Saving is unavailable. Copy a backup in Settings.');
}
boot();

</script>
</body>
</html>
