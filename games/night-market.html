/* Night Market rules. This file has no DOM and runs under plain Node. */
const NM_ITEMS={}, NM_SHAPES={}, NM_NEIGHBOURS={};
NM.items.forEach(function(item){ NM_ITEMS[item.id]=item; });
NM.shapes.forEach(function(shape){
  NM_SHAPES[shape.id]=shape;
  NM_NEIGHBOURS[shape.id]=shape.cells.map(function(cell){
    const near=[];
    shape.cells.forEach(function(other,i){ if (other!==cell && Math.abs(other.x-cell.x)<=1 && Math.abs(other.y-cell.y)<=1) near.push(i); });
    return near;
  });
});
function itemById(id){ return NM_ITEMS[id]||null; }
function shapeById(id){ return NM_SHAPES[id]||null; }
function nmInt(value,min,max,fallback){ return Number.isSafeInteger(value) && value>=min && value<=max ? value : fallback; }
function nmNumber(value,min,max,fallback){ return Number.isFinite(value) && value>=min && value<=max ? value : fallback; }
function random(run){
  run.rng=(run.rng+0x6D2B79F5)>>>0;
  let n=run.rng;
  n=Math.imul(n^(n>>>15),n|1);
  n^=n+Math.imul(n^(n>>>7),n|61);
  return ((n^(n>>>14))>>>0)/4294967296;
}
function newSave(){
  return {game:'night-market',v:NM.version,rev:0,stars:0,totalStars:0,runs:0,wins:0,sound:true,fast:false,
    unlocked:NM.startFamilies.slice(),shapes:['table'],ladderUnlocked:0,active:null};
}
function nmCrateItem(run,id){
  const item={uid:run.nextUid++,id:id,placed:0,earned:0};
  run.crate.push(item);
  return item;
}
function newRun(save,seed,shapeId,ladder){
  const shape=shapeById(shapeId) && save.shapes.indexOf(shapeId)>=0 ? shapeId : 'table';
  const initial=(Number.isFinite(seed)?Math.floor(seed):Date.now())>>>0;
  const run={seed:initial,rng:initial,shape:shape,ladder:Math.max(0,Math.min(10,save.ladderUnlocked,Math.floor(ladder)||0)),
    families:save.unlocked.slice(),night:0,feePaid:0,coins:0,crate:[],nextUid:1,rerolls:1,removes:1,
    phase:'ready',offers:[],board:shapeById(shape).cells.map(function(){ return null; }),result:null,won:false,settled:false};
  NM.startItems.forEach(function(id){ nmCrateItem(run,id); });
  save.active=run;
  return run;
}
function nmShuffle(run,list){
  for (let i=list.length-1;i>0;i--){ const j=Math.floor(random(run)*(i+1)), old=list[i]; list[i]=list[j]; list[j]=old; }
  return list;
}
function nmOfferWeights(night){
  const odds=NM.offerWeights;
  let a=odds[0], b=a;
  for (let i=1;i<odds.length;i++){
    b=odds[i];
    if (night<=b.night) break;
    a=b;
  }
  const t=a===b ? 0 : Math.max(0,Math.min(1,(night-a.night)/(b.night-a.night)));
  return a.weights.map(function(value,i){ return value+(b.weights[i]-value)*t; });
}
function nmOffers(run){
  const rarities=['common','uncommon','rare','very rare'], weights=nmOfferWeights(run.night), pools=rarities.map(function(){ return []; });
  NM.items.forEach(function(item){
    if (item.family==='food' || item.family==='light' || run.families.indexOf(item.family)>=0) pools[rarities.indexOf(item.rarity)].push(item.id);
  });
  const offers=[];
  for (let n=0;n<3;n++){
    const available=pools.map(function(pool,i){ return pool.some(function(id){ return offers.indexOf(id)<0; }) ? weights[i] : 0; });

    const cells=G.result.cells,n=cells.length; let coins=0;
    for(let i=0;i<n;i++) coins+=cells[i].coins*Math.max(0,Math.min(1,(anim.elapsed-i*anim.duration*.65/Math.max(1,n))/(anim.duration*.35)));
    const counter=document.getElementById('coinValue'); if(counter) counter.textContent=Math.floor(anim.base+coins);
    drawMarket();
    if(anim.elapsed>=anim.duration){ anim=null; V.last=0; renderUI(); tone(660,.06,.035); }
    else requestMarketFrame();
  } else { V.last=0; drawMarket(); }
}

/* Screens, sound and the two independent copies of a save. */
const SAVE_KEY='night-market.save.v1', TUTORIAL_KEY='night-market.t';
let SV=null,G=null,idb=null,saveRev=0,saveT=null,lsOK=true,storageOK=true;
let paused=false,anim=null,removeMode=false,chosenShape='table',chosenLadder=0,modalKind='',toastT=null,lastFocus=null;
let audio=null,soundReady=false;
const $=id=>document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseSave(raw){ try{ return raw?migrate(typeof raw==='string'?JSON.parse(raw):raw):null; }catch(e){ return null; } }
function writeSave(){
  clearTimeout(saveT); saveT=null; if(!SV) return;
  saveRev=Math.max(saveRev,SV.rev||0)+1; SV.rev=saveRev;
  const str=JSON.stringify(SV);
  try{ localStorage.setItem(SAVE_KEY,str); lsOK=true; }catch(e){ lsOK=false; }
  let dbWriteOK=false;
  if(idb){
    try{ const tx=idb.transaction('kv','readwrite'); tx.objectStore('kv').put(str,'save'); dbWriteOK=true; tx.onerror=tx.onabort=()=>{ storageOK=lsOK; }; }
    catch(e){ dbWriteOK=false; }
  }
  storageOK=lsOK||dbWriteOK;
}
function save(now){ if(!SV) return; if(now) writeSave(); else if(!saveT) saveT=setTimeout(writeSave,300); }
function idbOpen(){
  return new Promise(resolve=>{
    let done=false; const finish=()=>{ if(!done){ done=true; resolve(); } };
    try{
      const rq=indexedDB.open('night-market',1);
      rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore('kv'); }catch(e){} };
      rq.onsuccess=()=>{ if(done){ try{ rq.result.close(); }catch(e){} return; } idb=rq.result; finish(); };
      rq.onerror=finish; rq.onblocked=finish;
    }catch(e){ finish(); }
    setTimeout(finish,1200);
  });
}
function idbGet(){
  return new Promise(resolve=>{
    if(!idb) return resolve(null);
    let done=false; const finish=v=>{ if(!done){ done=true; resolve(v); } };
    try{ const rq=idb.transaction('kv').objectStore('kv').get('save'); rq.onsuccess=()=>finish(rq.result||null); rq.onerror=()=>finish(null); }catch(e){ finish(null); }
    setTimeout(()=>finish(null),1200);
  });
}
async function loadSave(){
  let a=null;
  try{ a=parseSave(localStorage.getItem(SAVE_KEY)); }catch(e){ lsOK=false; }
  await idbOpen(); const b=parseSave(await idbGet());
  saveRev=Math.max(a&&a.rev||0,b&&b.rev||0);
  storageOK=lsOK||!!idb;
  return a&&b?((b.rev||0)>(a.rev||0)?b:a):(a||b);
}
function exportCode(){ return 'NM1:'+btoa(unescape(encodeURIComponent(JSON.stringify(SV)))); }
function importCode(code){
  try{
    let compact=String(code).replace(/\s+/g,'');
    if(compact.slice(0,4)==='NM1:') compact=compact.slice(4);
    else if(compact.indexOf(':')>=0) return false;
    const next=parseSave(decodeURIComponent(escape(atob(compact))));
    if(!next) return false;
    SV=next; G=SV.active; anim=null; removeMode=false; save(true); return true;
  }catch(e){ return false; }
}
function startSound(){
  if(soundReady) return;
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC){ audio=new AC(); audio.resume(); soundReady=true; } }catch(e){}
}
function tone(hz,duration,volume){
  if(!audio||!SV||!SV.sound||paused) return;
  try{ const o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime; o.type='sine'; o.frequency.setValueAtTime(hz,t); v.gain.setValueAtTime(volume||.025,t); v.gain.exponentialRampToValueAtTime(.001,t+(duration||.06)); o.connect(v); v.connect(audio.destination); o.start(t); o.stop(t+(duration||.06)); }catch(e){}
}
function toast(message){
  $('toast').textContent=message; $('toast').hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{ $('toast').hidden=true; },2800);
}
function showSheet(kind,html){
  if($('overlay').hidden) lastFocus=document.activeElement;
  modalKind=kind; $('sheet').innerHTML=html; $('overlay').hidden=false; paintIcons(); $('sheet').focus();
}
function closeSheet(){
  $('overlay').hidden=true; modalKind='';
  if(lastFocus&&lastFocus.isConnected) lastFocus.focus();
}
function welcome(){
  showSheet('welcome','<p class="welcome-kicker">The market is waking up</p><h2 id="sheetTitle">Set up your little stall</h2><ul><li>Your crate lands randomly on the table each night.</li><li>Items earn coins, helped by their eight neighbours.</li><li>Choose one new item after each night, or skip it.</li><li>Pay a fee every five nights. Pay all eight to win.</li><li>Use tokens to change offers or remove items. Earn stars for new market finds.</li></ul><button class="primary wide" data-act="welcome">Let\'s go</button>');
}
function settings(){
  showSheet('settings','<h2 id="sheetTitle">Settings</h2><div class="settings-row"><p>Little market sounds</p><button data-act="sound" aria-pressed="'+SV.sound+'">Sound: '+(SV.sound?'on':'off')+'</button></div><div class="settings-row"><p>Quicker coin counting</p><button data-act="sheetFast" aria-pressed="'+SV.fast+'">Fast: '+(SV.fast?'on':'off')+'</button></div>'+(storageOK?'':'<p class="warn">This browser cannot keep a save here. Copy a backup code before closing.</p>')+'<h3>Keep your progress</h3><button class="wide" data-act="copy">Copy backup code</button><textarea id="loadCode" aria-label="Backup code" placeholder="Paste a backup code here" spellcheck="false"></textarea><button class="wide" data-act="import">Load backup code</button><h3>A fresh beginning</h3><button class="danger wide" data-act="reset">Start over</button><div class="sheet-buttons"><button data-act="close">Back to the market</button></div>');
}
function unlockSheet(){
  let rows='';
  for(let i=0;i<NM.families.length;i++){
    const f=NM.families[i],owned=SV.unlocked.indexOf(f.id)>=0;
    rows+='<div class="unlock-row"><div><strong>'+esc(f.name)+'</strong><small>More '+esc(f.id)+' items in future seasons</small></div><button data-act="unlock" data-key="'+f.id+'" '+(owned||SV.stars<f.cost?'disabled':'')+'>'+(owned?'Open':f.cost+' stars')+'</button></div>';
  }
  for(let i=1;i<NM.shapes.length;i++){
    const s=NM.shapes[i],owned=SV.shapes.indexOf(s.id)>=0;
    rows+='<div class="unlock-row"><div><strong>'+esc(s.name)+'</strong><small>'+s.cells.length+' places at the stall</small></div><button data-act="unlock" data-key="'+s.id+'" '+(owned||SV.stars<s.cost?'disabled':'')+'>'+(owned?'Open':s.cost+' stars')+'</button></div>';
  }
  rows+='<div class="unlock-row"><div><strong>Fee ladder '+SV.ladderUnlocked+' / 10</strong><small>'+(SV.wins?'Each step: fees +'+Math.round(NM.ladderFeeStep*100)+'%, stars +'+Math.round(NM.ladderStarStep*100)+'%':'Win a season to open the ladder')+'</small></div><button data-act="unlock" data-key="ladder" '+(!SV.wins||SV.ladderUnlocked>=10||SV.stars<NM.ladderCost?'disabled':'')+'>'+(SV.ladderUnlocked>=10?'Complete':NM.ladderCost+' stars')+'</button></div>';
  showSheet('unlocks','<h2 id="sheetTitle">Make room for more</h2><p>You have <strong>'+SV.stars+' stars</strong>. Unlocks add choices for your next season.</p>'+rows+'<div class="sheet-buttons"><button data-act="close">Back to the market</button></div>');
}
function itemSheet(id){
  const item=itemById(id); if(!item) return;
  const entry=G&&G.crate.find(c=>c.id===id),canRemove=removeMode&&G&&G.phase==='offer'&&G.removes>0&&entry;
  showSheet('item','<h2 id="sheetTitle">'+esc(item.name)+'</h2><div class="item-detail">'+iconHTML(id)+'<p>'+esc(describeItem(id))+'</p></div>'+(canRemove?'<p class="subline">Use one remove token on this item?</p><button class="danger wide" data-act="remove" data-uid="'+entry.uid+'">Remove one '+esc(item.name.toLowerCase())+'</button>':'')+'<div class="sheet-buttons"><button data-act="close">Back to the market</button></div>');
}
function offerSheet(index){
  if(!G||G.phase!=='offer'||anim) return;
  const item=itemById(G.offers[index]); if(!item) return;
  showSheet('offer','<p class="welcome-kicker">'+esc(item.rarity)+' find</p><h2 id="sheetTitle">'+esc(item.name)+'</h2><div class="item-detail">'+iconHTML(item.id)+'<p>'+esc(describeItem(item.id))+'</p></div><div class="sheet-buttons"><button data-act="close">Keep looking</button><button class="primary" data-act="choose" data-index="'+index+'">Add to crate</button></div>');
}
function cratePuff(id){
  const tile=$('crate').querySelector('[data-id="'+id+'"]'); if(!tile) return;
  const r=tile.getBoundingClientRect(),p=document.createElement('div'); p.className='crate-puff'; p.setAttribute('aria-hidden','true');
  p.style.left=(r.left+r.width/2)+'px'; p.style.top=(r.top+r.height/2)+'px';
  for(let i=0;i<5;i++){ const dot=document.createElement('i'),a=i*Math.PI*2/5; dot.style.setProperty('--px',Math.cos(a)*24+'px'); dot.style.setProperty('--py',Math.sin(a)*20+'px'); p.appendChild(dot); }
  document.body.appendChild(p); setTimeout(()=>p.remove(),650);
}
function statsHTML(){
  if(!G) return '<div class="stat"><span>Your stars</span><strong>'+SV.stars+'</strong></div><div class="stat"><span>Seasons won</span><strong>'+SV.wins+'</strong></div><div class="stat"><span>A new season</span><strong>40 <small>nights</small></strong></div>';
  const night=Math.min(40,G.night+(G.phase==='ready'?1:0)),fee=G.feePaid<8?feeAmount(G):0;
  return '<div class="stat"><span>Coins</span><strong><i class="coin-mark">●</i> <b id="coinValue">'+(anim?anim.base:G.coins)+'</b></strong></div><div class="stat"><span>Night</span><strong>'+Math.max(1,night)+' <small>/ 40</small></strong></div><div class="stat"><span>'+(G.feePaid>=8?'All fees paid':'Next fee · '+Math.min(8,G.feePaid+1)+'/8')+'</span><strong>'+(G.feePaid>=8?'Season won':fee+' <small>coins</small>')+'</strong></div>';
}
function setupHTML(){
  let tables='',ladders='';
  for(let i=0;i<NM.shapes.length;i++){ const s=NM.shapes[i]; if(SV.shapes.indexOf(s.id)>=0) tables+='<option value="'+s.id+'" '+(chosenShape===s.id?'selected':'')+'>'+esc(s.name)+'</option>'; }
  for(let i=0;i<=SV.ladderUnlocked;i++) ladders+='<option value="'+i+'" '+(chosenLadder===i?'selected':'')+'>'+(i?'Step '+i+' · +'+Math.round(i*NM.ladderFeeStep*100)+'% fees':'Gentle beginnings')+'</option>';
  const end=G&&G.phase==='over'?'<p class="end-note">'+(G.won?'A whole season, beautifully traded.':'The market closes for the season.')+' '+G.feePaid+' fees paid · '+(G.starsEarned===undefined?'Stars saved':G.starsEarned+' stars earned')+'</p>':'';
  return end+'<div class="setup-row"><label>Table<select id="shapeSelect" aria-label="Table shape">'+tables+'</select></label><label>Fee ladder<select id="ladderSelect" aria-label="Fee ladder">'+ladders+'</select></label></div><div class="setup-buttons"><button class="primary" data-act="start">Start a season</button><button data-act="unlocks">Spend stars · '+SV.stars+'</button></div>';
}
function actionsHTML(){
  if(!G||G.phase==='over') return setupHTML();
  if(anim) return '<div class="action-heading"><h2>The stall is earning…</h2><p>Neighbours make a difference</p></div><p class="subline">A little light, a lucky visitor, a table full of possibilities.</p>';
  if(G.phase==='ready') return '<button class="primary wide" data-act="open">Open the stall</button><p class="subline">'+Math.max(0,5-G.night%5)+' nights until the next market fee</p>';
  if(G.phase==='fee'){
    const fee=feeAmount(G),can=G.coins>=fee;
    return '<div class="action-heading"><h2>Market fee due</h2><p>'+G.feePaid+' of 8 paid</p></div><button class="'+(can?'primary':'danger')+' wide" data-act="pay">'+(can?'Pay '+fee+' coins':'Close the season')+'</button><p class="subline">'+(can?'Paying brings one reroll and one remove token.':'You need '+fee+' coins. Your '+G.feePaid+' paid fees still earn stars.')+'</p>';
  }
  let offers='';
  for(let i=0;i<G.offers.length;i++){
    const item=itemById(G.offers[i]);
    offers+='<button class="offer" data-act="offer" data-index="'+i+'" data-rarity="'+item.rarity+'" aria-label="Read about '+esc(item.name)+'. '+esc(describeItem(item.id))+'">'+iconHTML(item.id)+'<strong>'+esc(item.name)+'</strong><small>'+esc(item.rarity)+' · '+item.base+' base</small></button>';
  }
  return '<div class="action-heading"><h2>Choose for your crate</h2><p>One find, or skip</p></div><div class="offer-grid">'+offers+'</div><div class="token-row"><button data-act="reroll" '+(G.rerolls?'':'disabled')+'>Reroll offer · '+G.rerolls+'</button><button data-act="removeMode" aria-pressed="'+removeMode+'" '+(G.removes&&G.crate.length?'':'disabled')+'>Remove an item · '+G.removes+'</button><button data-act="skip">Skip</button></div>';
}
function renderCrate(){
  const crate=G?G.crate:NM.startItems.map((id,i)=>({id,uid:i})),counts={}; let html='';
  for(let i=0;i<crate.length;i++) counts[crate[i].id]=(counts[crate[i].id]||0)+1;
  for(const id in counts){ const item=itemById(id); html+='<button data-act="item" data-id="'+id+'" aria-label="'+esc(item.name)+', '+counts[id]+' in crate">'+iconHTML(id)+'<span class="count">'+counts[id]+'</span></button>'; }
  $('crate').innerHTML=html||'<p class="subline">An empty crate. There is room to grow.</p>';
  $('crateCount').textContent=crate.length; $('crateHint').textContent=removeMode?'Tap a find to remove one':'Tap an item to learn about it';
}
function renderUI(){
  $('stats').innerHTML=statsHTML(); $('actions').innerHTML=actionsHTML(); renderCrate();
  $('fastBtn').textContent='Fast: '+(SV.fast?'on':'off'); $('fastBtn').setAttribute('aria-pressed',String(SV.fast));
  $('stageCaption').textContent=anim?'Coins counted from left to right':G&&G.result?'Last night: +'+G.result.total+' coins':'Your table finds its own arrangement';
  $('foot').textContent=G&&G.phase!=='over'?'Season stars: '+G.feePaid+' fees · '+(1+G.ladder*NM.ladderStarStep)+'× reward':SV.totalStars+' stars earned · '+SV.runs+' seasons played';
  paintIcons(); resizeMarket();
}
function settleSeason(){
  if(G&&G.phase==='over'){ const before=SV.stars; finishRun(SV,G); if(G.starsEarned===undefined) G.starsEarned=SV.stars-before; }
}
function startSeason(){
  const seed=(Date.now()^Math.floor(Math.random()*4294967296))>>>0;
  G=newRun(SV,seed,chosenShape,chosenLadder); removeMode=false; anim=null; save(true); renderUI(); tone(440,.08,.035);
}
function openNight(){
  if(!G||G.phase!=='ready'||anim) return;
  const before=G.coins; openStall(G);
  anim={elapsed:0,duration:SV.fast?400:1500,base:before}; removeMode=false; save(true); renderUI(); V.last=0; requestMarketFrame(); tone(392,.08,.03);
}
function afterChoice(index){
  if(!G||G.phase!=='offer'||anim) return;
  chooseOffer(G,index); removeMode=false; if(modalKind==='offer') closeSheet(); save(true); renderUI(); tone(523,.045,.025);
}
function toggleFast(){ SV.fast=!SV.fast; if(anim){ const progress=anim.elapsed/anim.duration; anim.duration=SV.fast?400:1500; anim.elapsed=progress*anim.duration; } save(); renderUI(); }
async function copyBackup(){
  const code=exportCode();
  try{ if(!navigator.clipboard||!navigator.clipboard.writeText) throw Error(); await navigator.clipboard.writeText(code); toast('Backup code copied'); }
  catch(e){ const box=$('loadCode'); if(box){ box.value=code; box.focus(); box.select(); toast('Your backup is selected. Copy it to keep it safe.'); } }
}
function performAction(button){
  const act=button.getAttribute('data-act');
  if(act==='welcome'){ try{ localStorage.setItem(TUTORIAL_KEY,'1'); }catch(e){} closeSheet(); }
  else if(act==='close') closeSheet();
  else if(act==='start') startSeason();
  else if(act==='open') openNight();
  else if(act==='offer') offerSheet(+button.getAttribute('data-index'));
  else if(act==='choose') afterChoice(+button.getAttribute('data-index'));
  else if(act==='skip') afterChoice(-1);
  else if(act==='reroll'&&G&&!anim){ if(rerollOffer(G)){ save(true); renderUI(); tone(490,.04,.02); } }
  else if(act==='removeMode'&&G&&!anim){ removeMode=!removeMode; renderUI(); if(removeMode) toast('Tap an item in your crate'); }
  else if(act==='item') itemSheet(button.getAttribute('data-id'));
  else if(act==='remove'&&G&&!anim){ const uid=+button.getAttribute('data-uid'),entry=G.crate.find(c=>c.uid===uid); if(removeItem(G,uid)){ removeMode=false; closeSheet(); if(entry) cratePuff(entry.id); save(true); renderUI(); toast('One item removed from your crate'); tone(260,.08,.02); } }
  else if(act==='pay'&&G){ const paid=payFee(G); settleSeason(); save(true); renderUI(); tone(paid?740:180,.13,.03); if(paid&&G.phase!=='over') toast('Fee paid. One reroll and one remove token gained.'); }
  else if(act==='unlocks') unlockSheet();
  else if(act==='unlock'){ if(unlock(SV,button.getAttribute('data-key'))){ save(true); renderUI(); unlockSheet(); tone(660,.1,.03); } }
  else if(act==='sound'){ SV.sound=!SV.sound; save(); settings(); if(SV.sound) tone(550,.07,.025); }
  else if(act==='sheetFast'){ toggleFast(); settings(); }
  else if(act==='copy') copyBackup();
  else if(act==='import'){ const code=$('loadCode').value; if(importCode(code)){ settleSeason(); closeSheet(); chosenShape=G?G.shape:SV.shapes[0]; chosenLadder=G?G.ladder:0; renderUI(); toast('Your market progress is restored'); } else toast('That backup code could not be read. Your progress is safe.'); }
  else if(act==='reset') showSheet('reset','<h2 id="sheetTitle">Start over?</h2><p>This removes your stars, unlocks and current season. Copy a backup first if you want to keep them.</p><div class="sheet-buttons"><button data-act="settings">Keep my market</button><button class="danger" data-act="confirmReset">Erase my progress</button></div>');
  else if(act==='settings') settings();
  else if(act==='confirmReset'){ SV=newSave(); G=null; anim=null; removeMode=false; chosenShape=SV.shapes[0]; chosenLadder=0; save(true); closeSheet(); renderUI(); toast('A fresh market is ready'); }
}
async function boot(){
  SV=await loadSave()||newSave(); G=SV.active; settleSeason(); chosenShape=G?G.shape:SV.shapes[0]; chosenLadder=G?G.ladder:0;
  prepareMarket(); renderUI(); save(true);
  $('settingsBtn').addEventListener('click',settings); $('fastBtn').addEventListener('click',toggleFast);
  document.addEventListener('pointerdown',startSound,{passive:true});
  document.addEventListener('click',e=>{ const button=e.target.closest('button[data-act]'); if(button&&!button.disabled) performAction(button); });
  document.addEventListener('change',e=>{ if(e.target.id==='shapeSelect'){ chosenShape=e.target.value; resizeMarket(); } if(e.target.id==='ladderSelect') chosenLadder=+e.target.value; });
  document.addEventListener('visibilitychange',()=>{
    paused=document.hidden;
    if(paused){ save(true); V.last=0; if(audio) audio.suspend().catch(()=>{}); }
    else { if(audio&&soundReady) audio.resume().catch(()=>{}); V.last=0; if(anim) requestMarketFrame(); else drawMarket(); }
  });
  window.addEventListener('pagehide',()=>save(true));
  $('overlay').addEventListener('click',e=>{ if(e.target===$('overlay')&&modalKind!=='welcome'&&modalKind!=='reset') closeSheet(); });
  document.addEventListener('keydown',e=>{
    if($('overlay').hidden) return;
    if(e.key==='Escape'&&modalKind!=='welcome'&&modalKind!=='reset'){ closeSheet(); return; }
    if(e.key==='Tab'){
      const nodes=$('sheet').querySelectorAll('button:not(:disabled),textarea,select'),first=nodes[0],last=nodes[nodes.length-1];
      if(!first) return;
      if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('sheet'))){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===$('sheet'))){ e.preventDefault(); first.focus(); }
    }
  });
  let seen=false; try{ seen=localStorage.getItem(TUTORIAL_KEY)==='1'; }catch(e){}
  if(!seen) welcome();
}
boot();
