<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#18302a">
<meta name="mobile-web-app-capable" content="yes">
<title>Roadbound</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318302a'/%3E%3Crect x='9' y='9' width='14' height='14' transform='rotate(45 16 16)' fill='%23f6b63c'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#10201c; --pine:#18302a; --moss:#23463c; --line:#2f5a4d;
  --parch:#f5ead0; --dim:#a9c0b4;
  --mari:#f6b63c; --mari-d:#b97a12;
  --red:#e9573f; --sky:#59b9ea; --leaf:#7ee08f;
  --disp:"sans-serif-condensed","Roboto Condensed","Arial Narrow","Avenir Next Condensed",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a1411;color:var(--parch);font-family:var(--body);overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--mari);outline-offset:2px}
.hidden{display:none!important}
#app{position:fixed;inset:0;max-width:500px;margin:0 auto;background:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---- camp chrome ---- */
.topbar{display:flex;align-items:center;gap:7px;padding:9px 10px;padding-top:calc(9px + env(safe-area-inset-top));background:var(--pine);border-bottom:2px solid var(--line)}
.pill{display:flex;align-items:center;gap:5px;background:var(--ink);border-radius:999px;padding:6px 11px 6px 8px;font:700 15px/1 var(--disp);letter-spacing:.02em;white-space:nowrap}
.pill.power{color:var(--mari)}
.topbar .sp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:10px;background:var(--moss);font-size:18px;display:grid;place-items:center;flex:none}
#main{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;background:var(--pine);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 12px/1 var(--disp);color:var(--dim);position:relative}
.tabs .e{font-size:22px;line-height:1;transition:transform .12s}
.tabs button[aria-selected=true]{color:var(--parch);background:var(--moss)}
.tabs button[aria-selected=true] .e{transform:translateY(-2px) scale(1.14)}
.tabs .dot{position:absolute;top:5px;left:calc(50% + 9px);width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--pine)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--moss);color:var(--parch);font:700 16px/1 var(--disp);letter-spacing:.02em;box-shadow:0 3px 0 #0a1411;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a1411}
.btn.primary{background:var(--mari);color:#2a1c00;box-shadow:0 3px 0 var(--mari-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--mari-d)}
.btn.big{min-height:56px;font-size:23px;width:100%}
.btn.danger{background:#7a2a20}
.btn.on{background:#2c6a48;box-shadow:0 3px 0 #0a1411, inset 0 0 0 2px var(--leaf)}
.btn[disabled]{opacity:.42;pointer-events:none}

h2{font:700 25px/1.1 var(--disp);letter-spacing:.01em}
h3{font:700 17px/1.2 var(--disp);margin-top:4px}
p{font-size:14px;line-height:1.45;color:var(--dim)}
.lead{font-size:13.5px}

/* ---- road tab ---- */
.chap{border-radius:16px;overflow:hidden;background:var(--pine);border:2px solid var(--line);flex:none}
.chap-view{position:relative;height:clamp(150px,29vh,240px)}
.chap-view canvas{width:100%;height:100%;display:block}
.chap-title{position:absolute;left:12px;top:9px;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 10px rgba(0,0,0,.35)}
.chap-title small{display:block;font:700 13px/1.2 var(--disp)}
.chap-title b{font:700 27px/1.05 var(--disp)}
.chap-nav{position:absolute;bottom:8px;width:46px;height:42px;border-radius:12px;background:rgba(16,32,28,.78);font:700 26px/1 var(--disp)}
.chap-nav.prev{left:8px}.chap-nav.next{right:8px}
.chap-foot{padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px}
.chap-meta{display:flex;justify-content:space-between;gap:8px;font:700 13.5px/1.2 var(--disp);color:var(--dim)}
.chap-meta .ok{color:var(--leaf)}.chap-meta .warn{color:#ffb46b}
.card{display:flex;align-items:center;gap:12px;background:var(--pine);border:2px solid var(--line);border-radius:14px;padding:11px 12px;flex:none}
.card>div{flex:1}
.card b{font:700 17px/1.2 var(--disp)}
.card p{font-size:12.5px}

/* waymarker strip: one diamond per wave */
.pips{display:flex;align-items:center}
.pip{width:9px;height:9px;transform:rotate(45deg);background:rgba(16,32,28,.7);border:1.5px solid rgba(245,234,208,.6);flex:none}
.pip.elite{width:12px;height:12px;border-color:#ffb46b}
.pip.boss{width:15px;height:15px;border:2px solid #ff7a66}
.pip.done{background:var(--mari);border-color:#fff3d0}
.pip.now{background:#fff;box-shadow:0 0 0 3px rgba(246,182,60,.55)}
.pips i{flex:1;height:2px;background:rgba(245,234,208,.4)}
.pips i.done{background:var(--mari)}

/* ---- gear tab ---- */
.herocard{display:grid;grid-template-columns:62px 1fr 62px;gap:8px;align-items:center;background:linear-gradient(#2d5c4c,#1b382f);border:2px solid var(--line);border-radius:16px;padding:10px;flex:none}
.herocard .col{display:flex;flex-direction:column;gap:8px}
.herocard canvas{width:100%;height:204px;display:block}
.tile{position:relative;aspect-ratio:1;width:100%;border-radius:12px;border:2px solid rgba(0,0,0,.4);display:grid;place-items:center;font-size:25px;line-height:1;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.28);color:#fff}
.tile .lv{position:absolute;left:5px;bottom:4px;font:700 11px/1 var(--disp);text-shadow:0 1px 0 rgba(0,0,0,.75)}
.tile .up{position:absolute;right:4px;top:3px;font-size:10px;color:#c9ffb0;text-shadow:0 1px 0 #000}
.tile.sm{width:46px;flex:none;font-size:21px}
.r0{background:#77857e}.r1{background:#3c9a55}.r2{background:#3873d0}.r3{background:#8648d0}.r4{background:#d98a12}.r5{background:#d23c3a}
.tile.empty{background:rgba(16,32,28,.55);border:2px dashed var(--line);box-shadow:none}
.tile.empty .ic{opacity:.32;filter:grayscale(1)}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none}
.ms{background:var(--pine);border-radius:10px;padding:7px 4px;text-align:center}
.ms small{display:block;font-size:10.5px;color:var(--dim);line-height:1.2}
.ms b{font:700 16px/1.2 var(--disp)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.sub{display:flex;justify-content:space-between;align-items:baseline;font:700 15px/1.2 var(--disp);color:var(--dim);margin-top:2px}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.empty{background:none;border:0;text-align:center;padding:14px 8px}

/* ---- list rows (perks, talents, shop) ---- */
.row{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;background:var(--pine);border:2px solid var(--line);border-radius:14px;padding:10px;flex:none}
.row .ic{width:46px;height:46px;border-radius:12px;background:var(--ink);display:grid;place-items:center;font-size:24px;line-height:1;border:2px solid var(--line)}
.row b{font:700 17px/1.2 var(--disp);display:block}
.row b small{font:700 12px/1 var(--disp);margin-left:5px;color:var(--mari)}
.row p{font-size:12.5px;line-height:1.35}
.row .btn{min-height:40px;font-size:14.5px;padding:0 11px}
.row.locked .ic{filter:grayscale(1);opacity:.65}
.row.pr1 .ic{border-color:#4a90f0}.row.pr2 .ic{border-color:#a862f2}
.got{font:700 13px/1 var(--disp);color:var(--leaf);padding-right:4px}
small.t0{color:#b9c6bf!important}small.t1{color:#7fb2ff!important}small.t2{color:#c796ff!important}
.note{font-size:12.5px;text-align:center;padding:4px 10px}

/* ---- battle ---- */
#battle .scene{position:relative;flex:1;min-height:190px;background:#0a1411;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud-top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;align-items:center}
.chip{background:rgba(16,32,28,.76);border-radius:999px;padding:6px 11px 6px 8px;font:700 15px/1 var(--disp);display:flex;gap:5px;align-items:center}
.hud-top .iconbtn{background:rgba(16,32,28,.76)}
.hud-title{position:absolute;top:calc(54px + env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}
.hud-title b{font:700 23px/1 var(--disp);letter-spacing:.03em;text-shadow:1px 0 0 #10201c,-1px 0 0 #10201c,0 1px 0 #10201c,0 -1px 0 #10201c,1px 1px 0 #10201c,-1px -1px 0 #10201c,1px -1px 0 #10201c,-1px 1px 0 #10201c,0 3px 0 rgba(0,0,0,.45)}
.hud-title small{display:block;font:700 13px/1.35 var(--disp);text-shadow:1px 0 0 #10201c,-1px 0 0 #10201c,0 1px 0 #10201c,0 -1px 0 #10201c,1px 1px 0 #10201c,-1px -1px 0 #10201c,1px -1px 0 #10201c,-1px 1px 0 #10201c}
.hud-title .pips{width:min(80%,310px);margin:7px auto 0}
.banner{position:absolute;left:8px;right:8px;top:40%;text-align:center;font:700 21px/1.15 var(--disp);pointer-events:none;opacity:0;text-shadow:1px 0 0 #10201c,-1px 0 0 #10201c,0 1px 0 #10201c,0 -1px 0 #10201c,1px 1px 0 #10201c,-1px -1px 0 #10201c,1px -1px 0 #10201c,-1px 1px 0 #10201c,0 3px 0 rgba(0,0,0,.5)}
.banner.show{animation:ban 1.9s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.8)}10%{opacity:1;transform:scale(1.06)}18%{transform:scale(1)}78%{opacity:1}100%{opacity:0}}
.panel{background:var(--pine);border-top:2px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;flex:none}
.bars{display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:6px}
.bar{position:relative;height:24px;border-radius:7px;background:var(--ink);overflow:hidden;font:700 13px/24px var(--disp);text-align:center;white-space:nowrap}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0}
.bar span{position:relative;text-shadow:0 1px 0 rgba(0,0,0,.65)}
.bar.xp i{background:#4c9638}.bar.hp i{background:#c5402e}.bar.sh i{background:#2c7bb0}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stat{display:flex;align-items:center;gap:7px;background:var(--ink);border-radius:8px;padding:4px 8px;min-height:33px}
.stat .e{font-size:15px;width:20px;text-align:center;line-height:1}
.stat small{display:block;font-size:10.5px;color:var(--dim);line-height:1.15}
.stat b{font:700 15px/1.1 var(--disp)}
.stat.buff b{color:var(--leaf)}
.perkrow{display:flex;gap:5px;min-height:40px;overflow-x:auto;align-items:center;width:100%;text-align:left;padding:1px 2px 4px}
.pk{position:relative;flex:none;width:34px;height:34px;border-radius:8px;background:var(--ink);border:2px solid var(--line);display:grid;place-items:center;font-size:17px;line-height:1}
.pk i{position:absolute;right:-4px;bottom:-4px;font:700 10px/1 var(--disp);background:var(--mari);color:#2a1c00;border-radius:6px;padding:2px 4px}
.pk.r1{border-color:#4a90f0}.pk.r2{border-color:#a862f2}
.hint{font-size:12.5px;color:var(--dim)}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ctrl .btn{min-height:40px;font-size:14.5px;padding:0 6px}

/* ---- sheets ---- */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(5,11,9,.74)}
#modal.open{display:flex}
.sheet{width:100%;max-width:500px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:var(--pine);border-top:3px solid var(--mari);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:11px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts.one{grid-template-columns:1fr}
.pcard{display:grid;grid-template-columns:52px 1fr;gap:3px 12px;align-items:center;text-align:left;width:100%;padding:11px 12px;border-radius:14px;background:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 #0a1411}
.pcard:active{transform:translateY(2px);box-shadow:0 1px 0 #0a1411}
.pcard .ic{grid-row:1/3;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:28px;line-height:1;background:var(--moss)}
.pcard b{font:700 18px/1.15 var(--disp);align-self:end}
.pcard b small{font:700 12px/1 var(--disp);color:var(--mari);margin-left:6px}
.pcard p{font-size:13.5px;line-height:1.35;color:var(--parch);opacity:.88;align-self:start}
.pcard.r1{border-color:#4a90f0}.pcard.r2{border-color:#a862f2}
.ihead{display:grid;grid-template-columns:58px 1fr 40px;gap:12px;align-items:center}
.istats{list-style:none;display:flex;flex-direction:column;gap:6px}
.istats li{display:flex;align-items:baseline;gap:8px;background:var(--ink);border-radius:10px;padding:9px 11px;font-size:14px}
.istats li span{flex:1;color:var(--dim)}
.istats b{font:700 17px/1 var(--disp)}
.istats i{font-style:normal;font-size:12px}
.pos{color:var(--leaf)}.neg{color:#ff8a78}
.frow{display:flex;align-items:center;gap:7px;background:var(--ink);border-radius:12px;padding:8px}
.frow .ftxt{flex:1;min-width:0}
.frow .ftxt b{font:700 15px/1.2 var(--disp);display:block}
.frow .ftxt p{font-size:12px}
.frow .btn{min-height:40px;font-size:14.5px}
.frow .arr{font:700 18px/1 var(--disp);color:var(--mari)}
.rew{display:flex;gap:8px;flex-wrap:wrap}
.rew span{background:var(--ink);border-radius:999px;padding:7px 12px;font:700 16px/1 var(--disp)}
.loot{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.loot .tile{font-size:21px;border-radius:10px}
.plist{display:flex;flex-direction:column;gap:6px}
.plist .row{padding:8px;grid-template-columns:40px 1fr;border-width:1.5px}
.plist .row .ic{width:40px;height:40px;font-size:20px}
textarea{width:100%;background:var(--ink);color:var(--parch);border:2px solid var(--line);border-radius:10px;padding:8px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;resize:none;-webkit-user-select:text;user-select:text;word-break:break-all}
.warnbox{background:#4a2a1a;border:2px solid #a8622a;color:#ffd9b0;border-radius:10px;padding:9px 11px;font-size:13px}
.help{padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4;color:var(--parch)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--parch);color:#10201c;font:700 14.5px/1.25 var(--disp);padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:86%;text-align:center}
#toast.show{opacity:1}
@media (max-height:640px){
  .stat{min-height:29px;padding:3px 8px}.stat small{display:none}
  .herocard canvas{height:168px}
}
@media (prefers-reduced-motion:reduce){ .sheet,.banner.show{animation-duration:.01s} .tabs .e{transition:none} }

/* ---- endgame: waystones, relics, legacy ---- */
.ws{display:inline-block;width:.62em;height:.62em;transform:rotate(45deg);background:var(--mari);border:1.5px solid #fff3d0;margin:0 .45em 0 .2em;vertical-align:.02em}
.wsn{font:700 1em/1 var(--disp);color:var(--mari);white-space:nowrap}
.btn .ws{margin-left:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--pine);border:2px solid var(--line);border-radius:14px;padding:4px;flex:none}
.seg button{min-height:40px;border-radius:10px;font:700 16px/1 var(--disp);color:var(--dim)}
.seg button.on{background:var(--moss);color:var(--parch)}
.relics{display:flex;gap:8px;flex:none}
.relic{position:relative;width:54px;height:54px;border-radius:50%;background:var(--pine);border:2px dashed var(--line);font-size:24px;line-height:1;display:grid;place-items:center;color:var(--dim)}
.relic.on{border:2px solid var(--mari);background:#2a2412}
.relic i{position:absolute;right:-3px;bottom:-3px;font:700 11px/1 var(--disp);background:var(--mari);color:#2a1c00;border-radius:7px;padding:2px 5px}
.tile .st{position:absolute;left:4px;top:3px;font:700 10.5px/1 var(--disp);color:#fff3b0;text-shadow:0 1px 0 rgba(0,0,0,.8)}
.plist.wide .row{grid-template-columns:40px 1fr auto}
.rfound{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;background:#2a2412;border:2px solid var(--mari);border-radius:14px;padding:10px 12px}
.rfound .ic{width:52px;height:52px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-size:27px;line-height:1}
.rfound b{font:700 18px/1.2 var(--disp);display:block}
.rfound b small{font:700 12px/1 var(--disp);color:var(--mari);margin-left:6px}
.rfound p{font-size:13px;line-height:1.35;color:var(--parch);opacity:.88}
.pk.rl{border-color:var(--mari);border-radius:50%;background:#2a2412}
.pcard.tight{padding:8px 12px;grid-template-columns:44px 1fr}
.pcard.tight .ic{width:44px;height:44px;font-size:23px}
.pcard.tight p{font-size:13px}
.istats b{text-align:right}
.help b{font-family:var(--disp)}
.istats.stack li{flex-direction:column;align-items:flex-start;gap:3px}
.istats.stack b{text-align:left;font-size:16px;line-height:1.25}
.row b small{white-space:nowrap}
.row .btn[data-act=bench]{font-size:13.5px;padding:0 9px;min-width:74px}

</style>
</head>
<body>
<div id="app">
  <div id="home" class="screen">
    <header class="topbar">
      <span class="pill power" title="Power">⚔️ <b id="tPower">0</b></span>
      <span class="sp"></span>
      <span class="pill" title="Gold">🪙 <b id="tGold">0</b></span>
      <span class="pill" title="Gems">💎 <b id="tGems">0</b></span>
      <button class="iconbtn" data-act="settings" aria-label="Settings">⚙️</button>
    </header>
    <main id="main"></main>
    <nav class="tabs" role="tablist">
      <button role="tab" data-act="tab" data-tab="shop"><span class="e">🏪</span>Shop</button>
      <button role="tab" data-act="tab" data-tab="gear"><span class="e">🧥</span>Gear</button>
      <button role="tab" data-act="tab" data-tab="road"><span class="e">⚔️</span>Road</button>
      <button role="tab" data-act="tab" data-tab="perks"><span class="e">🃏</span>Perks</button>
      <button role="tab" data-act="tab" data-tab="talents"><span class="e">💪</span>Talents</button>
    </nav>
  </div>

  <div id="battle" class="screen hidden">
    <div class="scene">
      <canvas id="cv"></canvas>
      <div class="hud-top">
        <span class="chip">💀 <b id="hKills">0</b></span>
        <span class="chip">🪙 <b id="hGold">0</b></span>
        <span class="sp" style="flex:1"></span>
        <button class="iconbtn" data-act="pause" aria-label="Pause">⏸️</button>
      </div>
      <div class="hud-title"><b id="hChap">Chapter 1</b><small id="hLand"></small><div class="pips" id="hPips"></div></div>
      <div class="banner" id="banner"></div>
    </div>
    <div class="panel">
      <div class="bars">
        <div class="bar xp"><i id="bXp"></i><span id="tXp">Lv 1</span></div>
        <div class="bar hp"><i id="bHp"></i><span id="tHp"></span></div>
        <div class="bar sh"><i id="bSh"></i><span id="tSh"></span></div>
      </div>
      <div class="statgrid" id="statGrid"></div>

const clamp = (v,a,b) => v<a?a:(v>b?b:v);
function wpick(items, wf){
  let tot=0; const ws=items.map(i=>{const w=Math.max(0,wf(i)); tot+=w; return w;});
  let r=rnd()*tot;
  for (let i=0;i<items.length;i++){ r-=ws[i]; if(r<=0) return items[i]; }
  return items[items.length-1];
}

  S.inv.forEach(i=>{ i.st = i.rar===RAR.length-1 ? clamp(i.st|0,0,5) : 0; });
  for (const s of SLOT_ORDER){ if (S.eq[s]!=null && !S.inv.some(i=>i.id===S.eq[s] && i.slot===s)) S.eq[s]=null; }
  PERKS.forEach(p=>{ if(p.base) S.perks[p.id]=1; });
  S.nextId = Math.max(S.nextId|0, 1+S.inv.reduce((m,i)=>Math.max(m,i.id),0));
  S.chapter = Math.max(1, S.chapter|0); S.sel = clamp(S.sel|0, 1, S.chapter);
  S.gold = Math.max(0, +S.gold||0); S.gems = Math.max(0, +S.gems||0); S.stones = Math.max(0, +S.stones||0);
  if (!SPEEDS.includes(S.speed)) S.speed=1;
  S.loop = S.loop===true ? 1 : clamp(S.loop|0,0,2);
  for (const k of ['legacy','relics','bench','talents','best']) if (!S[k] || typeof S[k]!=='object') S[k]={};
  for (const id in S.relics){ if (!RELIC[id]) delete S.relics[id]; else S.relics[id]=clamp(S.relics[id]|0,1,RELIC_MAX); }
  for (const id in S.bench) if (!PERK[id] || id==='potion') delete S.bench[id];
  if (!Array.isArray(S.relicEq)) S.relicEq=[];
  S.relicEq = S.relicEq.filter((id,i,a)=>S.relics[id] && a.indexOf(id)===i).slice(0,relicSlots(S));
  if (old){
    // a save from before ascension and relics existed
    S.v=2;
    S.top=Math.max(S.top|0, S.chapter-1); S.jtop=S.chapter-1;
    const got=[];
    for (let c=4;c<=S.top;c+=2){ const r=grantRelic(S); if (r.id) got.push(r.id); S.relicCh=c; }
    S.news={relics:got};
  }
  S.top=Math.max(S.top|0,0); S.jtop=clamp(S.jtop|0,0,S.top);
  return S;
}

/* ---------- items ---------- */
function addItem(S, slot, rar, lvl, st){ const it={id:S.nextId++, slot, rar, lvl:lvl||1, st:st||0}; S.inv.push(it); return it; }
function itemById(S,id){ return id==null?null:(S.inv.find(i=>i.id===id)||null); }
function star(it){ return it.rar===RAR.length-1 ? (it.st||0) : 0; }
function maxLvl(it){ return RAR[it.rar].max+10*star(it); }
function rarMult(it){ return RAR[it.rar].m*(1+0.5*star(it)); }
function itemMainAt(it,lvl){ return Math.round(SLOTS[it.slot].base*rarMult(it)*(1+0.12*(lvl-1))); }
function itemMain(it){ return itemMainAt(it,it.lvl); }
function itemBonus(it){ const s=SLOTS[it.slot]; return s.bonus ? +(s.per*(it.rar+1+star(it))).toFixed(1) : 0; }
function itemName(it){ return RAR_PREFIX[it.rar]+' '+SLOTS[it.slot].n+(star(it)?' '+'★'.repeat(star(it)):''); }
function upCost(it){ return Math.round(30*Math.pow(it.lvl,1.5)*(1+(it.rar+star(it))*0.6)); }
function sellVal(it){ return Math.round(12*rarMult(it)*(1+0.25*(it.lvl-1))); }
function itemScore(it){ return itemMain(it)*(1+(it.rar+star(it))*0.03); }
function isEquipped(S,it){ return S.eq[it.slot]===it.id; }
function removeItem(S,it){ const i=S.inv.indexOf(it); if(i>=0) S.inv.splice(i,1); if (S.eq[it.slot]===it.id) S.eq[it.slot]=null; }

function rarWeights(c, boost){
  const k = c-1+(boost||0);
  return [Math.max(4,60-7*k), 30, 8+4*k, 1+2*k, Math.max(0,(k-3)*0.8), Math.max(0,(k-6)*0.3)];
}
function rollRar(c, boost, minRar){
  const w = rarWeights(c,boost); minRar = minRar||0;
  let tot=0; for (let i=minRar;i<w.length;i++) tot+=w[i];
  let r=rnd()*tot;
  for (let i=minRar;i<w.length;i++){ r-=w[i]; if(r<=0) return i; }
  return minRar;
}
function rollLoot(c, boost, minRar){ return {slot:SLOT_ORDER[Math.floor(rnd()*SLOT_ORDER.length)], rar:rollRar(c,boost,minRar)}; }

function autoEquip(S){
  let changed=0;
  for (const slot of SLOT_ORDER){
    let best=null;
    for (const it of S.inv) if (it.slot===slot && (!best || itemScore(it)>itemScore(best))) best=it;
    if (best && S.eq[slot]!==best.id){ S.eq[slot]=best.id; changed++; }
  }
  return changed;
}
/* Three alike forge into the next step: Common up to Mythic, then Mythic one star at a time (to 5 stars). */
function findForges(S){
  const g={};
  for (const it of S.inv){ if (it.rar>=RAR.length-1 && star(it)>=5) continue; const k=it.slot+':'+it.rar+':'+star(it); (g[k]=g[k]||[]).push(it); }
  const out=[];
  for (const k in g) if (g[k].length>=3){ const [slot,rar,st]=k.split(':'); out.push({slot, rar:+rar, st:+st, count:g[k].length}); }
  out.sort((a,b)=>b.rar-a.rar || b.st-a.st || SLOT_ORDER.indexOf(a.slot)-SLOT_ORDER.indexOf(b.slot));
  return out;
}
function forgeOne(S, slot, rar, st){
  st=st||0;
  const top=rar>=RAR.length-1;
  const grp = S.inv.filter(i=>i.slot===slot && i.rar===rar && star(i)===st);
  if (grp.length<3 || (top && st>=5)) return null;
  grp.sort((a,b)=> b.lvl-a.lvl || (isEquipped(S,b)?1:0)-(isEquipped(S,a)?1:0));
  const keep = grp[0], rest = grp.slice(1).sort((a,b)=> (isEquipped(S,a)?1:0)-(isEquipped(S,b)?1:0) || a.lvl-b.lvl);
  const used = [keep, rest[0], rest[1]];
  const wasEq = used.some(i=>isEquipped(S,i));
  used.forEach(i=>removeItem(S,i));
  const it = top ? addItem(S, slot, rar, keep.lvl, st+1) : addItem(S, slot, rar+1, Math.min(keep.lvl, RAR[rar+1].max), 0);
  if (wasEq) S.eq[slot]=it.id;
  return it;
}
function forgeAll(S){
  let n=0, f;
  while ((f=findForges(S)).length && n<500){ const g=f[f.length-1]; forgeOne(S, g.slot, g.rar, g.st); n++; }
  return n;
}
function trimBag(S){
  let n=0, gold=0;
  const rank=it=>it.rar*1000+star(it)*100+it.lvl;
  while (S.inv.length>BAG_MAX){
    let worst=null;
    for (const it of S.inv){ if (isEquipped(S,it)) continue; if (!worst || rank(it)<rank(worst)) worst=it; }
    if (!worst) break;
    gold+=sellVal(worst); removeItem(S,worst); n++;
  }
  S.gold+=gold;
  return {n, gold};
}

/* ---------- relics ---------- */
function relicSlots(S){ return 3+((S.legacy&&S.legacy.lrelic)||0); }
function relLv(S,id){ return S.relicEq.indexOf(id)>=0 ? (S.relics[id]||0) : 0; }
function grantRelic(S){
  const pool=RELICS.filter(r=>(S.relics[r.id]||0)<RELIC_MAX);
  if (!pool.length){ S.gems+=150; return {id:null, gems:150}; }
  const r=wpick(pool, x=>S.relics[x.id]?1:2.5);
  const lvl=(S.relics[r.id]||0)+1; S.relics[r.id]=lvl;
  if (lvl===1 && !r.risk && S.relicEq.length<relicSlots(S)) S.relicEq.push(r.id);
  return {id:r.id, lvl};
}
function toggleRelic(S,id){
  const i=S.relicEq.indexOf(id);
  if (i>=0){ S.relicEq.splice(i,1); return true; }
  if (!S.relics[id] || S.relicEq.length>=relicSlots(S)) return false;
  S.relicEq.push(id); return true;
}

/* ---------- permanent stats ---------- */
function metaStats(S){
  const T = id => S.talents[id]||0, L = id => S.legacy[id]||0;
  let atk=10, hp=160, sh=0, crit=5, critF=150, eva=5, def=0;
  for (const slot of SLOT_ORDER){
    const it=itemById(S,S.eq[slot]); if(!it) continue;
    const s=SLOTS[slot], v=itemMain(it), b=itemBonus(it);
    if (s.main==='atk') atk+=v; else if (s.main==='hp') hp+=v; else sh+=v;
    if (s.bonus==='crit') crit+=b; else if (s.bonus==='critF') critF+=b; else if (s.bonus==='def') def+=b; else if (s.bonus==='eva') eva+=b;
  }
  const m={};
  m.atk = atk*(1+0.04*T('might'))*Math.pow(1.3,L('ldmg'));
  m.hp = hp*(1+0.04*T('vigor'))*Math.pow(1.3,L('lhp'));
  m.shield = (sh+8*T('guard'))*(1+0.05*T('guard'))*Math.pow(1.3,L('lhp'));
  m.crit = crit+T('prec'); m.critF=critF; m.eva=eva; m.def=def; m.counter=0; m.ls=0;
  m.aspd = 1+0.015*T('swift');
  m.goldM = (1+0.05*T('fortune'))*Math.pow(1.5,L('lgold'));
  m.xpM = (1+0.05*T('wisdom'))*(1+0.12*L('lxp'));
  m.dropM = 1;
  let l;
  if ((l=relLv(S,'edge'))){ m.atk*=1.35+0.15*l; m.hp*=0.75; }
  if ((l=relLv(S,'shell'))){ m.hp*=1.35+0.15*l; m.atk*=0.85; }
  if ((l=relLv(S,'glove'))){ m.crit+=4+2*l; m.critF+=25+15*l; }
  if ((l=relLv(S,'bird'))) m.aspd*=1.12+0.06*l;
  if ((l=relLv(S,'cloak'))) m.eva+=4+2*l;
  if ((l=relLv(S,'core'))) m.shield=(m.shield+m.hp*0.05)*(1.25+0.15*l);
  if ((l=relLv(S,'tooth'))) m.ls+=4+2*l;
  if ((l=relLv(S,'mirror'))) m.counter+=8+3*l;
  if ((l=relLv(S,'clover'))){ m.goldM*=1.3+0.15*l; m.dropM*=1.3+0.15*l; }
  if ((l=relLv(S,'journal'))) m.xpM*=1.2+0.1*l;
  m.crit=Math.min(100,m.crit); m.eva=Math.min(60,m.eva);
  const dps = m.atk*m.aspd*(1+m.crit/100*(m.critF/100-1));
  const ehp = (m.hp+m.shield*1.5)/(1-m.def/100)/(1-m.eva/100);
  m.power = Math.round(dps*5 + ehp*0.4);
  return m;
}
function talentCost(t, lvl){ return Math.round(t.base*Math.pow(t.g, lvl)); }
function trainAll(S){
  let n=0;
  for (let guard=0; guard<5000; guard++){
    let best=null, bc=Infinity;
    for (const t of TALENTS){ const l=S.talents[t.id]||0; if (l>=t.max) continue; const c=talentCost(t,l); if (c<bc){ bc=c; best=t; } }
    if (!best || bc>S.gold) break;
    S.gold-=bc; S.talents[best.id]=(S.talents[best.id]||0)+1; n++;
  }
  return n;
}
function perkUnlockCost(S, p){
  const n = PERKS.filter(x=>!x.base && S.perks[x.id]).length;
  return Math.round(120*Math.pow(1.5,n)*(p.r===2?1.5:1));
}
function perkMax(p, cap){ return p.id==='potion' ? p.max : p.max+(cap||0); }
function poolSize(S){ return PERKS.filter(p=>p.id!=='potion' && S.perks[p.id] && !S.bench[p.id]).length; }
function toggleBench(S,id){
  if (id==='potion' || !S.perks[id]) return false;
  if (S.bench[id]){ delete S.bench[id]; return true; }
  if (poolSize(S)<=MIN_POOL) return false;
  S.bench[id]=1; return true;
}
function themeOf(c){ return THEMES[(c-1)%THEMES.length]; }
function chapterName(c){ const lap=Math.floor((c-1)/THEMES.length); return themeOf(c).n + (lap? ' +'+lap : ''); }
function recPower(c){ return Math.round(19*Math.pow(1.39,c-1))*10; }

/* ---------- ascension + legacy ---------- */
function stonesFor(jtop){ if (jtop<10) return 0; let s=0; for (let c=10;c<=jtop;c++) s+=Math.pow(1.3,c-10); return Math.round(s); }
function legacyCost(t, lvl){ return t.costs ? t.costs[lvl] : Math.ceil(t.base*Math.pow(t.g,lvl)); }
function startChapter(S){ return Math.max(1, Math.min(1+2*(S.legacy.lskip||0), S.top)); }
function buyLegacy(S, id){
  const t=LEGACY.find(x=>x.id===id); if (!t) return false;
  const l=S.legacy[id]||0; if (l>=t.max) return false;
  const c=legacyCost(t,l); if (S.stones<c) return false;
  S.stones-=c; S.legacy[id]=l+1;
  if (id==='lskip') S.chapter=Math.max(S.chapter, startChapter(S));
  return true;
}
function ascend(S, now){
  const gain=stonesFor(S.jtop); if (!gain) return 0;
  S.stones+=gain; S.asc++;
  const keep=0.1*(S.legacy.lkeep||0);
  for (const t of TALENTS){ const k=Math.floor((S.talents[t.id]||0)*keep); if (k>0) S.talents[t.id]=k; else delete S.talents[t.id]; }
  S.gold=0; S.best={}; S.jtop=0;
  S.chapter=startChapter(S); S.sel=S.chapter; S.stashT=now;
  return gain;
}

/* ---------- idle stash / gift / shop ---------- */
function stashRate(S){ return 150*Math.pow(BAL.GOLD_G, S.chapter-1); }           // gold per hour
function stashAmount(S, now){ return Math.floor(clamp((now-S.stashT)/HOUR,0,8)*stashRate(S)); }
function claimStash(S, now){ const g=stashAmount(S,now); S.gold+=g; S.stashT=now; return g; }
function giftWait(S, now){ return Math.max(0, S.giftT+6*HOUR-now); }
function claimGift(S, now){ if (giftWait(S,now)>0) return null; S.giftT=now; const g={gems:40, gold:Math.round(100*Math.pow(BAL.GOLD_G,S.chapter-1))}; S.gems+=g.gems; S.gold+=g.gold; return g; }
function crateCost(S){ return Math.round(150*Math.pow(BAL.GOLD_G, S.chapter-1)); }
function pouchGold(S){ return Math.round(400*Math.pow(BAL.GOLD_G, S.chapter-1)); }

/* ===================== RUN ENGINE ===================== */
function xpNeed(l){ return Math.round(6+2.5*(l-1)); }

function newRun(S, ch){
  const m = metaStats(S), rel={};
  for (const id of S.relicEq) if (S.relics[id]) rel[id]=S.relics[id];
  const run = {ch, wave:0, waves:WAVE_PLAN.length, phase:'walk', prev:'walk', walkT:1.2, time:0, kills:0, gold:0, gems:0,
    loot:[], ev:[], enemies:[], nextId:1, pending:0, choices:null, m, over:null, rel,
    cap:S.legacy.lcap||0, cards:3+(S.legacy.lcards||0)+(rel.compass?1:0),
    rerolls:(S.talents.reroll||0)+(rel.compass?rel.compass-1:0),
    cdM:rel.glass?1-(0.15+0.07*rel.glass):1,
    unlocked:Object.keys(S.perks).filter(id=>PERK[id] && !S.bench[id]),
    hero:{lvl:1, xp:0, need:xpNeed(1), perks:{}, order:[], hp:1, shield:0, atkT:0.5, hits:0, stacks:0, revived:false, candle:false, sure:false,
      cd:{storm:2, beam:3.5, frost:5}, queue:[], st:null}};
  recalc(run);
  run.hero.hp = run.hero.st.maxHp; run.hero.shield = run.hero.st.maxShield;
  const n = S.talents.prep||0;
  for (let i=0;i<n;i++){
    const pool = run.unlocked.map(id=>PERK[id]).filter(p=>p.id!=='potion' && (run.hero.perks[p.id]||0)<perkMax(p,run.cap));
    if (pool.length) applyPerk(run, wpick(pool, p=>PERK_RAR[p.r].w).id);
  }
  run.ev.length=0;
  return run;
}

function recalc(run){
  const m=run.m, h=run.hero, p=h.perks, L=id=>p[id]||0, st={};
  st.maxHp = m.hp*(1+0.18*L('vital'));
  st.maxShield = m.shield + L('bulwark')*(15+m.hp*0.10);
  st.dmg = m.atk*(1+0.18*L('edge'))*(1+h.stacks*0.015*L('trance'));
  st.aspd = m.aspd*(1+0.12*L('quick'));
  st.crit = Math.min(100, m.crit+7*L('keen'));
  st.critF = m.critF+30*L('brutal');
  st.def = Math.min(75, m.def+7*L('hide'));
  st.eva = Math.min(60, m.eva+6*L('feet'));
  st.counter = Math.min(100, m.counter+12*L('riposte'));
  st.ls = Math.min(100, m.ls+8*L('thirst'));
  st.goldM = m.goldM*(1+0.25*L('goldrush'));
  st.xpM = m.xpM*(1+0.20*L('scholar'));
  h.st = st;
}
function berserkMult(run){ const h=run.hero, l=h.perks.berserk||0; return l ? 1+(1-clamp(h.hp/h.st.maxHp,0,1))*0.25*l : 1; }

function applyPerk(run, id){
  const h=run.hero, oldMax = h.st ? h.st.maxHp : 0;
  if (id==='potion'){ healHero(run, h.st.maxHp*0.45); run.ev.push({k:'perk', id}); return; }
  if (!h.perks[id]){ h.perks[id]=0; h.order.push(id); }
  h.perks[id]++;
  recalc(run);
  if (id==='vital') h.hp = Math.min(h.st.maxHp, h.hp+(h.st.maxHp-oldMax));
  if (id==='bulwark') h.shield = h.st.maxShield;
  run.ev.push({k:'perk', id});
}
function rollChoices(run){
  const h=run.hero, f=h.hp/h.st.maxHp;
  let pool = run.unlocked.map(id=>PERK[id]).filter(p=>(h.perks[p.id]||0)<perkMax(p,run.cap));
  if (!pool.length) pool=[PERK.potion];
  const out=[];
  for (let i=0;i<run.cards && pool.length;i++){
    const p = wpick(pool, q=>{
      if (q.id==='potion') return f<0.5 ? 9 : (f<0.8 ? 3 : 0.6);
      return PERK_RAR[q.r].w*(h.perks[q.id]?1.35:1);
    });
    out.push(p.id); pool = pool.filter(x=>x!==p);
  }
  return out;
}
const AUTO_PREF={edge:6, quick:5, vital:5, thirst:4, keen:3, hide:3, brutal:2, bulwark:2, feet:2, riposte:2};
function autoChoice(run){
  const h=run.hero, ch=run.choices, f=h.hp/h.st.maxHp;
  const pi=ch.indexOf('potion');
  if (pi>=0 && f<0.4) return pi;
  let best=0, bs=-1;
  ch.forEach((id,i)=>{
    if (id==='potion') return;
    let s=PERK[id].r*10+(h.perks[id]?3:0)+(AUTO_PREF[id]||0)+rnd()*2;
    if (id==='brutal' && h.st.crit>=25) s+=4;
    if (id==='vital' && f<0.6) s+=4;
    if (s>bs){ bs=s; best=i; }
  });
  return bs<0 ? 0 : best;
}
function choosePerk(run, i){
  if (run.phase!=='levelup' || !run.choices || run.choices[i]==null) return;
  applyPerk(run, run.choices[i]);
  run.pending--;
  if (run.pending>0) run.choices = rollChoices(run);
  else { run.choices=null; run.phase=run.prev; }
}
function rerollPerks(run){ if (run.phase==='levelup' && run.rerolls>0){ run.rerolls--; run.choices=rollChoices(run); return true; } return false; }

function mkEnemy(run, def, hpS, dmS, tier){
  const base = CRE[def.t], r0 = ROLES[def.role||base.role], c=run.ch;
  // elites and bosses use even stats so every land's boss is a fair fight
  const role = tier===2 ? {hp:1, dmg:1, int:1.9, tag:'Boss'} : tier===1 ? {hp:1, dmg:1, int:1.6, tag:'Elite', armored:r0.armored} : r0;
  const tm = tier===2 ? {hp:BAL.BOSS_HP, dmg:BAL.BOSS_DMG, gold:25, xp:10} : tier===1 ? {hp:BAL.ELITE_HP, dmg:BAL.ELITE_DMG, gold:6, xp:4} : {hp:1, dmg:1, gold:1, xp:1};
  const hp = hpS*role.hp*tm.hp;
  return {id:run.nextId++, t:def.t, c:def.c||base.c, n:def.n||base.n, tag:role.tag, tier, hp, maxHp:hp,
    dmg:dmS*role.dmg*tm.dmg, int:role.int*(tier?1.1:1), atkT:0.9+rnd()*role.int*0.8,
    ranged:!!role.ranged, armored:!!role.armored, healer:!!role.healer, healT:3+rnd(),
    burn:null, frozen:0, touched:false,
    gold:BAL.GOLD_BASE*Math.pow(BAL.GOLD_G,c-1)*tm.gold*(0.8+rnd()*0.4), xp:BAL.XP_BASE*tm.xp};
}
function spawnWave(run){
  run.wave++;
  const c=run.ch, w=run.wave, th=themeOf(c);
  const hpS = BAL.E_HP*Math.pow(BAL.HPG,c-1)*(1+BAL.W_HP*(w-1));
  const dmS = BAL.E_DMG*Math.pow(BAL.DMG_G,c-1)*(1+BAL.W_DMG*(w-1));
  const plan = WAVE_PLAN[w-1];
  const isBack = d => { const r=ROLES[d.role||CRE[d.t].role]; return r.ranged||r.healer; };
  const pickN = n => {
    const out=[]; let back=0, heal=0;
    for (let i=0;i<n;i++){
      let d, tries=0;
      do { d = th.pool[Math.floor(rnd()*th.pool.length)]; tries++; }
      while (tries<12 && ((isBack(d) && back>=Math.max(1,Math.floor(n/2))) || (ROLES[d.role||CRE[d.t].role].healer && heal>=1) || (isBack(d) && n===1)));
      if (isBack(d)) back++; if (ROLES[d.role||CRE[d.t].role].healer) heal++;
      out.push(d);
    }
    out.sort((a,b)=>(isBack(a)?1:0)-(isBack(b)?1:0));
    return out.map(d=>mkEnemy(run,d,hpS,dmS,0));
  };
  let list;
  if (plan==='E') list = [mkEnemy(run,th.elite,hpS,dmS,1)].concat(pickN(2));
  else if (plan==='B') list = pickN(2).concat([mkEnemy(run,th.boss,hpS,dmS,2)]);
  else list = pickN(plan);
  run.enemies = list;
  run.ev.push({k:'wave', w, boss:plan==='B', elite:plan==='E'});
}

function healHero(run, v){
  const h=run.hero; if (h.hp<=0) return;
  const b=h.hp; h.hp=Math.min(h.st.maxHp, h.hp+v);
  if (h.hp-b>=1) run.ev.push({k:'heal', v:h.hp-b});
}
function gainXp(run, x){
  const h=run.hero; h.xp += x*h.st.xpM;
  while (h.xp>=h.need){ h.xp-=h.need; h.lvl++; h.need=xpNeed(h.lvl); run.pending++; }
}
function killEnemy(run, e){
  const i=run.enemies.indexOf(e); if (i<0) return;
  run.enemies.splice(i,1);
  const h=run.hero, st=h.st, p=h.perks;
  run.kills++;
  const g=e.gold*st.goldM; run.gold+=g;
  run.ev.push({k:'kill', id:e.id, gold:g, tier:e.tier});
  if (e.tier===1) run.gems+=2; else if (e.tier===2) run.gems+=5;
  if (p.harvest) healHero(run, st.maxHp*(0.02+0.01*p.harvest));
  if (p.trance && h.stacks<20){ h.stacks++; recalc(run); }
  const dc=(e.tier===2?1:(e.tier===1?0.5:0.035))*(1+0.5*(p.lucky||0))*run.m.dropM;
  if (rnd()<dc){ const it=rollLoot(run.ch, e.tier, 0); run.loot.push(it); run.ev.push({k:'drop', id:e.id, rar:it.rar}); }
  gainXp(run, e.xp);
}
function hurtEnemy(run, e, dmg, crit, src){
  e.hp-=dmg;
  run.ev.push({k:'dmg', id:e.id, v:dmg, crit, src});
  const l=run.hero.perks.exec||0;
  if (e.hp>0 && l && e.tier<2 && e.hp/e.maxHp<0.08+0.04*l){ e.hp=0; run.ev.push({k:'exec', id:e.id}); }
  if (e.hp<=0) killEnemy(run,e);
}
function dealHit(run, e, mult, f){
  if (!e || e.hp<=0) return 0;
  const h=run.hero, st=h.st, p=h.perks, R=run.rel; f=f||{};
  let dmg = st.dmg*mult*(0.9+rnd()*0.2)*berserkMult(run), crit=false;
  if (!f.noCrit && ((f.basic && h.sure) || rnd()*100<st.crit)){ crit=true; dmg*=st.critF/100; }
  if (f.basic) h.sure=false;
  if (f.basic && p.first && !e.touched) dmg*=1+p.first;
  if (f.basic) e.touched=true;
  if (p.giant && e.tier>0) dmg*=1+0.25*p.giant;
  if (R.bane && e.tier>0) dmg*=1.25+0.15*R.bane;
  if (R.coal && e.burn) dmg*=1.15+0.10*R.coal;
  if (p.exec && e.tier===2 && e.hp/e.maxHp<0.08+0.04*p.exec) dmg*=1.5;
  if (e.armored) dmg*=0.7;
  hurtEnemy(run, e, dmg, crit, f.src||'hit');
  if (f.basic){
    if (st.ls>0 && rnd()*100<st.ls) healHero(run, Math.min(dmg*0.3, st.maxHp*0.15)*(R.tooth?1.4+0.2*R.tooth:1));
    if (p.burn && e.hp>0) e.burn={dps:st.dmg*(0.15+0.10*p.burn), t:3, acc:e.burn?e.burn.acc:0};
  }
  return dmg;
}
function heroAttack(run, second){
  const h=run.hero, p=h.perks, R=run.rel, e=run.enemies[0]; if (!e) return;
  h.hits++;
  run.ev.push({k:'hatk'});
  const rest=run.enemies.slice(1);
  dealHit(run, e, 1, {basic:true});
  if (p.cleave && rest.length){
    const m=(0.30+0.15*p.cleave)*(R.arc?1+0.15*R.arc:1);
    for (const x of (R.arc?rest:rest.slice(0,1))) if (x.hp>0) dealHit(run, x, m, {src:'cleave'});
  }
  if (p.whirl && h.hits%4===0 && run.enemies.length){ run.ev.push({k:'whirl'}); for (const x of run.enemies.slice()) dealHit(run, x, 0.5+0.2*p.whirl, {src:'whirl'}); }
  if (!second && p.double && rnd()<0.10+0.08*p.double) h.queue.push(0.16);
}
function enemyAttack(run, e){
  const h=run.hero, st=h.st, p=h.perks, R=run.rel;
  run.ev.push({k:'eatk', id:e.id, ranged:e.ranged});
  if (rnd()*100<st.eva){ run.ev.push({k:'dodge'}); if (R.cloak) h.sure=true; return; }
  let dmg=e.dmg*(0.9+rnd()*0.2)*(1-st.def/100); const total=dmg; let blocked=0;
  if (h.shield>0){ blocked=Math.min(h.shield,dmg); h.shield-=blocked; dmg-=blocked; }
  h.hp-=dmg;
  run.ev.push({k:'hdmg', v:total, blocked});
  if (h.hp<=0){
    const l=p.revive||0; let back=0;
    if (l && !h.revived){ h.revived=true; back=Math.min(1,0.2+0.2*l); }
    else if (R.candle && !h.candle){ h.candle=true; back=0.2+0.1*R.candle; }
    if (back){
      h.hp=st.maxHp*back; h.shield=st.maxShield;
      for (const x of run.enemies) x.frozen=Math.max(x.frozen,1.5);
      run.ev.push({k:'revive'});
    } else { h.hp=0; run.over='dead'; run.ev.push({k:'dead'}); return; }
  }
  const mm=R.mirror?1.6+0.35*R.mirror:1;
  if (p.thorns && e.hp>0) dealHit(run, e, 0.4*p.thorns*mm, {noCrit:true, src:'thorn'});
  if (e.hp>0 && rnd()*100<st.counter){ run.ev.push({k:'counter'}); dealHit(run, e, mm, {src:'counter'}); }
}

function stepRun(run, dt){
  if (run.over || run.phase==='levelup') return;
  const h=run.hero, p=h.perks, R=run.rel;
  if (run.pending>0){ run.prev=run.phase; run.phase='levelup'; run.choices=rollChoices(run); run.ev.push({k:'lvl'}); return; }
  run.time+=dt;
  let st=h.st;
  if (p.regen && h.hp<st.maxHp) h.hp=Math.min(st.maxHp, h.hp+st.maxHp*0.006*p.regen*dt);
  if (run.phase==='walk'){
    run.walkT-=dt;
    if (run.walkT<=0){ spawnWave(run); run.phase='fight'; }
    return;
  }
  if (R.core && h.shield<st.maxShield) h.shield=Math.min(st.maxShield, h.shield+st.maxShield*(0.02+0.01*R.core)*dt);
  // skills on timers
  if (p.storm){ h.cd.storm-=dt; if (h.cd.storm<=0 && run.enemies.length){ h.cd.storm=4.5*run.cdM;
    const pool=run.enemies.slice(), tg=[], cap=R.crown?99:3; while (tg.length<cap && pool.length) tg.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
    run.ev.push({k:'bolt', ids:tg.map(e=>e.id)}); for (const e of tg) dealHit(run, e, (0.8+0.4*p.storm)*(R.crown?1+0.2*R.crown:1), {src:'bolt'}); } }
  if (p.beam){ h.cd.beam-=dt; if (h.cd.beam<=0 && run.enemies.length){ h.cd.beam=7*run.cdM;
    let t=run.enemies[0]; for (const e of run.enemies) if (e.hp>t.hp) t=e;
    run.ev.push({k:'beam', id:t.id}); dealHit(run, t, 2+p.beam, {src:'beam'}); } }
  if (p.frost){ h.cd.frost-=dt; if (h.cd.frost<=0 && run.enemies.length){ h.cd.frost=9*run.cdM;
    run.ev.push({k:'nova'});
    for (const e of run.enemies.slice()){ e.frozen=Math.max(e.frozen,Math.min(3,1+0.5*p.frost)*(e.tier===2?0.5:1)); dealHit(run, e, 0.6, {src:'nova'}); } } }
  // hero attacks
  h.atkT+=dt*h.st.aspd;
  let guard=0;
  while (h.atkT>=1 && run.enemies.length && guard++<6){ h.atkT-=1; heroAttack(run,false); }
  if (h.queue.length){ for (let i=h.queue.length-1;i>=0;i--){ h.queue[i]-=dt; if (h.queue[i]<=0){ h.queue.splice(i,1); heroAttack(run,true); } } }
  // enemies
  for (const e of run.enemies.slice()){
    if (e.hp<=0) continue;
    if (e.burn){ e.burn.t-=dt; e.burn.acc+=dt;
      if (e.burn.acc>=0.5){ e.burn.acc-=0.5; hurtEnemy(run, e, e.burn.dps*0.5*(e.armored?0.7:1), false, 'burn'); }
      if (e.burn && e.burn.t<=0) e.burn=null; }
    if (e.hp<=0) continue;
    if (e.frozen>0){ e.frozen-=dt; continue; }
    if (e.healer){ e.healT-=dt; if (e.healT<=0){ e.healT=3.5;
      let t=null; for (const x of run.enemies) if (x.hp<x.maxHp*0.98 && (!t || x.hp/x.maxHp<t.hp/t.maxHp)) t=x;
      if (t){ const v=t.maxHp*(t.tier===2?0.04:(t.tier===1?0.07:0.14)); t.hp=Math.min(t.maxHp,t.hp+v); run.ev.push({k:'eheal', id:t.id, from:e.id, v}); } } }
    {
      // the front enemy and ranged ones fight at full pace; the rest reach past at a slower rate
      e.atkT-=dt*((e===run.enemies[0] || e.ranged) ? 1 : BAL.BACK_RATE);
      if (e.atkT<=0){ e.atkT+=e.int; enemyAttack(run,e); if (run.over) return; }
    }
  }
  if (!run.enemies.length){
    h.queue.length=0;
    if (run.wave>=run.waves){ run.over='won'; run.ev.push({k:'won'}); }
    else { run.phase='walk'; run.walkT=1.0; h.shield=h.st.maxShield; h.atkT=Math.min(h.atkT,0.6); run.ev.push({k:'clear'}); }
  }
}

function finishRun(S, run){
  const won=run.over==='won', c=run.ch, st=run.hero.st;
  let gold=run.gold, gems=run.gems, relic=null;
  const first = won && !(S.best[c]>=99), ever = won && c>S.top;
  if (won){
    gold+=60*Math.pow(BAL.GOLD_G,c-1)*st.goldM; gems+=ever?100:(first?30:15);
    run.loot.push(rollLoot(c,2,first?1:0));
    // a relic the first time each even chapter from 4 up is cleared; otherwise a small chance near your furthest chapter
    if (c>=4 && c%2===0 && c>S.relicCh){ S.relicCh=c; relic=grantRelic(S); }
    else if (c>=4 && c>=S.top-3 && rnd()<0.1) relic=grantRelic(S);
    S.chapter=Math.max(S.chapter,c+1); S.best[c]=99; S.jtop=Math.max(S.jtop,c); S.top=Math.max(S.top,c);
  } else S.best[c]=Math.max(S.best[c]||0, run.wave);
  gold=Math.round(gold);
  S.gold+=gold; S.gems+=gems; S.runs++; S.kills+=run.kills;
  const items=run.loot.map(l=>addItem(S,l.slot,l.rar,1));
  const sold=trimBag(S);
  return {won, first, ever, gold, gems, items, sold, relic, wave:run.wave, kills:run.kills, lvl:run.hero.lvl, ch:c};
}

/* ---------- scenery ---------- */
function drawProp(th,x,y,s,i){

    C.fillStyle=shade(th.dirt,-0.1); C.fillRect(x-3*s,y-26*s,6*s,26*s);
    C.fillStyle=c; C.beginPath(); C.arc(x,y-34*s,15*s,0,TAU); C.arc(x-11*s,y-26*s,10*s,0,TAU); C.arc(x+11*s,y-27*s,11*s,0,TAU); C.fill();
    C.fillStyle=shade(c,0.18); C.beginPath(); C.arc(x-4*s,y-38*s,7*s,0,TAU); C.fill();
  } else if (k==='pine'){
    C.fillStyle=shade(th.dirt,-0.2); C.fillRect(x-2.5*s,y-12*s,5*s,12*s);
    C.fillStyle=c;
    for (let j=0;j<3;j++){ const w=(17-j*4)*s, yy=y-(10+j*14)*s; C.beginPath(); C.moveTo(x-w,yy); C.lineTo(x,yy-22*s); C.lineTo(x+w,yy); C.fill(); }
  } else if (k==='dead'){

    C.beginPath(); C.moveTo(x,y); C.lineTo(x+2*s,y-34*s); C.moveTo(x+1*s,y-20*s); C.lineTo(x-13*s,y-34*s); C.moveTo(x+2*s,y-27*s); C.lineTo(x+14*s,y-41*s); C.moveTo(x-8*s,y-29*s); C.lineTo(x-9*s,y-40*s); C.stroke();
  } else if (k==='rock'){
    C.fillStyle=c; C.beginPath(); C.moveTo(x-18*s,y); C.lineTo(x-13*s,y-17*s); C.lineTo(x-2*s,y-25*s); C.lineTo(x+12*s,y-19*s); C.lineTo(x+19*s,y); C.fill();
    C.fillStyle=shade(c,0.15); C.beginPath(); C.moveTo(x-13*s,y-17*s); C.lineTo(x-2*s,y-25*s); C.lineTo(x+1*s,y-11*s); C.fill();
    if (th.glow){ C.strokeStyle=th.glow; C.lineWidth=1.5; C.beginPath(); C.moveTo(x+3*s,y-20*s); C.lineTo(x+6*s,y-10*s); C.lineTo(x+2*s,y-2*s); C.stroke(); }
  } else if (k==='cactus'){

    C.rect(x-4*s,y-34*s,8*s,34*s); C.rect(x-14*s,y-22*s,6*s,12*s); C.rect(x-14*s,y-14*s,12*s,5*s); C.rect(x+8*s,y-27*s,6*s,12*s); C.rect(x+2*s,y-19*s,12*s,5*s); C.fill();
  } else if (k==='crystal'){
    C.globalAlpha=0.9;
    for (let j=0;j<3;j++){ const dx=(j-1)*9*s, h=(26-Math.abs(j-1)*9+hash(i+j)*8)*s; C.fillStyle=shade(c,j*0.18-0.1);
      C.beginPath(); C.moveTo(x+dx-5*s,y); C.lineTo(x+dx-3*s,y-h*0.8); C.lineTo(x+dx+1*s,y-h); C.lineTo(x+dx+5*s,y-h*0.75); C.lineTo(x+dx+6*s,y); C.fill(); }
    C.globalAlpha=1;
  } else if (k==='pillar'){
    const h=(30+hash(i+3)*26)*s;
    C.fillStyle=c; C.fillRect(x-7*s,y-h,14*s,h);
    C.fillStyle=shade(c,0.14); C.fillRect(x-7*s,y-h,4*s,h); C.fillRect(x-10*s,y-h-4*s,20*s,5*s);
    C.fillStyle=shade(c,-0.25); C.fillRect(x-10*s,y-4*s,20*s,4*s);
  }
}
function drawBg(th,scroll,W,H,gy){
  const g=C.createLinearGradient(0,0,0,gy); g.addColorStop(0,th.sky[0]); g.addColorStop(1,th.sky[1]);
  C.fillStyle=g; C.fillRect(-8,-8,W+16,gy+10);
  if (th.orb){ C.globalAlpha=0.9; C.fillStyle=th.orb; C.beginPath(); C.arc(W*0.78,Math.max(26,gy*0.24),15,0,TAU); C.fill(); C.globalAlpha=1; }
  if (!th.cave){
    C.fillStyle=shade(th.sky[1].length===7?th.sky[1]:'#ffffff',0.35); C.globalAlpha=0.5;
    const cs=150, co=scroll*0.06, c0=Math.floor(co/cs)-1;
    for (let i=c0;i<c0+5;i++){ const x=i*cs-co+hash(i+40)*70, y=gy*(0.34+hash(i+41)*0.3), r=9+hash(i+42)*7;
      C.beginPath(); C.ellipse(x,y,r*2.2,r*0.8,0,0,TAU); C.ellipse(x-r*0.9,y-r*0.5,r,r*0.8,0,0,TAU); C.ellipse(x+r*0.7,y-r*0.7,r*1.2,r,0,0,TAU); C.fill(); }
    C.globalAlpha=1;
  }
  C.fillStyle=th.far; C.beginPath(); C.moveTo(-8,gy);
  for (let x=-8;x<=W+12;x+=10){ const wx=x+scroll*0.15; C.lineTo(x,gy-36-18*Math.sin(wx*0.018)-10*Math.sin(wx*0.047+1.3)); }
  C.lineTo(W+8,gy); C.fill();
  if (th.cave){
    C.fillStyle=th.far; C.fillRect(-8,-8,W+16,22);
    const sp=34, off=scroll*0.3, i0=Math.floor(off/sp)-1;
    C.beginPath();
    for (let i=i0;i<i0+14;i++){ const x=i*sp-off, h=10+hash(i)*26; C.moveTo(x-9,13); C.lineTo(x,14+h); C.lineTo(x+9,13); }
    C.fill();
  }
  const sp=74, off=scroll*0.5, i0=Math.floor(off/sp)-1;

  C.lineTo(W+8,gy); C.fill();
  for (let i=i0;i<i0+8;i++) drawProp(th, i*sp-off+hash(i)*34, gy-4, 0.95+hash(i+7)*0.7, i);
  // ground, road, foreground
  C.fillStyle=th.grass; C.fillRect(-8,gy-9,W+16,H-gy+18);
  C.fillStyle=th.road; C.fillRect(-8,gy-5,W+16,24);
  C.fillStyle=shade(th.road,-0.22); C.fillRect(-8,gy-5,W+16,1.5); C.fillRect(-8,gy+19,W+16,2);
  const ps=46, po=scroll, j0=Math.floor(po/ps)-1;
  for (let j=j0;j<j0+11;j++){
    const x=j*ps-po+hash(j+50)*30;
    C.fillStyle=shade(th.road,-0.14); C.beginPath(); C.ellipse(x,gy+3+hash(j+9)*12,3+hash(j)*3,1.6,0,0,TAU); C.fill();
    C.fillStyle=shade(th.grass,-0.16); C.beginPath(); const fy=gy+30+hash(j+21)*Math.max(8,H-gy-40);
    C.moveTo(x+12,fy); C.lineTo(x+15,fy-7); C.lineTo(x+17,fy-1); C.lineTo(x+20,fy-9); C.lineTo(x+23,fy); C.fill();
    if (th.glow){ C.strokeStyle=th.glow; C.lineWidth=1.4; C.globalAlpha=0.7; C.beginPath(); C.moveTo(x-6,fy+4); C.lineTo(x+2,fy+8); C.lineTo(x+9,fy+5); C.stroke(); C.globalAlpha=1; }
  }
  if (H-gy>56){

    C.fillStyle=shade(th.grass,-0.36);
    for (let k=k0;k<k0+6;k++){ const x=k*bs-bo+hash(k+90)*60, r=18+hash(k+33)*12;
      C.beginPath(); C.ellipse(x,H+5,r*1.5,r,0,0,TAU); C.ellipse(x+r*1.2,H+7,r,r*0.7,0,0,TAU); C.ellipse(x-r*1.1,H+8,r*0.9,r*0.6,0,0,TAU); C.fill(); }
  }
}

/* ---------- battle scene ---------- */
function sizeCanvas(cv, logicalW){
  const box=cv.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,3);
  const w=Math.max(1,Math.round(box.width*dpr)), h=Math.max(1,Math.round(box.height*dpr));
  if (cv.width!==w || cv.height!==h){ cv.width=w; cv.height=h; }
  const sc=w/logicalW; return {sc, W:logicalW, H:h/sc};
}
function resizeScene(){
  if (!R.cv) return;
  const m=sizeCanvas(R.cv,320); R.sc=m.sc; R.W=m.W; R.H=m.H; R.gy=Math.round(Math.min(R.H*0.78,R.H-48));
}
function resetScene(){ R.sprites={}; R.fx=[]; R.texts=[]; R.hero.atk=0; R.hero.hit=0; R.shake=0; R.scroll=Math.random()*400; }
function floatText(x,y,txt,c,size){ if (R.texts.length>40) R.texts.shift(); R.texts.push({x:x+(Math.random()-0.5)*10,y,txt,c,size:size||11,t:0}); }
function spriteY(sp){ return R.gy; }

function sceneEvents(run){
  const gy=R.gy;
  for (const ev of run.ev){
    const sp=ev.id!=null?R.sprites[ev.id]:null;
    switch(ev.k){
      case 'dmg': if (sp){ sp.hit=1;
          const col=ev.crit?'#ffd23a':(ev.src==='burn'?'#ff9a4a':(ev.src==='bolt'?'#bfe6ff':'#ffffff'));
          floatText(sp.x, gy-creatureTop(sp.spec)*sp.s-4, fmt(Math.max(1,ev.v))+(ev.crit?'!':''), col, ev.crit?15:11);
          if (ev.src==='hit'||ev.src==='counter'||ev.src==='cleave') R.fx.push({k:'spark',x:sp.x-8*sp.s,y:gy-20*sp.s,t:0,d:0.16});
          if (ev.crit) sfx('crit'); } break;
      case 'hatk': R.hero.atk=1; sfx('hit'); break;
      case 'eatk': if (sp){ sp.atk=1; if (ev.ranged) R.fx.push({k:'shot',x0:sp.x-12,y0:gy-22*sp.s,t:0,d:0.2,c:sp.spec.c}); } break;
      case 'hdmg': R.hero.hit=1; if (!R.reduce) R.shake=0.22; floatText(HERO_X,gy-52,'-'+fmt(Math.max(1,ev.v)),ev.blocked>=ev.v?'#8fd0ff':'#ff7a66',12); sfx('hurt'); break;
      case 'dodge': floatText(HERO_X,gy-52,'Miss','#dfe8e4',11); break;
      case 'counter': floatText(HERO_X+18,gy-64,'Counter','#ffe9a8',10); break;
      case 'heal': floatText(HERO_X-16,gy-46,'+'+fmt(ev.v),'#74e08c',11); break;
      case 'eheal': if (sp) floatText(sp.x,gy-creatureTop(sp.spec)*sp.s-6,'+'+fmt(ev.v),'#74e08c',10); break;
      case 'kill': if (sp){ sp.dead=0.001; floatText(sp.x,gy-14,'+'+fmt(Math.max(1,ev.gold)),'#ffd23a',10); } sfx('coin'); break;
      case 'exec': if (sp) floatText(sp.x,gy-creatureTop(sp.spec)*sp.s-16,'Finished','#ff7a66',10); break;
      case 'drop': if (sp) R.fx.push({k:'loot',x:sp.x,y:gy-18,t:0,d:0.9,c:RAR[ev.rar].c}); sfx('loot'); break;
      case 'bolt': for (const id of ev.ids){ const s2=R.sprites[id]; if (s2) R.fx.push({k:'bolt',x:s2.x,y:gy-18*s2.s,t:0,d:0.28,seed:Math.random()*99}); } sfx('zap'); break;
      case 'beam': if (sp) R.fx.push({k:'beam',x:sp.x,t:0,d:0.5}); sfx('zap'); break;
      case 'nova': R.fx.push({k:'nova',t:0,d:0.6}); sfx('zap'); break;
      case 'whirl': R.fx.push({k:'whirl',t:0,d:0.32}); break;
      case 'lvl': R.fx.push({k:'ring',t:0,d:0.7}); sfx('lvl'); break;
      case 'revive': R.fx.push({k:'ring',t:0,d:0.9}); floatText(HERO_X,gy-70,'Second wind','#ffe9a8',13); sfx('lvl'); break;
      case 'wave': onWaveStart(ev); break;
      case 'won': sfx('win'); break;
      case 'dead': sfx('lose'); break;
    }
  }
  run.ev.length=0;
}

function drawBattle(run, dt, speed){
  const ctx=R.ctx; C=ctx; R.t+=dt;
  const W=R.W, H=R.H, gy=R.gy, th=themeOf(run.ch), adt=dt*speed;
  ctx.setTransform(R.sc,0,0,R.sc,0,0);
  ctx.save();
  if (R.shake>0){ R.shake-=dt; ctx.translate((Math.random()-0.5)*5*R.shake/0.22,(Math.random()-0.5)*4*R.shake/0.22); }
  drawBg(th,R.scroll,W,H,gy);

  // place sprites for living enemies
  let x=122, prev=null;
  run.enemies.forEach((e,i)=>{
    const s=e.tier===2?1.75:(e.tier===1?1.3:1);
    if (i>0) x+=21*(prev+s)+1; prev=s;
    let sp=R.sprites[e.id];
    if (!sp) sp=R.sprites[e.id]={id:e.id,x:W+34+i*34,tx:x,s,e,spec:Object.assign({},CRE[e.t],{c:e.c}),atk:0,hit:0,dead:0,ph:Math.random()*6};
    sp.tx=x; sp.live=true;
  });
  sceneEvents(run);
  const h=R.hero; h.atk=Math.max(0,h.atk-adt/0.26); h.hit=Math.max(0,h.hit-adt/0.22);

  // hero
  const walking=run.phase==='walk' && !run.over;
  const hs=run.hero.st, dead=run.over==='dead';
  drawCreature(Object.assign({wc:R.wc},HERO_SPEC),{x:HERO_X,y:gy,s:1.12,t:R.t*(walking?speed:1),atk:h.atk,hit:h.hit,walk:walking,flip:true,alpha:dead?0.35:1});
  // enemies, back to front
  const list=Object.values(R.sprites).sort((a,b)=>b.x-a.x);
  for (const sp of list){
    if (!sp.live && !sp.dead) sp.dead=0.001;
    sp.live=false;
    if (sp.dead){ sp.dead+=adt; if (sp.dead>0.4){ delete R.sprites[sp.id]; continue; } }
    else sp.x+=(sp.tx-sp.x)*Math.min(1,adt*7);
    sp.atk=Math.max(0,sp.atk-adt/0.3); sp.hit=Math.max(0,sp.hit-adt/0.2);
    const e=sp.e, a=sp.dead?1-sp.dead/0.4:1;
    drawCreature(sp.spec,{x:sp.x,y:gy+(sp.dead?sp.dead*14:0),s:sp.s,t:R.t,ph:sp.ph,atk:sp.atk,hit:sp.hit,alpha:a,tier:e.tier,frozen:!sp.dead&&e.frozen>0,burn:!sp.dead&&!!e.burn});
    if (!sp.dead){
      const bw=Math.round(30*Math.pow(sp.s,0.8)), bx=sp.x-bw/2, by=gy+9, f=clamp(e.hp/e.maxHp,0,1);
      C.fillStyle='rgba(12,22,18,.85)'; C.fillRect(bx-1,by-1,bw+2,11);
      C.fillStyle=e.tier===2?'#c0392b':(e.tier===1?'#d9822b':'#d94a3a'); C.fillRect(bx,by,bw*f,9);
      C.fillStyle='#fff'; C.font='700 8px '+FONT; C.textAlign='center'; C.textBaseline='middle'; C.fillText(fmt(Math.ceil(e.hp)),sp.x,by+5);
    }
  }
  // hero bar
  { const bw=38, bx=HERO_X-bw/2, by=gy+9, f=clamp(run.hero.hp/hs.maxHp,0,1);
    C.fillStyle='rgba(12,22,18,.85)'; C.fillRect(bx-1,by-1,bw+2,11+(hs.maxShield>0?4:0));
    C.fillStyle='#4fbf6b'; C.fillRect(bx,by,bw*f,9);
    if (hs.maxShield>0){ C.fillStyle='#59b9ea'; C.fillRect(bx,by+10,bw*clamp(run.hero.shield/hs.maxShield,0,1),3); }
    C.fillStyle='#fff'; C.font='700 8px '+FONT; C.textAlign='center'; C.textBaseline='middle'; C.fillText(fmt(Math.min(Math.round(hs.maxHp),Math.ceil(run.hero.hp))),HERO_X,by+5); }

  // effects
  for (let i=R.fx.length-1;i>=0;i--){
    const f=R.fx[i]; f.t+=adt; const p=f.t/f.d;
    if (p>=1){ R.fx.splice(i,1); continue; }
    C.save();
    if (f.k==='spark'){ C.strokeStyle='#fff'; C.lineWidth=2; C.globalAlpha=1-p; const r=4+p*10; for (let j=0;j<5;j++){ const a=j*1.257+0.4; line(f.x+Math.cos(a)*r*0.4,f.y+Math.sin(a)*r*0.4,f.x+Math.cos(a)*r,f.y+Math.sin(a)*r); } }
    else if (f.k==='shot'){ const px=f.x0+(HERO_X+10-f.x0)*p, py=f.y0+(gy-24-f.y0)*p-Math.sin(p*Math.PI)*10; C.fillStyle=f.c; C.strokeStyle=INK; C.lineWidth=1.2; C.beginPath(); C.arc(px,py,3.5,0,TAU); C.fill(); C.stroke(); }
    else if (f.k==='bolt'){
      const flick=Math.floor(f.t/0.05); C.globalAlpha=1-p*0.7; C.lineJoin='round';
      C.beginPath(); let bx=f.x+(hash(f.seed)-0.5)*50, n=7; C.moveTo(bx,-6);
      for (let j=1;j<=n;j++){ const yy=-6+(f.y+6)*j/n, xx=j===n?f.x:bx+(f.x-bx)*j/n+(hash(f.seed+j*3.1+flick)-0.5)*22; C.lineTo(xx,yy); }
      C.strokeStyle='rgba(120,200,255,.55)'; C.lineWidth=7; C.stroke(); C.strokeStyle='#ffffff'; C.lineWidth=2.2; C.stroke();
      C.fillStyle='rgba(200,235,255,.6)'; C.beginPath(); C.arc(f.x,f.y,12*(1-p),0,TAU); C.fill();
    }
    else if (f.k==='beam'){
      const w=26*(1-p*p); C.globalAlpha=1-p*0.6;
      const g=C.createLinearGradient(f.x-w,0,f.x+w,0); g.addColorStop(0,'rgba(255,216,107,0)'); g.addColorStop(0.35,'rgba(255,216,107,.85)'); g.addColorStop(0.5,'#fff'); g.addColorStop(0.65,'rgba(255,216,107,.85)'); g.addColorStop(1,'rgba(255,216,107,0)');
      C.fillStyle=g; C.fillRect(f.x-w,-8,w*2,gy+10);
      C.fillStyle='rgba(255,240,190,.7)'; C.beginPath(); C.ellipse(f.x,gy,w*1.3,7,0,0,TAU); C.fill();
    }
    else if (f.k==='nova'){ C.globalAlpha=1-p; C.strokeStyle='#bfeaff'; C.lineWidth=5; C.beginPath(); C.ellipse(HERO_X,gy-10,20+p*300,8+p*70,0,0,TAU); C.stroke(); C.fillStyle='rgba(190,234,255,.12)'; C.fill(); }
    else if (f.k==='whirl'){ C.globalAlpha=1-p; C.strokeStyle='#f0fff4'; C.lineWidth=4; C.beginPath(); C.ellipse(HERO_X+40+p*90,gy-18,30+p*110,10+p*16,0,-0.6+p*5,2.4+p*5); C.stroke(); }
    else if (f.k==='ring'){ C.globalAlpha=1-p; C.strokeStyle='#ffd23a'; C.lineWidth=3; C.beginPath(); C.ellipse(HERO_X,gy-22,10+p*44,10+p*44,0,0,TAU); C.stroke(); }
    else if (f.k==='loot'){ const yy=f.y-Math.sin(Math.min(1,p*1.6)*Math.PI)*26; C.globalAlpha=p>0.75?(1-p)*4:1; C.translate(f.x,yy); C.rotate(Math.PI/4); C.fillStyle=f.c; C.strokeStyle='#fff'; C.lineWidth=1.5; C.fillRect(-5,-5,10,10); C.strokeRect(-5,-5,10,10); }
    C.restore();
  }
  // slash arc on hero attack
  if (h.atk>0.35 && run.phase==='fight'){ C.save(); C.globalAlpha=(h.atk-0.35)*1.2; C.strokeStyle='#fff'; C.lineWidth=3; C.lineCap='round'; C.beginPath(); C.arc(HERO_X+22,gy-22,22,-1.0,0.9); C.stroke(); C.restore(); }
  // floating numbers
  C.textAlign='center'; C.textBaseline='middle'; C.lineJoin='round';
  for (let i=R.texts.length-1;i>=0;i--){
    const t=R.texts[i]; t.t+=dt; const p=t.t/0.75;
    if (p>=1){ R.texts.splice(i,1); continue; }
    const pop=p<0.15?0.7+p*2.4:1;
    C.globalAlpha=p>0.6?(1-p)/0.4:1; C.font=`700 ${t.size*pop}px ${FONT}`;
    C.lineWidth=3; C.strokeStyle='rgba(12,22,18,.9)'; C.strokeText(t.txt,t.x,t.y-p*24); C.fillStyle=t.c; C.fillText(t.txt,t.x,t.y-p*24);
  }
  C.globalAlpha=1;
  ctx.restore();
}

function fmt(n){
  n=Math.floor(n+1e-9); if (n<1000) return String(n);
  if (n>=1e36) return n.toExponential(2).replace('e+','e');
  const u=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc']; let i=-1;
  while (n>=1000 && i<u.length-1){ n/=1000; i++; }
  return (n<10?(Math.floor(n*100)/100).toFixed(2):(n<100?(Math.floor(n*10)/10).toFixed(1):String(Math.floor(n))))+u[i];
}
function mult(x){ return x<100 ? String(Math.round(x*100)/100) : fmt(x); }

/* ---------- saving ---------- */
/* Saves go to localStorage and to IndexedDB. Browsers can be slow to put localStorage on disk when it is
   written often, so writes are batched, flushed when the page is hidden, and the newer of the two copies wins on load. */
let saveRev=0, saveT=null, idb=null, lsOK=true;
function writeSave(){
  clearTimeout(saveT); saveT=null;
  if (!S) return;
  S.rev=++saveRev;
  const str=JSON.stringify(S);
  try{ localStorage.setItem(SAVE_KEY,str); lsOK=true; }catch(e){ lsOK=false; }
  if (idb){ try{ idb.transaction('kv','readwrite').objectStore('kv').put(str,'save'); }catch(e){} }
  storageOK=lsOK || !!idb;
}
function save(now){ if (!S) return; if (now){ writeSave(); return; } if (!saveT) saveT=setTimeout(writeSave,600); }
function idbOpen(){
  return new Promise(res=>{
    let done=false; const fin=()=>{ if (!done){ done=true; res(); } };
    try{
      const rq=indexedDB.open('roadbound',1);
      rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore('kv'); }catch(e){} };
      rq.onsuccess=()=>{ if (done){ try{ rq.result.close(); }catch(e){} return; } idb=rq.result; fin(); };
      rq.onerror=fin; rq.onblocked=fin;
    }catch(e){ fin(); }
    setTimeout(fin,1500);
  });
}
function idbGet(){
  return new Promise(res=>{
    if (!idb) return res(null);
    let done=false; const fin=v=>{ if (!done){ done=true; res(v); } };
    try{ const rq=idb.transaction('kv').objectStore('kv').get('save'); rq.onsuccess=()=>fin(rq.result||null); rq.onerror=()=>fin(null); }catch(e){ fin(null); }
    setTimeout(()=>fin(null),1500);
  });
}
function parseSave(str){ try{ const o=JSON.parse(str); return (o && Array.isArray(o.inv)) ? o : null; }catch(e){ return null; } }
async function load(){
  let a=null, b=null;
  try{ a=parseSave(localStorage.getItem(SAVE_KEY)); }catch(e){ lsOK=false; }
  await idbOpen(); b=parseSave(await idbGet());
  const pick=(a && b) ? ((b.rev||0)>(a.rev||0) ? b : a) : (a||b);
  saveRev=Math.max((a&&a.rev)||0, (b&&b.rev)||0);
  return pick ? sanitizeState(pick) : null;
}
function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importCode(code){
  try{ const o=JSON.parse(decodeURIComponent(escape(atob(code.replace(/\s+/g,''))))); if (!o || !Array.isArray(o.inv)) return false; S=sanitizeState(o); save(true); return true; }
  catch(e){ return false; }
}

/* ---------- sound ---------- */
let AC=null; const sfxLast={};
const SFX={hit:[210,90,0.05,'square',0.022], crit:[540,160,0.09,'square',0.035], hurt:[130,60,0.1,'sawtooth',0.03], coin:[900,1400,0.07,'sine',0.03],
  loot:[660,1320,0.18,'triangle',0.05], lvl:[440,990,0.28,'triangle',0.06], zap:[1300,220,0.12,'sawtooth',0.025], win:[523,1047,0.55,'triangle',0.07],
  lose:[280,70,0.55,'sawtooth',0.045], tap:[700,700,0.03,'sine',0.03]};
function sfx(k){
  if (!S || !S.sound) return;
  const now=performance.now(); if (now-(sfxLast[k]||0)<70) return; sfxLast[k]=now;
  try{
    if (!AC){ const A=window.AudioContext||window.webkitAudioContext; if (!A) return; AC=new A(); }
    if (AC.state==='suspended') AC.resume();
    const p=SFX[k], t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type=p[3]; o.frequency.setValueAtTime(p[0],t); o.frequency.exponentialRampToValueAtTime(p[1],t+p[2]);
    g.gain.setValueAtTime(p[4],t); g.gain.exponentialRampToValueAtTime(0.0001,t+p[2]);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+p[2]+0.02);
  }catch(e){}
}

function updateBattleUI(){

  setText('tSh',ms>0?`${fmt(Math.min(ms,Math.ceil(h.shield)))} / ${fmt(ms)}`:'No shield'); setW('bSh',st.maxShield>0?h.shield/st.maxShield:0);
  const d=st.dmg*berserkMult(run);
  const v=[[d<100?d.toFixed(1):fmt(d),d>m.atk*1.001],[pct(st.def),st.def>m.def],[st.aspd.toFixed(2)+'/s',st.aspd>m.aspd*1.001],[pct(st.counter),st.counter>m.counter],
           [pct(st.crit),st.crit>m.crit],[pct(st.eva),st.eva>m.eva],[pct(st.critF),st.critF>m.critF],[pct(st.ls),st.ls>m.ls]];
  for (let i=0;i<8;i++){ setText('sv'+i,v[i][0]); setCls('sc'+i,'buff',v[i][1]); }
  const rl=Object.keys(run.rel), sig=rl.join('')+'|'+h.order.map(id=>id+h.perks[id]).join(',');
  if (cache.perkSig!==sig){ cache.perkSig=sig;
    const a=rl.map(id=>`<span class="pk rl">${RELIC[id].ic}</span>`).join('')+h.order.map(id=>`<span class="pk r${PERK[id].r}">${PERK[id].ic}${h.perks[id]>1?`<i>${h.perks[id]}</i>`:''}</span>`).join('');
    $('perkRow').innerHTML=a||'<span class="hint">Perks you pick will show here</span>'; }
  const ph=run.phase==='levelup'?run.prev:run.phase, cleared=run.over==='won' || (ph==='walk' && run.wave>0);

function showEnd(res, fresh){
  const title=res.won?`Chapter ${res.ch} cleared`:(res.left?`Turned back at wave ${Math.max(1,res.wave)}`:`Fell at wave ${res.wave} of ${WAVE_PLAN.length}`);
  let sub;
  if (res.won) sub=res.first?'First clear of this journey. The next chapter is open, and you earned a bonus chest.':'Another clean run.';
  else if (hasBetterGear()) sub='There is better gear waiting in your bag.';
  else if (findForges(S).length) sub='You have enough spare gear to forge something stronger.';
  else if (S.jtop>=10) sub='Stuck here? Ascending from the Road tab turns this journey into permanent strength.';
  else sub='Train a talent or upgrade your gear, then try again.';
  const looping=S.loop>0 && !res.left, climb=S.loop===2 && res.won, nextCh=climb?Math.min(S.chapter,res.ch+1):res.ch;
  const lmsg=n=>climb?`Climbing to chapter ${nextCh} in ${n} second${n>1?'s':''}.`:`Setting out again in ${n} second${n>1?'s':''}.`;
  openModal(`<h2>${title}</h2><p>${sub}</p>
  <div class="rew"><span>🪙 +${fmt(res.gold)}</span>${res.gems?`<span>💎 +${res.gems}</span>`:''}<span>💀 ${res.kills}</span><span>Lv ${res.lvl}</span></div>
  ${res.relic?relicFoundHTML(res.relic):''}
  ${res.items.length?`<div class="loot">${res.items.map(lootTile).join('')}</div>`:''}
  ${res.sold.n?`<p>Bag was full, so ${res.sold.n} weaker piece${res.sold.n>1?'s were':' was'} sold for ${fmt(res.sold.gold)} gold.</p>`:''}
  ${looping?`<p id="loopMsg">${lmsg(3)}</p><div class="acts"><button class="btn" data-act="stopLoop">Stop repeating</button><button class="btn" data-act="camp">Back to camp</button></div>`
    :`<div class="acts">${res.won?'<button class="btn primary" data-act="next">Next chapter</button><button class="btn" data-act="again">Run it again</button>':'<button class="btn primary" data-act="again">Try again</button><button class="btn" data-act="camp">Back to camp</button>'}</div>
      ${res.won?'<div class="acts one"><button class="btn" data-act="camp">Back to camp</button></div>':''}`}`, true, !fresh);
  modalKind='end';
  if (looping && fresh){
    let n=3; const r=run;
    const tickLoop=()=>{ if (run!==r || !S.loop) return; n--; const el=$('loopMsg');
      if (n<=0){ startRun(nextCh); return; }
      if (el) el.textContent=lmsg(n);
      loopTimer=setTimeout(tickLoop,1000); };
    loopTimer=setTimeout(tickLoop,1000);
  }
}

  item(b){ openItem(+b.dataset.id); },
  emptySlot(b){ toast(`No ${SLOTS[b.dataset.slot].n.toLowerCase()} equipped. Pick one from your bag.`); },
  equip(){ const it=itemById(S,modalItem); if (!it) return; S.eq[it.slot]=it.id; save(); closeModal(); renderHome(); sfx('tap'); },
  unequip(){ const it=itemById(S,modalItem); if (!it) return; S.eq[it.slot]=null; save(); closeModal(); renderHome(); },
  upgrade(){ const it=itemById(S,modalItem); if (!it) return; const c=upCost(it); if (it.lvl>=maxLvl(it) || S.gold<c) return; S.gold-=c; it.lvl++; save(); renderHome(); openItem(it.id,true); sfx('coin'); },
  upgradeMax(){ const it=itemById(S,modalItem); if (!it) return; let n=0; while (it.lvl<maxLvl(it) && S.gold>=upCost(it)){ S.gold-=upCost(it); it.lvl++; n++; } if (n){ save(); renderHome(); openItem(it.id,true); toast(`Upgraded ${n} level${n>1?'s':''}`); sfx('coin'); } },
  sell(){ const it=itemById(S,modalItem); if (!it || isEquipped(S,it)) return; const v=sellVal(it); S.gold+=v; removeItem(S,it); save(); closeModal(); renderHome(); toast(`Sold for ${fmt(v)} gold`); sfx('coin'); },
  equipBest(){ const n=autoEquip(S); save(); closeModal(); renderHome(); toast(n?`Equipped ${n} better piece${n>1?'s':''}`:'You already wear your best gear'); },
  forge(){ openModal(forgeHTML()); modalKind='forge'; },
  forgeOne(b){ const it=forgeOne(S,b.dataset.slot,+b.dataset.rar,+b.dataset.st||0); if (it){ save(); renderHome(); openModal(forgeHTML(),false,true); modalKind='forge'; toast(`Forged: ${itemName(it)}`); sfx('loot'); } },
  forgeAll(){ const n=forgeAll(S); save(); renderHome(); openModal(forgeHTML(),false,true); modalKind='forge'; toast(`Forged ${n} time${n===1?'':'s'}`); sfx('loot'); },
  unlockPerk(b){ const p=PERK[b.dataset.id], c=perkUnlockCost(S,p); if (S.perks[p.id] || S.gold<c) return; S.gold-=c; S.perks[p.id]=1; save(); renderHome(); toast(`${p.n} unlocked`); sfx('lvl'); },
  trainAll(){ const n=trainAll(S); if (n){ save(); renderHome(); toast(`Trained ${n} level${n>1?'s':''}`); sfx('coin'); } else toast('Not enough gold for any talent yet'); },
  seg(b){ talSeg=b.dataset.seg; renderHome(true); },
  buyLegacy(b){ if (buyLegacy(S,b.dataset.id)){ save(); renderHome(); sfx('lvl'); } },
  ascendAsk(){ if (S.jtop<10) return; openModal(ascendHTML()); modalKind='ascend'; },
  ascendDo(){ const g=ascend(S,Date.now()); if (!g) return; save(true); closeModal(); tab='talents'; talSeg='legacy'; renderHome(true); toast(`Ascended with ${fmt(g)} waystones. Spend them here.`); sfx('win'); },
  bench(b){ if (toggleBench(S,b.dataset.id)){ save(); renderHome(); } else toast(`Keep at least ${MIN_POOL} perks in the pool`); },
  relics(){ openModal(relicsHTML()); modalKind='relics'; },
  relicToggle(b){ if (toggleRelic(S,b.dataset.id)){ save(); renderHome(); openModal(relicsHTML(),false,true); modalKind='relics'; sfx('tap'); } },
  relicCache(){ if (S.gems<200) return; S.gems-=200; const r=grantRelic(S); save(); renderHome(); openModal(`<h2>Relic cache</h2>${relicFoundHTML(r)}<div class="acts"><button class="btn" data-act="relics">Open relics</button><button class="btn primary" data-act="close">Done</button></div>`); sfx('loot'); },
  train(b){ const t=TALENTS.find(x=>x.id===b.dataset.id), l=S.talents[t.id]||0, c=talentCost(t,l); if (l>=t.max || S.gold<c) return; S.gold-=c; S.talents[t.id]=l+1; save(); renderHome(); sfx('coin'); },
  gift(){ const g=claimGift(S,Date.now()); if (g){ save(); renderHome(); toast(`Supply drop: ${g.gems} gems and ${fmt(g.gold)} gold`); sfx('loot'); } },
  crate(){ const c=crateCost(S); if (S.gold<c) return; S.gold-=c; showLoot("Traveler's crate",[rollLoot(S.chapter,0,0)]); },
  royal(){ if (S.gems<120) return; S.gems-=120; showLoot('Royal chest',[rollLoot(S.chapter,3,1)]); },
  hoard(){ if (S.gems<1080) return; S.gems-=1080; const l=[]; for (let i=0;i<9;i++) l.push(rollLoot(S.chapter,3,1)); l.push(rollLoot(S.chapter,3,3)); showLoot('Royal hoard',l); },
  pouch(){ if (S.gems<50) return; S.gems-=50; const g=pouchGold(S); S.gold+=g; save(); renderHome(); toast(`Got ${fmt(g)} gold`); sfx('coin'); },
  settings(){ openModal(settingsHTML()); modalKind='settings'; },
  help(){ openModal(helpHTML(false)); modalKind='help'; },
  sound(){ S.sound=!S.sound; save(); if (modalKind==='pause'){ openModal(pauseHTML(),false,true); modalKind='pause'; uiPause=true; } else { openModal(settingsHTML(),false,true); modalKind='settings'; } sfx('tap'); },
  copy(){ const ta=$('saveCode'), code=ta.value;
    const fallback=()=>{ ta.focus(); ta.select(); try{ document.execCommand('copy'); toast('Backup code copied'); }catch(e){ toast('Select the code and copy it'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=>toast('Backup code copied'),fallback); else fallback(); },
  doImport(){ const v=$('loadCode').value; if (!v.trim()){ toast('Paste a backup code first'); return; } if (importCode(v)){ closeModal(); tab='road'; talSeg='talents'; renderHome(true); if (!showNews()) toast('Progress restored'); } else toast('That code could not be read'); },
  reset(b){ if (!resetArmed){ resetArmed=true; b.textContent='Tap again to erase'; return; } S=newState(); save(true); closeModal(); tab='road'; talSeg='talents'; renderHome(true); toast('Progress erased'); },
  close(){ closeModal(); },
  pause(){ if (!run || run.over || run.phase==='levelup') return; uiPause=true; openModal(pauseHTML()); modalKind='pause'; uiPause=true; },
  perkList(){ if (!run || run.over || run.phase==='levelup') return; openModal(perkListHTML()); modalKind='perks'; uiPause=true; },
  leave(){ if (!run || run.over) return; run.left=true; run.over='dead'; closeModal(); },
  speed(){ S.speed=SPEEDS[(SPEEDS.indexOf(S.speed)+1)%SPEEDS.length]; refreshCtrl(); save(); },
  auto(){ S.auto=!S.auto; refreshCtrl(); save(); toast(S.auto?'Perks will be picked for you':'You pick the perks'); },
  loop(){ S.loop=((S.loop|0)+1)%3; refreshCtrl(); save(); toast(['Repeat is off','This chapter will repeat after each run','After a win you move on to the next chapter'][S.loop]); },
  pick(b){ if (!run || run.phase!=='levelup') return; choosePerk(run,+b.dataset.i); sfx('tap'); if (run.phase==='levelup'){ openModal(levelHTML(),true,true); modalKind='level'; } else { lvlOpen=false; closeModal(); } },
  reroll(){ if (run && rerollPerks(run)){ openModal(levelHTML(),true,true); modalKind='level'; } },
  again(){ if (run) startRun(run.ch); },
  next(){ if (run) startRun(Math.min(S.chapter,run.ch+1)); },
  camp(){ goCamp(); },
  stopLoop(){ S.loop=0; clearTimeout(loopTimer); loopTimer=null; refreshCtrl(); save(); if (lastRes) showEnd(lastRes,false); },
};
function onClick(e){
  const m=$('modal');
  if (e.target===m){ if (!modalSticky) closeModal(); return; }
  const b=e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f=ACT[b.dataset.act]; if (f) f(b);
}

/* ---------- loops ---------- */
function tick(){
  if (run) return;
  const now=Date.now(), a=$('stashAmt'), g=$('giftBtn');
  if (a){ const v=stashAmount(S,now); a.textContent=fmt(v); $('stashBtn').disabled=v<1; }
  if (g){ const w=giftWait(S,now); g.textContent=w>0?dur(w):'Open'; g.disabled=w>0; }
  setDot('shop', giftWait(S,now)===0);
}
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.1,Math.max(0,(ts-lastT)/1000)); lastT=ts;
  if (run){
    if (!uiPause && !run.over && run.phase!=='levelup'){
      let sim=dt*S.speed;
      while (sim>1e-6){
        const st=Math.min(0.04,sim); sim-=st;
        if (run.phase==='walk') R.scroll+=70*st;
        stepRun(run,st);
        if (run.phase==='levelup' || run.over) break;
      }
    }
    if (run.phase==='levelup' && !lvlOpen && !run.over) onLevelUp();
    drawBattle(run, uiPause?0:dt, S.speed);
    updateBattleUI();
    if (run.over && !endShown) onRunEnd();
  } else {
    homeT+=dt;
    const cc=$('chapCv'); if (cc) drawChapterPreview(cc,S.sel,homeT);
    const hc=$('heroCv'); if (hc) drawHeroPreview(hc,homeT);
  }
}
async function boot(){
  try{ localStorage.setItem('roadbound.t','1'); localStorage.removeItem('roadbound.t'); }catch(e){ lsOK=false; }
  S=await load(); const fresh=!S; if (!S) S=newState();
  storageOK=lsOK || !!idb;
  R.cv=$('cv'); R.ctx=R.cv.getContext('2d');
  R.reduce=!!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  buildStatGrid();
  document.addEventListener('click',onClick);
  document.addEventListener('contextmenu',e=>{ if (e.target.tagName!=='TEXTAREA') e.preventDefault(); });
  window.addEventListener('resize',()=>{ if (run) resizeScene(); });
  document.addEventListener('visibilitychange',()=>{ if (document.hidden) save(true); else if (run) wakeOn(); });
  window.addEventListener('pagehide',()=>save(true));
  setInterval(tick,1000);
  renderHome(true);
  if (fresh){ save(true); openModal(helpHTML(true)); modalKind='help'; } else showNews();
  requestAnimationFrame(frame);
}
boot();

</script>
