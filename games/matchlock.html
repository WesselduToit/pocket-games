<script>/* Content and tuning. Rules are in core.js; everything runs offline. */
const ML = {

/* Pure, seeded game rules. No DOM, timers, storage, or network access. */
function mlCloneBoard(board) { return board.map(function(t) { return {type:t.type,special:t.special||''}; }); }
function mlClone(run) {
  const copy = Object.assign({},run);
  copy.board = mlCloneBoard(run.board); copy.relics = run.relics.slice(); copy.choices = run.choices.slice();
  copy.enemy = Object.assign({},run.enemy,{intent:Object.assign({},run.enemy.intent)});
  return copy;
}
function mlRandom(run) {
  let x = run.seed >>> 0; x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
  run.seed = x >>> 0; return run.seed / 4294967296;
}
function mlInt(run,n) { return Math.floor(mlRandom(run)*n); }
function mlHero(run) { return ML.heroes.find(function(h) { return h.id === run.heroId; }) || ML.heroes[0]; }
function mlRelic(run,id) { let n=0; for (const r of run.relics) if (r===id) n++; return n; }
function mlPower(run,id) { return mlRelic(run,id)*ML.relicPower[id]; }
function mlAdjacent(a,b) { return a!==b && (Math.abs(a-b)===6 || Math.floor(a/6)===Math.floor(b/6) && Math.abs(a-b)===1); }
function mlMatches(board) {
  const lines=[], found=new Set();
  for (let y=0;y<7;y++) for (let x=0;x<6;) {
    const a=y*6+x,t=board[a].type; let end=x+1;
    while(end<6 && board[y*6+end].type===t) end++;
    if(t<5 && end-x>=3) { const line=[]; for(let n=x;n<end;n++) {line.push(y*6+n); found.add(y*6+n);} lines.push(line); }
    x=end;
  }
  for (let x=0;x<6;x++) for (let y=0;y<7;) {
    const a=y*6+x,t=board[a].type; let end=y+1;
    while(end<7 && board[end*6+x].type===t) end++;
    if(t<5 && end-y>=3) { const line=[]; for(let n=y;n<end;n++) {line.push(n*6+x); found.add(n*6+x);} lines.push(line); }
    y=end;
  }
  return {lines:lines,indices:Array.from(found)};
}
function mlHasLineAt(board,a) {
  const t=board[a].type; if(t===5)return false;
  const x=a%6,y=Math.floor(a/6); let n=1;
  for(let k=x-1;k>=0 && board[y*6+k].type===t;k--)n++;
  for(let k=x+1;k<6 && board[y*6+k].type===t;k++)n++;
  if(n>=3)return true; n=1;
  for(let k=y-1;k>=0 && board[k*6+x].type===t;k--)n++;
  for(let k=y+1;k<7 && board[k*6+x].type===t;k++)n++;
  return n>=3;
}
function mlLegalMoves(value) {
  const board=Array.isArray(value)?value:value.board, moves=[];
  for(let a=0;a<42;a++) {
    if(board[a].type===5)continue;
    for(const b of [a%6<5?a+1:-1,a<36?a+6:-1]) {
      if(b<0 || board[b].type===5 || board[a].type===board[b].type)continue;
      const t=board[a];board[a]=board[b];board[b]=t;
      const valid=mlHasLineAt(board,a)||mlHasLineAt(board,b);
      board[b]=board[a];board[a]=t;
      if(valid)moves.push([a,b]);
    }
  }
  return moves;
}
function mlFreshBoard(run) {
  for(let tries=0;tries<100;tries++) {
    const board=[];
    for(let i=0;i<42;i++) {
      let t=mlInt(run,5);
      while(i%6>=2 && board[i-1].type===t && board[i-2].type===t || i>=12 && board[i-6].type===t && board[i-12].type===t)t=(t+1)%5;
      board.push({type:t,special:''});
    }
    if(mlLegalMoves(board).length)return board;
  }
  // A deterministic playable fallback even if a supplied seed is degenerate.
  const board=[];for(let i=0;i<42;i++)board.push({type:(i+Math.floor(i/6))%5,special:''});
  [0,1,2,7].forEach(function(i,n){board[i].type=[0,1,0,0][n];});
  return board;
}
function mlReshuffle(run) {
  if(mlLegalMoves(run).length)return false;
  const old=mlCloneBoard(run.board);
  for(let attempt=0;attempt<120;attempt++) {
    const board=mlCloneBoard(old);
    for(let i=41;i>0;i--) {const j=mlInt(run,i+1),t=board[i];board[i]=board[j];board[j]=t;}
    if(!mlMatches(board).indices.length && mlLegalMoves(board).length) {run.board=board;return true;}
  }
  // Too many stones can make a playable permutation impossible.
  run.board=mlFreshBoard(run); return true;
}
function mlNewRun(heroId,ladder,seed) {
  const hero=ML.heroes.find(function(h){return h.id===heroId;})||ML.heroes[0];
  const run={version:1,heroId:hero.id,ladder:Math.min(ML.ladder.maxStep,Math.max(0,Math.floor(Number(ladder)||0))),seed:(Number(seed)>>>0)||0x9e3779b9,board:[],hp:hero.maxHp,maxHp:hero.maxHp,block:0,charge:0,gold:0,bankedGold:0,wonCounted:false,moves:0,fightMoves:0,fight:1,enemy:{},relics:[],choices:[],phase:'ready',triple:false};
  run.board=mlFreshBoard(run);mlNextFight(run);return run;
}
function mlIntent(run) {
  const e=run.enemy, data=ML.enemies[run.fight-1];
  const type=data.intents[e.turn%data.intents.length];
  e.intent={type:type,value:type==='attack'?e.attack:type==='guard'?Math.ceil(e.attack*.65):3};
}
function mlNextFight(run) {

/* Screens, input, sound and the two independent save copies. */
var ML_SAVE_KEY='matchlock.save.v1', ML_TUTORIAL_KEY='matchlock.t';
var SV=null, G=null, mlDB=null, mlStorageOK=true, mlLocalOK=true, mlDBOK=false;

function mlEl(id){ return document.getElementById(id); }
function mlEscape(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function mlParseSave(text){
  try{ var raw=JSON.parse(text); return raw && typeof raw==='object' && !Array.isArray(raw) && Number.isFinite(raw.gold) && (raw.version===undefined || raw.version===0 || raw.version===1)?raw:null; }catch(e){ return null; }
}
function mlOpenDB(){
  return new Promise(function(resolve){
    var done=false, timer=setTimeout(finish,1500);
    function finish(){ if (done) return; done=true; clearTimeout(timer); resolve(); }
    try{
      var rq=indexedDB.open('matchlock',1);
      rq.onupgradeneeded=function(){ if (!rq.result.objectStoreNames.contains('kv')) rq.result.createObjectStore('kv'); };
      rq.onsuccess=function(){ if (done){ rq.result.close(); return; } mlDB=rq.result; mlDB.onversionchange=function(){ mlDB.close(); mlDB=null; mlDBOK=false; }; finish(); };
      rq.onerror=finish; rq.onblocked=finish;
    }catch(e){ finish(); }
  });
}
function mlReadDB(){
  return new Promise(function(resolve){
    if (!mlDB) return resolve(null);
    var done=false, timer=setTimeout(function(){ finish(null); },1500);
    function finish(value){ if (done) return; done=true; clearTimeout(timer); resolve(value); }
    try{ var rq=mlDB.transaction('kv').objectStore('kv').get('save'); rq.onsuccess=function(){ mlDBOK=true; finish(mlParseSave(rq.result)); }; rq.onerror=function(){ finish(null); }; }catch(e){ finish(null); }
  });
}
async function mlLoadSave(){
  var a=null;
  try{ a=mlParseSave(localStorage.getItem(ML_SAVE_KEY)); }catch(e){ mlLocalOK=false; }
  await mlOpenDB();
  var b=await mlReadDB(), pick=a&&b?((+b.updated||0)>(+a.updated||0)?b:a):(a||b);
  mlStorageOK=mlLocalOK||mlDBOK;
  return mlMigrate(pick||mlNewSave());
}
function mlWriteSave(){
  if (!SV) return;
  SV.updated=Math.max(Date.now(),(+SV.updated||0)+1); SV.run=G;
  var text=JSON.stringify(SV);
  try{ localStorage.setItem(ML_SAVE_KEY,text); mlLocalOK=true; }catch(e){ mlLocalOK=false; }
  if (mlDB){
    try{ var tx=mlDB.transaction('kv','readwrite'); tx.objectStore('kv').put(text,'save'); tx.oncomplete=function(){ mlDBOK=true; mlStorageOK=mlLocalOK||mlDBOK; }; tx.onerror=tx.onabort=function(){ mlDBOK=false; mlStorageOK=mlLocalOK; }; }catch(e){ mlDBOK=false; }
  }
  mlStorageOK=mlLocalOK||mlDBOK;
}

  if (G){
    var earned=Math.floor(G.gold), banked=Math.floor(G.bankedGold||0);
    SV.gold+=Math.max(0,earned-banked); G.bankedGold=earned;

function mlTone(freq,length){

  mlCommit();
  if (G.phase==='relic') mlShowSheet(G.fight===11?'One last keepsake':'Fight won', '<p>Choose one relic for this run.</p><div class="reward-list">'+mlRelicCards(G.choices)+'</div>','reward',true);
  else if (G.phase==='camp') mlShowSheet('A quiet camp','<p>Rest before the next fight.</p><button class="reward-card" data-act="camp" data-id="heal"><strong>Heal 30%</strong><small>Recover '+Math.round(G.maxHp*.3)+' health.</small></button><button class="reward-card" data-act="camp" data-id="relic"><strong>Take a random relic</strong><small>Keep your wounds. Find something useful.</small></button>','camp',true);
  else if (G.phase==='ready'){ mlNextFight(G); mlCommit(); mlPhase(); }
  else if (G.phase==='won' || G.phase==='lost'){
    var won=G.phase==='won';
    mlShowSheet(won?'The lock is broken':'The road ends here','<p>'+(won?'Eleven foes behind you. A harder road is waiting.':'You reached fight '+G.fight+' of 11. Your gold is safe.')+'</p><p><strong>'+Math.floor(G.gold)+' gold found</strong> · '+G.moves+' moves</p><button class="button primary wide" data-act="menu">Choose your next run</button>','end',true);
  } else { mlPaused=false; mlUpdateHUD(); }
  mlWake();
}
function mlFloat(text,target,color){
  var now=performance.now(),lane=0;
  for (var i=0;i<mlVisual.floats.length;i++) if (mlVisual.floats[i].target===target && now-mlVisual.floats[i].start<100) lane++;
  if (mlVisual.floats.length>=16) mlVisual.floats.shift();
  mlVisual.floats.push({text:text,target:target,color:color,start:now,lane:Math.min(3,lane)});
}
function mlDrawFrame(now){
  mlFrame=0; mlVisual.now=now;
  while (mlVisual.floats.length && now-mlVisual.floats[0].start>1200) mlVisual.floats.shift();
  mlDraw(mlEl('game'),mlDisplay||G,mlVisual);
  if (!document.hidden && (mlBusy || mlVisual.floats.length)) mlFrame=requestAnimationFrame(mlDrawFrame);
}
function mlWake(){ if (!mlFrame && !document.hidden) mlFrame=requestAnimationFrame(mlDrawFrame); }
function mlDelay(ms,token){
  return new Promise(function(resolve){ var start=performance.now(); function tick(t){ if (token!==mlAnimation || document.hidden) return resolve(false); if (t-start>=ms) return resolve(true); requestAnimationFrame(tick); } requestAnimationFrame(tick); });
}
async function mlPlay(result,before,a,b){
  var token=++mlAnimation, now=performance.now();
  mlBusy=true; mlDisplay=before; mlVisual.selected=-1; mlUpdateHUD();
  if (a!==undefined){
    mlVisual.swap={a:a,b:b,start:now,reverse:false}; mlWake();
    if (!await mlDelay(120,token)) return;
    if (!result.valid){
      mlVisual.swap={a:a,b:b,start:performance.now(),reverse:true}; mlWake();
      if (!await mlDelay(120,token)) return;
    }
    mlVisual.swap=null;
  }
  if (result.valid){
    for (var i=0;i<result.steps.length;i++){
      var s=result.steps[i];
      mlVisual.stage={type:'pop',start:performance.now(),duration:150,board:s.before,cleared:s.cleared}; mlDisplay.board=s.before;
      if (s.effects.damage) mlFloat('−'+Math.round(s.effects.damage),'enemy','#ffc47e');
      if (s.effects.heal) mlFloat('+'+Math.round(s.effects.heal),'hero','#9ce7b1');
      if (s.effects.block) mlFloat('+'+Math.round(s.effects.block)+' block','hero','#9edaff');
      if (s.effects.gold) mlFloat('+'+Math.round(s.effects.gold)+' gold','hero','#f4cd75');
      mlTone(300+i*75,.13); mlWake();
      if (!await mlDelay(150,token)) return;
      if (s.hero){ mlDisplay.hp=s.hero.hp; mlDisplay.block=s.hero.block; mlDisplay.charge=s.hero.charge; }
      if (s.enemy){ mlDisplay.enemy.hp=s.enemy.hp; mlDisplay.enemy.block=s.enemy.block; }
      mlVisual.stage={type:'fall',start:performance.now(),duration:240,board:s.after,from:s.before,cleared:s.cleared}; mlDisplay.board=s.after; mlWake();
      if (!await mlDelay(240,token)) return;
    }
    if (G.hp<mlDisplay.hp){ mlFloat('−'+Math.round(mlDisplay.hp-G.hp),'hero','#ffaaa0'); mlTone(120,.18); }
    else if (G.hp>mlDisplay.hp) mlFloat('+'+Math.round(G.hp-mlDisplay.hp),'hero','#9ce7b1');
    if (G.block>mlDisplay.block && !result.steps.length) mlFloat('+'+Math.round(G.block-mlDisplay.block)+' block','hero','#9edaff');
    if (result.reshuffled) mlToast('No moves left. The board reshuffled.');
  } else mlToast('That swap needs a line of 3.');
  mlVisual.swap=null; mlVisual.stage=null; mlDisplay=null; mlBusy=false; mlCommit(); mlPhase(); mlWake();
}
function mlDoSwap(a,b){
  if (!G || G.phase!=='fight' || mlBusy || mlPaused || !mlEl('sheet-wrap').hidden) return;
  if (a<0 || b<0 || a>=G.board.length || b>=G.board.length || !mlAdjacent(a,b)) return;
  if (G.board[a].type===5 || G.board[b].type===5){ mlVisual.selected=-1; mlToast('Match beside a stone to break it.'); mlWake(); return; }
  var before=mlClone(G), result=mlSwap(G,a,b,true); mlCommit(); mlPlay(result,before,a,b);
}
function mlUseSpecial(){
  if (!G || mlBusy || mlPaused || G.phase!=='fight' || !mlEl('sheet-wrap').hidden) return;
  var before=mlClone(G), result=mlSpecial(G,true);
  if (!result.valid){ mlToast('Match stars to fill your special.'); return; }
  mlCommit(); mlTone(650,.22); mlPlay(result,before);
}
function mlCellAt(x,y){
  var box=mlBoardLayout(mlEl('game')), col=Math.floor((x-box.x)/box.size), row=Math.floor((y-box.y)/box.size);
  return col>=0 && col<ML.cols && row>=0 && row<ML.rows?row*ML.cols+col:-1;
}
function mlPoint(e){ var r=mlEl('game').getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function mlPointerDown(e){
  if (!G || mlBusy || mlPaused || !mlEl('sheet-wrap').hidden || G.phase!=='fight') return;
  mlTone(170,.025); var p=mlPoint(e);
  if (mlHeroHit(mlEl('game'),p.x,p.y)){ mlUseSpecial(); return; }
  var cell=mlCellAt(p.x,p.y); if (cell<0) return;
  if (G.board[cell].type===5){ mlToast('Match beside a stone to break it.'); return; }
  mlPointer={id:e.pointerId,cell:cell,x:p.x,y:p.y}; mlEl('game').setPointerCapture(e.pointerId);
  if (mlVisual.selected>=0 && mlAdjacent(mlVisual.selected,cell)){ var prev=mlVisual.selected; mlVisual.selected=-1; mlDoSwap(prev,cell); mlPointer=null; }
  else { mlVisual.selected=cell; mlWake(); }
}
function mlPointerMove(e){
  if (!mlPointer || e.pointerId!==mlPointer.id) return;
  var p=mlPoint(e), dx=p.x-mlPointer.x, dy=p.y-mlPointer.y;
  if (Math.max(Math.abs(dx),Math.abs(dy))<mlBoardLayout(mlEl('game')).size*.28) return;
  var a=mlPointer.cell, col=a%ML.cols, row=Math.floor(a/ML.cols), b=Math.abs(dx)>Math.abs(dy)?(col+(dx>0?1:-1)>=0 && col+(dx>0?1:-1)<ML.cols?a+(dx>0?1:-1):-1):(row+(dy>0?1:-1)>=0 && row+(dy>0?1:-1)<ML.rows?a+(dy>0?ML.cols:-ML.cols):-1);
  mlPointer=null; if (b>=0) mlDoSwap(a,b);
}
function mlAbortAnimation(){
  mlAnimation++; mlBusy=false; mlDisplay=null; mlVisual.swap=null; mlVisual.stage=null; mlPointer=null;
  if (mlFrame){ cancelAnimationFrame(mlFrame); mlFrame=0; } mlCommit();
}
async function mlAction(act,id){
  if (act==='welcome'){ try{ localStorage.setItem(ML_TUTORIAL_KEY,'1'); }catch(e){} mlMenu(); }
  else if (act==='menu') mlMenu();
  else if (act==='resume'){ mlPaused=false; mlSticky=false; mlCloseSheet(); mlPhase(); }
  else if (act==='hero'){
    if (SV.heroes.indexOf(id)>=0) SV.hero=id;
    else if (!mlBuyHero(SV,id)){ mlToast('Keep playing to earn more gold.'); return; }
    mlCommit(); mlMenu();
  } else if (act==='start'){
    if (G && G.phase!=='won' && G.phase!=='lost') mlShowSheet('Leave this run?','<p>Your gold is saved. Start a fresh run with the selected hero?</p><button class="button primary wide" data-act="new-run">Start new run</button><button class="button wide" data-act="menu">Keep this run</button>','confirm',true);
    else mlStartRun();
  } else if (act==='new-run') mlStartRun();
  else if (act==='ladder-down'){ SV.ladder=Math.max(0,SV.ladder-1); mlCommit(); mlMenu(); }
  else if (act==='ladder-up'){ if (SV.ladder<Math.min(SV.maxLadder||0,ML.ladder.maxStep)){ SV.ladder++; mlCommit(); mlMenu(); } else mlToast(SV.ladder>=ML.ladder.maxStep?'This is the highest ladder.':'Buy the next ladder to raise the challenge.'); }
  else if (act==='buy-ladder'){
    if ((SV.maxLadder||0)>=ML.ladder.maxStep){ mlToast('All '+ML.ladder.maxStep+' ladders are unlocked.'); return; }
    if (!SV.wins){ mlToast('Win a run to open the harder ladder.'); return; }
    var price=typeof mlLadderCost==='function'?mlLadderCost(SV):null;
    mlShowSheet('A harder road','<p>'+mlLadderSummary((SV.maxLadder||0)+1)+'.</p><p>Enemies gain health and attack. Win the run to earn the gold bonus.</p><p>'+(price!==null?'Price: '+price+' gold.':'Spend gold to open the next ladder.')+'</p><button class="button primary wide" data-act="confirm-ladder">Buy next ladder</button><button class="button wide" data-act="menu">Back</button>','confirm',true);
  } else if (act==='confirm-ladder'){
    if ((SV.maxLadder||0)>=ML.ladder.maxStep){ mlToast('All '+ML.ladder.maxStep+' ladders are unlocked.'); return; }
    if (!mlBuyLadder(SV)){ mlToast('You need more gold for the next ladder.'); return; } mlCommit(); mlMenu();
  } else if (act==='sound'){ SV.sound=!SV.sound; mlWriteSave(); mlSettings(); }
  else if (act==='copy'){
    mlCommit(); var code=mlEncodeSave(SV), copied=false;
    try{ await navigator.clipboard.writeText(code); copied=true; }catch(e){}
    if (copied) mlToast('Backup code copied.');
    else { mlEl('backup-code').value=code; mlEl('backup-code').focus(); mlEl('backup-code').select(); mlToast('Select and copy the code in the box.'); }
  } else if (act==='import'){
    var restored; try{ restored=mlDecodeSave(mlEl('backup-code').value); }catch(e){}
    if (!restored){ mlToast('That backup code could not be read.'); return; }
    mlAbortAnimation(); SV=restored; G=SV.run; mlCommit(); mlMenu(); mlToast('Progress restored.');
  } else if (act==='reset') mlShowSheet('Start over?','<p>This removes all Matchlock progress on this device. Copy a backup first if you want to keep it.</p><button class="button danger wide" data-act="confirm-reset">Erase Matchlock progress</button><button class="button wide" data-act="settings">Keep progress</button>','confirm',false);
  else if (act==='confirm-reset'){ mlAbortAnimation(); SV=mlNewSave(); G=null; mlWriteSave(); mlMenu(); }
  else if (act==='settings') mlSettings();
  else if (act==='choose-relic'){ mlChooseRelic(G,id); mlSticky=false; mlCloseSheet(); mlCommit(); mlPhase(); }
  else if (act==='camp'){ mlCamp(G,id); mlSticky=false; mlCloseSheet(); mlCommit(); mlPhase(); }
}
async function mlBoot(){
  SV=await mlLoadSave(); G=SV.run; mlCommit();
  document.addEventListener('pointerdown',function(){ mlTone(260,.03); },{once:true});
  mlEl('settings').addEventListener('click',function(){ if (!SV || mlBusy) return; mlSettings(); });
  mlEl('home').addEventListener('click',function(){ if (!mlBusy) mlMenu(); });
  mlEl('hero-action').addEventListener('click',mlUseSpecial);
  mlEl('relics').addEventListener('click',function(){
    if (!G || mlBusy) return;
    var body=G.relics.length?G.relics.map(function(id){ var r=ML.relics.find(function(v){ return v.id===id; }); return '<p><strong>'+mlEscape(r.name)+'</strong><br>'+mlEscape(r.description)+'</p>'; }).join(''):'<p>Win a fight to choose your first relic.</p>';
    mlShowSheet('Your relics',body,'relics',false);
  });
  mlEl('sheet-close').addEventListener('click',mlCloseSheet);
  mlEl('sheet-wrap').addEventListener('click',function(e){ if (e.target===mlEl('sheet-wrap')) mlCloseSheet(); });
  mlEl('sheet-body').addEventListener('click',function(e){ var button=e.target.closest('[data-act]'); if (button) mlAction(button.dataset.act,button.dataset.id); });
  mlEl('game').addEventListener('pointerdown',mlPointerDown);
  mlEl('game').addEventListener('pointermove',mlPointerMove);
  mlEl('game').addEventListener('pointerup',function(){ mlPointer=null; });
  mlEl('game').addEventListener('pointercancel',function(){ mlPointer=null; mlVisual.selected=-1; mlWake(); });
  mlEl('game').addEventListener('keydown',function(e){
    var offsets={ArrowLeft:-1,ArrowRight:1,ArrowUp:-ML.cols,ArrowDown:ML.cols};
    if (offsets[e.key]!==undefined && G && !mlBusy && !mlPaused){ e.preventDefault(); var a=mlVisual.selected<0?0:mlVisual.selected; if (e.shiftKey) mlDoSwap(a,a+offsets[e.key]); else { mlVisual.selected=Math.max(0,Math.min(ML.cols*ML.rows-1,a+offsets[e.key])); mlWake(); } }
  });
  document.addEventListener('keydown',function(e){
    if (e.key==='Escape') mlCloseSheet();
    if (e.key==='Tab' && !mlEl('sheet-wrap').hidden){ var nodes=Array.from(mlEl('sheet-wrap').querySelectorAll('button:not([hidden]),textarea')).filter(function(el){ return !el.disabled; }); var first=nodes[0], last=nodes[nodes.length-1]; if (nodes.length && e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); } else if (nodes.length && !e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } }
  });
  document.addEventListener('visibilitychange',function(){
    if (document.hidden){ mlAbortAnimation(); mlPaused=true; if (mlAudio && mlAudio.state==='running') mlAudio.suspend(); }
    else { mlWake(); if (mlEl('sheet-wrap').hidden && G){ mlShowSheet('Paused','<p>Your next move can wait.</p><button class="button primary wide" data-act="resume">Resume run</button>','pause',true); } }
  });
  window.addEventListener('resize',mlWake); window.addEventListener('pagehide',mlWriteSave);
  var seen=false; try{ seen=localStorage.getItem(ML_TUTORIAL_KEY)==='1'; }catch(e){}
  if (!seen) mlShowSheet('Every match is a hit','<ul><li>Drag neighbours to match 3. Empty swaps cost nothing.</li><li>Swords hit. Shields block. Hearts heal.</li><li>Stars charge your hero. Tap the portrait when full.</li><li>Match 4 for a row clear; 5 or a corner for a burst.</li><li>Watch the enemy countdown. Choose a relic after each win.</li><li>Gold unlocks heroes and harder ladders.</li></ul><button class="button primary wide" data-act="welcome">Let\'s go</button>','welcome',true);
  else mlMenu();
  mlUpdateHUD(); mlWake();
}
mlBoot();
</script>
