<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1c1a2e">
<meta name="mobile-web-app-capable" content="yes">
<title>Down the Hatch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffd23f'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%231c1a2e'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#1c1a2e; --paper:#fff8ec; --card:#ffffff; --pink:#ff4f8b; --sun:#ffd23f; --mint:#3ddc97; --dim:#6b6880;
  --disp:"sans-serif-condensed","Roboto Condensed","Arial Narrow","Avenir Next Condensed",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#12101f;color:var(--ink);font-family:var(--body);overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hidden{display:none!important}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--paper);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---- map select ---- */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);background-image:radial-gradient(rgba(28,26,46,.07) 1.5px,transparent 1.6px);background-size:18px 18px}
.top{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;flex-direction:column;gap:10px}
.logo{font:800 40px/0.95 var(--disp);font-size:clamp(28px,10.6vw,40px);letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.logo .o{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:radial-gradient(circle at 50% 62%,#000 0 45%,#2a2850 100%);box-shadow:0 0 0 .07em #fff,0 0 0 .14em var(--ink);margin:0 .09em 0 .07em;vertical-align:-.02em;animation:holeturn 24s linear infinite}
@keyframes holeturn{to{transform:rotate(360deg)}}
.stats{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 13px 7px 10px;font:700 16px/1 var(--disp);white-space:nowrap}
.pill b{font-weight:800}
.stats .sp{flex:1}
.ibtn{width:42px;height:42px;border-radius:12px;background:var(--card);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:19px;display:grid;place-items:center}
.ibtn:active{transform:translateY(3px);box-shadow:none}
.maps{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 16px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:14px;align-content:start;-webkit-overflow-scrolling:touch}
.map{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);overflow:hidden}
.map:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.map .sw{position:relative;flex:none;height:92px;background-size:120px 120px;border-bottom:3px solid var(--ink);display:block}
.map .pit{position:absolute;left:50%;top:56%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 50% 65%,#000 0 50%,#26243f 100%);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink)}
.map .ic{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:44px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.map .num{position:absolute;left:8px;top:7px;font:800 13px/1 var(--disp);background:var(--ink);color:#fff;border-radius:8px;padding:4px 6px}
.map .nm{font:800 17px/1.1 var(--disp);padding:9px 10px 3px}
.map .rank{align-self:flex-start;margin:0 10px 5px;padding:3px 6px;border-radius:6px;background:var(--ink);color:#fff;font:800 12px/1 var(--disp)}
.map .st{padding:0 10px 10px;font:700 13px/1.2 var(--disp);color:var(--dim);display:flex;gap:6px;align-items:center}
.stars{letter-spacing:1px;color:#d9d4c4;font-size:17px;line-height:1}
.stars b{color:#f5a400;font-weight:400}
.map.locked .sw{filter:grayscale(1) brightness(.8)}
.map.locked .ic{opacity:.35}
.map.locked{box-shadow:0 5px 0 #8b8898;border-color:#8b8898;color:#8b8898}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:3px solid var(--ink);background:var(--paper)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 16px;border-radius:14px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:800 17px/1 var(--disp);white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.go{background:var(--sun)}
.btn.pink{background:var(--pink);color:#fff}
.btn.on{background:var(--mint)}
.btn.big{min-height:58px;font-size:22px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---- in-game HUD ---- */
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.hbtn{pointer-events:auto;justify-self:start;width:44px;height:44px;border-radius:13px;background:rgba(28,26,46,.82);font-size:18px;display:grid;place-items:center}
.timer{justify-self:center;background:rgba(28,26,46,.86);color:#fff;border-radius:16px;padding:8px 18px;font:800 26px/1 var(--disp);min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{background:#e0304f;animation:beat .5s infinite alternate}
@keyframes beat{to{transform:scale(1.08)}}
.hcoin{justify-self:end;background:rgba(28,26,46,.82);color:#fff;border-radius:999px;padding:8px 13px 8px 10px;font:800 16px/1 var(--disp);white-space:nowrap}
.prog{position:relative;height:22px;border-radius:999px;background:rgba(28,26,46,.82);overflow:hidden;border:2px solid rgba(28,26,46,.9)}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3ddc97,#b9f24b);border-radius:999px}
.prog b{position:absolute;left:10px;top:0;font:800 13px/18px var(--disp);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.prog .tick{position:absolute;top:0;font-size:13px;line-height:18px;color:rgba(255,255,255,.5);transform:translateX(-50%)}
.prog .tick.on{color:#ffd23f}
.prog .t1{left:50%}.prog .t2{left:80%}.prog .t3{left:calc(100% - 9px)}
.pws{display:flex;gap:6px;min-height:34px}
.pw{background:rgba(28,26,46,.82);color:#fff;border-radius:999px;padding:5px 11px 5px 7px;font:800 14px/1 var(--disp);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.banner{position:absolute;left:0;right:0;top:24%;text-align:center;font:800 46px/1 var(--disp);color:#fff;opacity:0;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.banner.show{animation:ban 1.3s ease-out}
.banner.small{font-size:30px}
@keyframes ban{0%{opacity:0;transform:scale(.4)}14%{opacity:1;transform:scale(1.15)}24%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.unlock{position:absolute;left:0;right:0;top:calc(24% + 58px);display:flex;justify-content:center;opacity:0}
.unlock span{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font:800 15px/1.2 var(--disp);box-shadow:0 3px 0 var(--ink)}
.unlock.show{animation:ban 2.2s ease-out}
.unlock.hold{opacity:1;top:auto;bottom:22%}
.unlock.hold span{font-size:14px;text-align:center;max-width:86%}

/* ---- sheets ---- */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(18,16,31,.6)}
#modal.open{display:flex}
.sheet{position:relative;width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:var(--paper);border-top:4px solid var(--ink);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .18s ease-out}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit;z-index:3}
.confetti i{position:absolute;left:50%;top:36px;width:6px;height:10px;animation:confetti 1.15s ease-out both}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0)}40%{opacity:1;transform:translate(calc(var(--x)*.55),-32px) rotate(calc(var(--r)*.4))}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes up{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
h2{font:800 30px/1.05 var(--disp)}
h3{font:800 18px/1.2 var(--disp);margin-top:4px}
p{font-size:14.5px;line-height:1.45;color:#4a4760}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts.one{grid-template-columns:1fr}
.rankstep{display:grid;grid-template-columns:48px 1fr 48px;gap:12px;align-items:center;text-align:center;font:800 20px/1.2 var(--disp)}
.chips{display:flex;flex-wrap:wrap;gap:4px;font-size:25px;line-height:1.15}
.bigstars{font-size:54px;line-height:1;letter-spacing:6px;color:#ded8c6;text-align:center}
.bigstars b{color:#f5a400;font-weight:400;display:inline-block;animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards}
.bigstars b:nth-child(2){animation-delay:.18s}.bigstars b:nth-child(3){animation-delay:.36s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.rew{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rew span{background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font:800 17px/1 var(--disp)}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:10px}
.row .ic{width:46px;height:46px;border-radius:12px;background:var(--paper);display:grid;place-items:center;font-size:25px;line-height:1}
.row b{font:800 17px/1.2 var(--disp);display:block}
.row b small{font:800 12.5px/1 var(--disp);color:var(--pink);margin-left:6px;white-space:nowrap}
.row p{font-size:13px;line-height:1.3}
.row .btn{min-height:42px;font-size:15px;padding:0 12px}
.mission{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px}
.mission b{font:800 17px/1.25 var(--disp);display:block;margin-bottom:6px}
.mission p{font-variant-numeric:tabular-nums}
.got{font:800 14px/1 var(--disp);color:#1e9e6a;padding-right:4px}
.rims{display:flex;gap:10px;flex-wrap:wrap}
.rim{position:relative;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 50% 62%,#000 0 48%,#2a2850 100%);box-shadow:0 0 0 4px var(--r0),0 0 0 7px var(--r1)}
.rim.sel::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:800 22px var(--disp)}
.rim.lock{opacity:.35}
.rim.lock::after{content:attr(data-need);position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:800 13px var(--disp)}
textarea{width:100%;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;resize:none;-webkit-user-select:text;user-select:text;word-break:break-all}
.warnbox{background:#ffe2d6;border:3px solid #e0304f;color:#7a1226;border-radius:12px;padding:9px 11px;font-size:13.5px}
.help{padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.4;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font:800 15px/1.25 var(--disp);padding:10px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:86%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ .sheet,.banner.show,.unlock.show,.bigstars b,.timer.low{animation-duration:.01s}.logo .o{animation:none}.confetti{display:none} }

/* sheet header that stays in view while the sheet scrolls (coin total on the upgrades sheet) */
.shead{position:sticky;top:-18px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);margin:-18px 0 -4px;padding:18px 0 8px}

</style>
</head>

    <div class="pws" id="hPw"></div>
    <div class="banner" id="banner"></div>
    <div class="unlock" id="unlock"></div>
  </div>
  <div id="menu"></div>
</div>
<div id="modal"></div>
<div id="toast" role="status"></div>

const SAVE_KEY='hatch.save.v1';

const $=id=>document.getElementById(id);

function fmt(n){ n=Math.floor(n+1e-9); if (n<1000) return String(n); const u=['K','M','B']; let i=-1; while (n>=1000 && i<2){ n/=1000; i++; } return (n<10?(Math.floor(n*100)/100).toFixed(2):(n<100?(Math.floor(n*10)/10).toFixed(1):String(Math.floor(n))))+u[i]; }

/* ---------- saving: localStorage plus an IndexedDB copy; the newer one wins ---------- */
let saveRev=0, saveT=null, idb=null, lsOK=true;
function newSave(){ return {v:3, coins:0, maps:{}, up:{}, rim:0, sound:true, haptic:true, hint:true, seen:false, mis:{ch:1,feat:false,n:0}}; }
function fixSave(o){
  const d=newSave(); if (!o || typeof o!=='object' || !o.maps || typeof o.maps!=='object') return d;
  const mis=o.v===3 && o.mis && typeof o.mis==='object'?o.mis:d.mis;
  for (const k in d) if (o[k]===undefined) o[k]=d[k];
  for (const id in o.maps){
    const m=o.maps[id]||{}, ranks={};
    if (m.r && typeof m.r==='object'){
      for (const k in m.r) if (Number.isSafeInteger(+k) && +k>=1){ const r=m.r[k]||{}; ranks[k]={best:Math.max(0,+r.best||0),stars:clamp(r.stars|0,0,3)}; }
    } else ranks['1']={best:Math.max(0,+m.best||0),stars:clamp(m.stars|0,0,3)};
    let rank=Math.max(1,Math.floor(+m.rank||1));
    while (ranks[rank] && ranks[rank].stars>=3) rank++;   // three stars on the highest rank always opens the next one, also in old saves
    o.maps[id]={rank,r:ranks};
  }
  o.v=3;
  o.mis={ch:Number.isSafeInteger(mis.ch) && mis.ch>=1?mis.ch:1,feat:mis.feat===true,n:Number.isFinite(mis.n)?Math.max(0,Math.floor(mis.n)):0};
  o.coins=Math.max(0,+o.coins||0); if (!o.up || typeof o.up!=='object') o.up={};
  for (const u of UPGRADES) o.up[u.id]=clamp(o.up[u.id]|0,0,u.max);
  o.rim=clamp(o.rim|0,0,RIMS.length-1);

}
function writeSave(){
  clearTimeout(saveT); saveT=null; if (!SV) return;
  SV.rev=++saveRev; const str=JSON.stringify(SV);
  try{ localStorage.setItem(SAVE_KEY,str); lsOK=true; }catch(e){ lsOK=false; }
  if (idb){ try{ idb.transaction('kv','readwrite').objectStore('kv').put(str,'save'); }catch(e){} }
  storageOK=lsOK||!!idb;
}
function save(now){ if (!SV) return; if (now){ writeSave(); return; } if (!saveT) saveT=setTimeout(writeSave,500); }
function idbOpen(){
  return new Promise(res=>{
    let done=false; const fin=()=>{ if (!done){ done=true; res(); } };
    try{ const rq=indexedDB.open('hatch',1);
      rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore('kv'); }catch(e){} };
      rq.onsuccess=()=>{ if (done){ try{ rq.result.close(); }catch(e){} return; } idb=rq.result; fin(); };
      rq.onerror=fin; rq.onblocked=fin; }catch(e){ fin(); }
    setTimeout(fin,1500);
  });
}
function idbGet(){
  return new Promise(res=>{
    if (!idb) return res(null);
    let done=false; const fin=v=>{ if (!done){ done=true; res(v); } };
    try{ const rq=idb.transaction('kv').objectStore('kv').get('save'); rq.onsuccess=()=>fin(rq.result||null); rq.onerror=()=>fin(null); }catch(e){ fin(null); }
    setTimeout(()=>fin(null),1500);

}
function parseSave(s){ try{ const o=JSON.parse(s); return (o && typeof o.maps==='object') ? o : null; }catch(e){ return null; } }
async function loadSave(){
  let a=null, b=null;
  try{ a=parseSave(localStorage.getItem(SAVE_KEY)); }catch(e){ lsOK=false; }
  await idbOpen(); b=parseSave(await idbGet());
  const pick=(a&&b)?((b.rev||0)>(a.rev||0)?b:a):(a||b);
  saveRev=Math.max((a&&a.rev)||0,(b&&b.rev)||0);
  return pick?fixSave(pick):null;
}
function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(SV)))); }
function importCode(code){ try{ const o=parseSave(decodeURIComponent(escape(atob(code.replace(/\s+/g,''))))); if (!o) return false; SV=fixSave(o); save(true); return true; }catch(e){ return false; } }

let AC=null, NOISE=null, MASTER=null;

    if (!AC){ const A=window.AudioContext||window.webkitAudioContext; if (!A) return null; AC=new A();
      const n=Math.floor(AC.sampleRate*0.6), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for (let i=0;i<n;i++) d[i]=Math.random()*2-1; NOISE=b;

}

  const a=audio(); if (!a) return;

    o.type=type; o.frequency.setValueAtTime(clamp(f0,30,8000),t); if (f1!==f0) o.frequency.exponentialRampToValueAtTime(clamp(f1,30,8000),t+dur);

    o.connect(g); g.connect(MASTER); o.start(t); o.stop(t+dur+0.03); }catch(e){}

  const a=audio(); if (!a) return;
  try{ const t=a.currentTime+(delay||0), s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
    s.buffer=NOISE; f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q||1;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

}

    o.type='sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*0.5,t+len*0.35); o.frequency.exponentialRampToValueAtTime(f*1.5,t+len*0.9);

function gulp(kind,d,combo,det){

  swallowTone(560*sz*up, 0.13, 0.11+Math.min(0.16,d/700));
  const f=880*sz*up;
  if (kind==='pop') tone('sine',f*1.5,f*0.75,0.06,0.09);
  else if (kind==='bloop') tone('sine',f*0.6,f*1.5,0.09,0.09);
  else if (kind==='clank'){ tone('square',f*1.9,f*1.85,0.05,0.04); tone('square',f*2.9,f*2.8,0.04,0.028); noise(0.03,0.07,4200,2); }
  else if (kind==='thud'){ tone('sine',Math.min(280,f*0.5),60,0.12,0.13); noise(0.06,0.05,500,0.7,'lowpass'); }
  else if (kind==='boing') tone('triangle',f*0.8,f*1.7,0.11,0.09);
  else if (kind==='click'){ noise(0.02,0.09,3000,3); tone('sine',f*1.8,f*1.6,0.03,0.05); }
  else tone('sawtooth',f*3,f*0.6,0.08,0.035);
  if (d>=60){ tone('sine',170,55,0.3,0.22); noise(0.2,0.1,220,0.8,'lowpass'); }
}
function jingle(notes,type,step,vol){ notes.forEach((n,i)=>tone(type||'triangle',n,n,0.16,vol||0.13,i*(step||0.08))); }
function buzz(ms){ try{ if (SV && SV.haptic && navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
async function wakeOn(){ try{ if ('wakeLock' in navigator && !wake){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{ wake=null; }); } }catch(e){ wake=null; } }
function wakeOff(){ try{ if (wake) wake.release(); }catch(e){} wake=null; }

/* ---------- a run ---------- */
function startMap(i, free, rank){
  closeModal(); curMap=i; curRank=free?1:clamp(rank||mapRec(i).rank,1,mapRec(i).rank);
  const m=MAPS[i], level=free?0:runLevel(i,curRank), w=genWorld(m, free?m.seed:rankSeed(m,curRank), emojiOK, free?null:level);
  for (const t of w.types) sprOf(t);
  for (const k in SPECIALS) sprite(SPECIALS[k].ic);
  G=newGame(m,w,SV.up,free,level); G.rank=curRank; paused=false; endShown=false; hint=null; hintT=0; lastTick=99; J.on=false;
  $('menu').classList.add('hidden'); $('hud').classList.remove('hidden');
  for (const k in cache) delete cache[k];
  $('hPw').innerHTML=''; $('banner').className='banner'; $('unlock').className='unlock';
  resizeView(); resetView(G); wakeOn(); audio();
  flash('banner', m.n, 'small');
  $('unlock').innerHTML='<span>Drag anywhere to steer. The clock starts when you move.</span>'; $('unlock').className='unlock hold';
}
function toMenu(){ closeModal(); G=null; wakeOff(); $('hud').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu(); }
function sizeUp(n){
  const c0=holeD(n-1)*CAPF, c1=holeD(n)*CAPF, seen={}, list=[];
  for (const t of G.w.types) if (t.tier>=0 && t.d>c0 && t.d<=c1 && !seen[t.ch] && t.ch[0]!=='@'){ seen[t.ch]=1; list.push(t.ch); }
  flash('banner', n>=SIZES?'Full size!':'Size '+n);
  if (list.length) flash('unlock', `<span>Now on the menu: ${list.slice(0,6).join(' ')}</span>`);
  if (V.pulses.length>=ART.pulses) V.pulses.shift(); V.pulses.push({t:0}); V.flash=0.4; jingle([523,659,784,1047]); buzz(25);
}
const SP_MSG={clock:'+10 seconds', magnet:'Magnet!', bolt:'Speed!', x2:'Double points!', grow:'Growth potion!', coin:'+40 coins', bomb:'Boom! -8 seconds'};
function gotSpecial(e){
  flash('banner', SP_MSG[e.id], 'small');
  if (e.id==='coin') addCoin(40,e.x,e.y);
  if (e.id==='bomb'){ noise(0.5,0.4,300,0.6,'lowpass'); tone('sine',120,40,0.4,0.3); V.shake=0.5; buzz(120); }
  else { tone('sine',1319,1319,0.18,0.12); tone('sine',1760,1760,0.25,0.1,0.07); buzz(15); }
  addFall({ch:SPECIALS[e.id].ic,d:22},22,e.x,e.y);
}
function events(){
  const ev=G.ev; if (!ev.length) return;
  let big=null, chain=0, n=0;
  for (const e of ev){
    if (e.k==='eat'){ n++; addFall(e.ty,e.d,e.x,e.y); if (e.chain) chain++; if (!big || e.d>big.d) big=e; }
    else if (e.k==='size') sizeUp(e.S);
    else if (e.k==='special') gotSpecial(e);
    else if (e.k==='chain'){ tone('sawtooth',200,700,0.2,0.06); buzz(12); }
    else if (e.k==='chainEnd'){ tone('sine',900,1800,0.09,0.12); swallowTone(300,0.16,0.2); if (e.coil){ flash('banner','Slurp!','small'); buzz(30); } }
  }
  ev.length=0;
  const now=performance.now();
  if (big && now-sndT>55){
    sndT=now;
    if (chain && chain>=n){ let v=0; for (const c of G.w.chains) if (c.feed && !c.done) v=Math.max(v,c.v); const f=420+v*1.5; tone('triangle',f,f*1.2,0.035,0.09); }
    else gulp(big.ty.voice||G.map.snd, big.d, G.combo, big.ty.det);
  }
}
function hud(){
  const p=pctDone(G);
  if (G.free) setText('hTime','Free');
  else { setText('hTime',clock(G.left)); const low=G.left<=10 && !G.over; if (cache.low!==low){ cache.low=low; $('hTime').classList.toggle('low',low); }
    const s=Math.ceil(G.left); if (low && s!==lastTick && !paused){ lastTick=s; tone('square',1000,1000,0.03,0.04); } }
  setText('hCoins',fmt(coinsFor(G)));
  setText('hPct',Math.floor(p*100)+'%');
  const wv=(p*100).toFixed(1)+'%'; if (cache.bar!==wv){ cache.bar=wv; $('hBar').style.width=wv; }
  const st=starsFor(p); if (cache.st!==st){ cache.st=st; for (let i=1;i<=3;i++) $('hS'+i).classList.toggle('on',st>=i); }
  let sig=''; for (const k in G.pw) if (G.pw[k]>0) sig+=k+Math.ceil(G.pw[k])+',';
  if (cache.pw!==sig){ cache.pw=sig; let h=''; for (const k in G.pw) if (G.pw[k]>0) h+=`<span class="pw">${SPECIALS[k].ic} ${Math.ceil(G.pw[k])}s</span>`; $('hPw').innerHTML=h; }
}
function finish(){
  if (!G || !G.over || endShown) return;
  endShown=true; J.on=false;
  const p=pctDone(G), st=starsFor(p), coins=coinsFor(G), i=curMap, free=G.free, old=rec(i,curRank);
  const wasNext=i+1<MAPS.length && unlocked(i+1);
  let newRank=0, missionDone=[];
  if (!free){
    const before=missionStatus(SV);
    SV.coins+=coins;
    const m=mapRec(i);
    m.r[curRank]={best:Math.max(old.best||0,p), stars:Math.max(old.stars||0,st)};
    if (st===3 && curRank===m.rank) newRank=++m.rank;
    SV.maps[MAPS[i].id]=m;
    addMissionRun(SV,G);
    missionDone=missionStatus(SV).filter((m,j)=>m.done && !before[j].done).map(m=>m.text);
    save(true);
  }
  if (G.over==='clear' || st>=2) jingle([523,659,784,1047,1319],'triangle',0.1,0.14); else jingle([392,330,262],'triangle',0.16,0.12);
  buzz(40);
  const g=G; setTimeout(()=>{ if (G===g) endSheet(p,st,coins,old,wasNext,newRank,missionDone); }, 700);
}
function endSheet(p,st,coins,old,wasNext,newRank,missionDone=[]){

  ${opened?`<p style="text-align:center"><b>${MAPS[i+1].n}</b> is now open.</p>`:''}
  ${newRank?`<p style="text-align:center"><b>Rank ${newRank}</b> is now open.</p>`:''}

  <div class="acts">${primaryNext?`<button class="btn go" data-act="play" data-i="${i+1}">Next map</button>`:`<button class="btn go" data-act="${free?'free':'play'}" data-i="${i}" data-rank="${newRank||curRank}">${newRank?'Play rank '+newRank:'Play again'}</button>`}<button class="btn" data-act="quit">Maps</button></div>
  ${next && !primaryNext?`<div class="acts one"><button class="btn" data-act="play" data-i="${i+1}">Next map</button></div>`:''}

    const fb=()=>{ ta.focus(); ta.select(); try{ document.execCommand('copy'); toast('Backup code copied'); }catch(e){ toast('Select the code and copy it'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=>toast('Backup code copied'),fb); else fb(); },
  doImport(){ const v=$('loadCode').value; if (!v.trim()){ toast('Paste a backup code first'); return; } if (importCode(v)){ closeModal(); renderMenu(); toast('Progress restored'); } else toast('That code could not be read'); },
  reset(b){ if (!resetArmed){ resetArmed=true; b.textContent='Tap again to erase'; return; } SV=newSave(); SV.seen=true; save(true); closeModal(); renderMenu(); toast('Progress erased'); },
  close(){ closeModal(); },
  pause(){ if (!G || G.over) return; paused=true; J.on=false; openModal(pauseHTML()); modalKind='pause'; paused=true; },
  restart(){ const f=G.free; startMap(curMap,f,curRank); },
  quit(){ if (G && !G.over && G.free){ closeModal(); G.over='time'; return; } toMenu(); },
};
function onClick(e){
  const m=$('modal');
  if (e.target===m){ if (!modalSticky) closeModal(); return; }
  const b=e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f=ACT[b.dataset.act]; if (f) f(b);
}

/* ---------- input ---------- */
function bindInput(){
  const cv=V.cv;
  cv.addEventListener('pointerdown',e=>{ if (!G || paused || G.over) return; J.on=true; J.id=e.pointerId; J.ox=J.x=e.clientX-cv.getBoundingClientRect().left; J.oy=J.y=e.clientY-cv.getBoundingClientRect().top; try{ cv.setPointerCapture(e.pointerId); }catch(x){} audio(); e.preventDefault(); });
  cv.addEventListener('pointermove',e=>{ if (!J.on || e.pointerId!==J.id) return; const bx=cv.getBoundingClientRect(); J.x=e.clientX-bx.left; J.y=e.clientY-bx.top;
    const dx=J.x-J.ox, dy=J.y-J.oy, d=Math.hypot(dx,dy); if (d>J.R){ J.ox=J.x-dx/d*J.R; J.oy=J.y-dy/d*J.R; } e.preventDefault(); });
  const up=e=>{ if (e.pointerId===J.id) J.on=false; };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  const km={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};
  window.addEventListener('keydown',e=>{ const k=km[e.key]; if (k){ keys[k]=true; if (G) e.preventDefault(); } else if (e.key==='Escape' && G && !G.over){ if (paused) closeModal(); else ACT.pause(); } });
  window.addEventListener('keyup',e=>{ const k=km[e.key]; if (k) keys[k]=false; });
}

/* ---------- loop ---------- */
function frame(ts){
  requestAnimationFrame(frame);
  const ms=Math.max(0,ts-lastT), dt=Math.min(0.05,ms/1000); lastT=ts;
  if (!G) return;
  if (!paused && !G.over && !document.hidden && !V.ambientOff && ms<250){   // one long gap (coming back from another app, a start-up hitch) is not slow drawing
    V.frameMs+=ms; V.frameN++;
    if (V.frameMs>=2000){ if (V.frameMs/V.frameN>40) V.ambientOff=true; /* under 25 frames a second; a phone that simply caps at 30 keeps its effects */ V.frameMs=V.frameN=0; }
  }
  if (!paused && !G.over){
    let ax=0, ay=0;
    if (J.on){ ax=(J.x-J.ox)/J.R; ay=(J.y-J.oy)/J.R; }
    else { ax=(keys.right?1:0)-(keys.left?1:0); ay=(keys.down?1:0)-(keys.up?1:0); }
    let m=Math.hypot(ax,ay); if (m>1){ ax/=m; ay/=m; } else if (m<0.1){ ax=ay=0; }
    if (!G.started){                                  // the clock waits for the first move
      if (ax||ay||window.__auto){ G.started=true; $('unlock').className='unlock'; }
      else { drawGame(G,dt,J,null); hud(); return; }
    }
    hintT-=dt; if (hintT<=0){ hintT=window.__auto?0.2:0.4; hint=nearestFood(G); }
    if (window.__auto && hint){ const dx=hint.x-G.hole.x, dy=hint.y-G.hole.y, d=Math.hypot(dx,dy); if (d>1){ ax=dx/d; ay=dy/d; } }
    const n=dt>0.03?2:1; for (let i=0;i<n;i++) step(G,dt/n,ax,ay);
    events();
  }
  drawGame(G, paused?0:dt, J, SV.hint?hint:null);
  hud();
  if (G.over && !endShown) finish();
}
async function boot(){
  try{ localStorage.setItem('hatch.t','1'); localStorage.removeItem('hatch.t'); }catch(e){ lsOK=false; }
  SV=await loadSave(); const fresh=!SV; if (!SV) SV=newSave();
  storageOK=lsOK||!!idb;
  V.cv=$('cv'); V.ctx=V.cv.getContext('2d'); resizeView();
  document.addEventListener('click',onClick);
  document.addEventListener('contextmenu',e=>{ if (e.target.tagName!=='TEXTAREA') e.preventDefault(); });
  window.addEventListener('resize',resizeView);
  document.addEventListener('visibilitychange',()=>{ if (document.hidden){ save(true); if (G && !G.over && !paused) ACT.pause(); } else if (G) wakeOn(); });
  window.addEventListener('pagehide',()=>save(true));
  bindInput(); renderMenu();
  if (!SV.seen){ SV.seen=true; save(true); openModal(helpHTML(true)); modalKind='help'; }
  requestAnimationFrame(frame);
}
boot();

</script>
